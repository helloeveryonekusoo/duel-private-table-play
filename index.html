(function defineDeckStore(global) {
  const game = global.DMGame;
  const engine = game.engine;
  const backend = game.net.backend;
  const account = game.net.account;
  const STORE_KEY = "dm-private-table-decks-v2";
  const LEGACY_DECK_KEY = "dm-private-table-deck-v1";

  function newId() {
    return `d${Date.now().toString(36)}${Math.floor(Math.random() * 1679616).toString(36).padStart(4, "0")}`;
  }

  function readLocal() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (parsed && parsed.decks) return { decks: parsed.decks, activeId: parsed.activeId || null };
    } catch (error) { /* 壊れていたら作り直す */ }
    return { decks: {}, activeId: null };
  }

  function writeLocal(store) {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  }

  // 40枚配列は保存せず、常に {カードID: 枚数} で持つ（仕様書 S13）。
  // 配列へ戻すときは ID 順に展開して、同じデッキが常に同じ並びになるようにする。
  function toCardList(record) {
    const counts = (record && record.cards) || {};
    const list = [];
    Object.keys(counts).sort().forEach(function expand(defId) {
      for (let index = 0; index < counts[defId]; index += 1) list.push(defId);
    });
    return list;
  }

  function fromCardList(list) {
    return (list || []).reduce(function count(index, defId) { index[defId] = (index[defId] || 0) + 1; return index; }, {});
  }

  function countCards(record) {
    const counts = (record && record.cards) || {};
    return Object.keys(counts).reduce(function sum(total, defId) { return total + counts[defId]; }, 0);
  }

  function sanitize(record) {
    const cards = {};
    Object.keys((record && record.cards) || {}).forEach(function keep(defId) {
      const amount = Math.max(0, Math.min(engine.RULES.MAX_COPIES, Math.floor(Number(record.cards[defId]) || 0)));
      // ⚠ 手元のプールに無いカードでも消さない。カードプールは起動時にネットワークから
      //   読み込むので、読み込み前や圏外では「知らないカード」になりうる。ここで落とすと
      //   保存のたびにデッキが削られ、他の端末のデータまで壊れる。
      //   使えるかどうかは engine.validateDeck が判定する。
      if (amount > 0) cards[defId] = amount;
    });
    return {
      id: record.id || newId(),
      name: String(record.name || "無名のデッキ").slice(0, 40),
      cards,
      // 特殊ゾーンのカードはまだプールに無いが、後から器を足すと移行が要るので今のうちに持たせる。
      special: (record && record.special) || {},
      updatedAt: Date.now()
    };
  }

  function createStarter(name) {
    return sanitize({ name: name || "スターターデッキ", cards: fromCardList(engine.createDemoDeck(0)) });
  }

  function migrateLegacy(store) {
    if (Object.keys(store.decks).length > 0) return store;
    let legacy = null;
    try { legacy = JSON.parse(localStorage.getItem(LEGACY_DECK_KEY) || "null"); }
    catch (error) { legacy = null; }
    const record = Array.isArray(legacy) && legacy.length ? sanitize({ name: "マイデッキ", cards: fromCardList(legacy) }) : createStarter("スターターデッキ");
    store.decks[record.id] = record;
    store.activeId = record.id;
    writeLocal(store);
    return store;
  }

  function normalizeStore(raw) {
    const decks = {};
    Object.keys((raw && raw.decks) || {}).forEach(function each(id) {
      const record = sanitize(Object.assign({}, raw.decks[id], { id }));
      decks[record.id] = record;
    });
    const activeId = raw && raw.activeId && decks[raw.activeId] ? raw.activeId : Object.keys(decks).sort()[0] || null;
    return { decks, activeId };
  }

  async function loadAll() {
    if (!account.isOnline()) return migrateLegacy(readLocal());
    const token = await account.getToken();
    const remote = await backend.dbGet(`users/${account.state.user.uid}`, token);
    let store = normalizeStore({ decks: (remote && remote.decks) || {}, activeId: remote && remote.activeDeckId });
    // カードプールを読めていない端末が初回移行を走らせると、手元の乏しい情報で
    // クラウドを上書きしてしまう。プールが揃うまで持ち上げは行わない。
    const poolReady = !game.net.cardPool || game.net.cardPool.isComplete();
    if (Object.keys(store.decks).length === 0 && poolReady) {
      // クラウド側が空なら、手元のデッキを初回だけ持ち上げる。
      const local = migrateLegacy(readLocal());
      store = normalizeStore(local);
      await Promise.all(Object.keys(store.decks).map(function upload(id) {
        return backend.dbPut(`users/${account.state.user.uid}/decks/${id}`, withoutId(store.decks[id]), token);
      }));
      if (store.activeId) await backend.dbPut(`users/${account.state.user.uid}/activeDeckId`, store.activeId, token);
    }
    writeLocal(store);
    return store;
  }

  function withoutId(record) {
    // id はキー側に持たせるので、値の中には入れない（ルールの $other 検証に落ちるため）。
    return { name: record.name, cards: record.cards, special: record.special || {}, updatedAt: record.updatedAt };
  }

  async function save(record) {
    const clean = sanitize(record);
    const store = readLocal();
    store.decks[clean.id] = clean;
    if (!store.activeId) store.activeId = clean.id;
    writeLocal(store);
    if (account.isOnline()) {
      const token = await account.getToken();
      await backend.dbPut(`users/${account.state.user.uid}/decks/${clean.id}`, withoutId(clean), token);
    }
    return clean;
  }

  async function remove(id) {
    const store = readLocal();
    delete store.decks[id];
    if (store.activeId === id) store.activeId = Object.keys(store.decks).sort()[0] || null;
    writeLocal(store);
    if (account.isOnline()) {
      const token = await account.getToken();
      await backend.dbDelete(`users/${account.state.user.uid}/decks/${id}`, token);
      await backend.dbPut(`users/${account.state.user.uid}/activeDeckId`, store.activeId, token);
    }
    return store;
  }

  async function setActive(id) {
    const store = readLocal();
    if (!store.decks[id]) return store;
    store.activeId = id;
    writeLocal(store);
    if (account.isOnline()) {
      const token = await account.getToken();
      await backend.dbPut(`users/${account.state.user.uid}/activeDeckId`, id, token);
    }
    return store;
  }

  function duplicate(record) {
    return sanitize({ name: `${record.name} のコピー`.slice(0, 40), cards: Object.assign({}, record.cards), special: Object.assign({}, record.special || {}) });
  }

  game.net.decks = { loadAll, save, remove, setActive, duplicate, createStarter, sanitize, toCardList, fromCardList, countCards, newId, readLocal };
}(globalThis));

(function defineRooms(global) {
  const game = global.DMGame;
  const backend = game.net.backend;
  const account = game.net.account;

  // 紛らわしい 0/O・1/I/L を外し、口頭やメッセージで伝えても取り違えない字種にする。
  const ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const CODE_LENGTH = 6;
  const POLL_INTERVAL_MS = 1500;
  const WAIT_TIMEOUT_MS = 180000;

  let pollTimer = null;

  function generateCode() {
    const bytes = new Uint8Array(CODE_LENGTH);
    global.crypto.getRandomValues(bytes);
    let code = "";
    for (let index = 0; index < CODE_LENGTH; index += 1) code += ALPHABET[bytes[index] % ALPHABET.length];
    return code;
  }

  function normalizeCode(value) {
    return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, CODE_LENGTH);
  }

  function requireAccount() {
    if (!account.isOnline()) throw new Error("部屋コードを使うにはログインが必要です。");
  }

  async function createRoom(offer, cardPoolVersion) {
    requireAccount();
    const token = await account.getToken();
    for (let attempt = 0; attempt < 5; attempt += 1) {
      const code = generateCode();
      const existing = await backend.dbGet(`rooms/${code}`, token);
      if (existing) continue;
      await backend.dbPut(`rooms/${code}`, {
        hostUid: account.state.user.uid,
        hostName: account.state.user.name,
        cardPoolVersion,
        offer,
        createdAt: Date.now()
      }, token);
      return code;
    }
    throw new Error("部屋コードを発行できませんでした。もう一度お試しください。");
  }

  async function fetchRoom(rawCode) {
    requireAccount();
    const code = normalizeCode(rawCode);
    if (code.length !== CODE_LENGTH) throw new Error(`部屋コードは${CODE_LENGTH}文字です。`);
    const token = await account.getToken();
    const room = await backend.dbGet(`rooms/${code}`, token);
    if (!room || !room.offer) throw new Error("その部屋コードは見つかりません。期限切れかもしれません。");
    return Object.assign({ code }, room);
  }

  async function publishAnswer(code, answer, cardPoolVersion) {
    requireAccount();
    const token = await account.getToken();
    await backend.dbPatch(`rooms/${normalizeCode(code)}`, {
      answer,
      guestUid: account.state.user.uid,
      guestName: account.state.user.name,
      guestCardPoolVersion: cardPoolVersion
    }, token);
  }

  // ホストは応答が書き込まれるまで待つ。RTDB の REST しか使わない方針なので、
  // ストリーミングではなく短時間のポーリングで済ませる（接続中の数十秒だけ動く）。
  function waitForAnswer(code, onTick) {
    requireAccount();
    const normalized = normalizeCode(code);
    const startedAt = Date.now();
    cancel();
    return new Promise(function poll(resolve, reject) {
      pollTimer = global.setInterval(async function tick() {
        if (Date.now() - startedAt > WAIT_TIMEOUT_MS) {
          cancel();
          reject(new Error("時間内に相手が参加しませんでした。部屋を作り直してください。"));
          return;
        }
        try {
          const token = await account.getToken();
          const room = await backend.dbGet(`rooms/${normalized}`, token);
          if (!room) { cancel(); reject(new Error("部屋が削除されました。")); return; }
          if (room.answer) { cancel(); resolve(room); return; }
          if (onTick) onTick(Math.round((Date.now() - startedAt) / 1000));
        } catch (error) {
          cancel();
          reject(error);
        }
      }, POLL_INTERVAL_MS);
    });
  }

  function cancel() {
    if (pollTimer) global.clearInterval(pollTimer);
    pollTimer = null;
  }

  async function close(code) {
    cancel();
    if (!code || !account.isOnline()) return;
    try {
      const token = await account.getToken();
      await backend.dbDelete(`rooms/${normalizeCode(code)}`, token);
    } catch (error) { /* 後片付けの失敗で対戦を止めない */ }
  }

  game.net.rooms = { createRoom, fetchRoom, publishAnswer, waitForAnswer, cancel, close, normalizeCode, CODE_LENGTH };
}(globalThis));

(function definePeerLink(global) {
  const game = global.DMGame;
  let peer = null;
  let channel = null;
  let role = null;
  let handlers = { message:null, open:null, status:null };

  function report(status) {
    if (handlers.status) handlers.status(status);
  }

  function waitForIce(connection) {
    if (connection.iceGatheringState === "complete") return Promise.resolve();
    return new Promise(function wait(resolve) {
      function changed() {
        if (connection.iceGatheringState === "complete") {
          connection.removeEventListener("icegatheringstatechange", changed);
          resolve();
        }
      }
      connection.addEventListener("icegatheringstatechange", changed);
      global.setTimeout(resolve, 5000);
    });
  }

  function bindChannel(nextChannel) {
    channel = nextChannel;
    channel.addEventListener("open", function opened() { report("connected"); if (handlers.open) handlers.open(role); });
    channel.addEventListener("close", function closed() { report("disconnected"); });
    channel.addEventListener("message", function received(event) {
      try { if (handlers.message) handlers.message(JSON.parse(event.data), role); }
      catch (error) { report("invalid-message"); }
    });
  }

  function createPeer() {
    if (peer) peer.close();
    // 経路サーバーの一覧は設定側に出す。TURN を足すときにこのファイルを触らずに済む。
    const iceServers = (game.net.config && game.net.config.iceServers) || [{ urls:"stun:stun.l.google.com:19302" }];
    peer = new RTCPeerConnection({ iceServers });
    peer.addEventListener("connectionstatechange", function changed() { report(peer.connectionState); });
    return peer;
  }

  async function createHostOffer() {
    role = "host";
    const connection = createPeer();
    bindChannel(connection.createDataChannel("private-table", { ordered:true }));
    await connection.setLocalDescription(await connection.createOffer());
    await waitForIce(connection);
    report("offer-ready");
    return JSON.stringify(connection.localDescription);
  }

  async function createGuestAnswer(offerText) {
    role = "guest";
    const connection = createPeer();
    connection.addEventListener("datachannel", function connected(event) { bindChannel(event.channel); });
    await connection.setRemoteDescription(JSON.parse(offerText));
    await connection.setLocalDescription(await connection.createAnswer());
    await waitForIce(connection);
    report("answer-ready");
    return JSON.stringify(connection.localDescription);
  }

  async function acceptGuestAnswer(answerText) {
    if (!peer || role !== "host") throw new Error("先に部屋を作成してください。");
    await peer.setRemoteDescription(JSON.parse(answerText));
    report("connecting");
  }

  function send(message) {
    if (!channel || channel.readyState !== "open") return false;
    channel.send(JSON.stringify(message));
    return true;
  }

  function configure(nextHandlers) {
    handlers = Object.assign(handlers, nextHandlers || {});
  }

  // 接続をやり直すとき、前の RTCPeerConnection を残すと ICE が二重に走るので明示的に閉じる。
  function close() {
    if (channel) { try { channel.close(); } catch (error) { /* 既に閉じている */ } }
    if (peer) { try { peer.close(); } catch (error) { /* 既に閉じている */ } }
    channel = null;
    peer = null;
    role = null;
  }

  game.net.peer = { createHostOffer, createGuestAnswer, acceptGuestAnswer, send, configure, close, isOpen:function isOpen() { return Boolean(channel && channel.readyState === "open"); }, getRole:function getRole() { return role; } };
}(globalThis));

(function defineSession(global) {
  const game = global.DMGame;
  const engine = game.engine;
  const account = game.net.account;
  const deckStore = game.net.decks;
  const cardPool = game.net.cardPool;
  const rooms = game.net.rooms;
  const SAVE_KEY = "dm-private-table-save-v1";
  const SETTINGS_KEY = "dm-private-table-settings-v1";

  const session = {
    screen: "auth", state: null, mode: "cpu", viewerIdx: 0, selectedAttacker: null, pendingPicks: [],
    notice: "", error: "", replay: [], replaySetup: null, replayIndex: 0,
    deckStore: { decks: {}, activeId: null }, deckDraft: null, deckSearch: "",
    authForm: { mode: "signin", email: "", password: "", name: "", invite: "" },
    settings: { fastMotion: false }, cpuTimer: null, autoTimer: null,
    linkRole: null, linkMode: "code", roomCode: "", roomInput: "", waitedSeconds: 0,
    linkSignal: "", linkInput: "", connectionStatus: "idle", opponentName: ""
  };

  function safeLoad(key, fallback) {
    try { const value = localStorage.getItem(key); return value ? JSON.parse(value) : fallback; }
    catch (error) { return fallback; }
  }

  function saveSession() {
    if (session.state && session.mode !== "online-host" && session.mode !== "online-guest" && session.mode !== "replay") localStorage.setItem(SAVE_KEY, JSON.stringify({ state:session.state, mode:session.mode, replay:session.replay, replaySetup:session.replaySetup }));
  }

  function render() {
    if (game.ui && game.ui.renderApplication) game.ui.renderApplication(session);
  }

  function activeDeckRecord() {
    const store = session.deckStore;
    return (store.activeId && store.decks[store.activeId]) || null;
  }

  // 対戦開始時は必ずここを通す。40枚に満たないデッキで始めるとエンジンが
  // 山札切れ判定に巻き込まれるため、妥当でなければ既定デッキへ落とす。
  function loadDeck() {
    const record = activeDeckRecord();
    const list = record ? deckStore.toCardList(record) : [];
    return engine.validateDeck(list).valid ? list : engine.createDemoDeck(0);
  }

  function playerName() {
    return (account.state.user && account.state.user.name) || "あなた";
  }

  function currentActor() {
    if (!session.state) return 0;
    return session.state.pending ? session.state.pending.playerIdx : session.state.activeIdx;
  }

  function startGame(mode, setup) {
    session.mode = mode || "cpu";
    const names = setup ? setup.names : (session.mode === "cpu" ? [playerName(), "CPU・シグマ"] : ["プレイヤー1", "プレイヤー2"]);
    const decks = setup ? setup.decks : [loadDeck(), engine.createDemoDeck(7)];
    session.replaySetup = { seed:Date.now() % 2147483647, names:engine.clone(names), decks:engine.clone(decks) };
    session.state = engine.createGame(session.replaySetup);
    session.screen = "game";
    session.viewerIdx = 0;
    session.selectedAttacker = null;
    session.error = "";
    session.notice = "";
    session.replay = [];
    saveSession();
    render();
    scheduleTurnProgress();
  }

  function resumeGame() {
    const saved = safeLoad(SAVE_KEY, null);
    if (!saved || !saved.state) return false;
    session.state = saved.state;
    session.mode = saved.mode || "cpu";
    session.replay = saved.replay || [];
    session.replaySetup = saved.replaySetup || null;
    session.screen = "game";
    session.viewerIdx = session.mode === "cpu" ? 0 : currentActor();
    session.error = "";
    render();
    scheduleTurnProgress();
    return true;
  }

  // 複数選ぶ問いかけで、答えを1つ足す。「同じものを2回選んでもよい」問いかけ
  // （pending.allowRepeat）だけは重ねて選べる。それ以外は押すたびに入り切りする。
  function pickPending(value) {
    const pending = session.state && session.state.pending;
    if (!pending) return;
    const limit = pending.max == null ? (pending.options || []).length : pending.max;
    const picks = session.pendingPicks || (session.pendingPicks = []);
    const at = picks.indexOf(value);
    if (!pending.allowRepeat && at >= 0) picks.splice(at, 1);
    else if (picks.length < limit) picks.push(value);
    render();
  }

  function dispatchAction(action, forcedPlayerIdx) {
    if (!session.state) return { ok:false, error:"対戦がありません。" };
    if (session.mode === "replay") return { ok:false, error:"棋譜の再生中です。" };
    if (session.mode === "online-guest") {
      const sent = game.net.peer.send({ type:"action", action:engine.clone(action) });
      session.error = sent ? "" : "ホストとの接続がありません。";
      render();
      return { ok:sent, error:session.error };
    }
    const actor = forcedPlayerIdx == null ? currentActor() : forcedPlayerIdx;
    const result = engine.applyAction(session.state, action, actor);
    if (result.ok) {
      session.replay.push({ playerIdx:actor, action:engine.clone(action) });
      session.error = "";
      session.selectedAttacker = null;
      // 問いかけが入れ替わるので、選びかけの答えは持ち越さない。
      session.pendingPicks = [];
      if (session.mode === "hotseat") session.viewerIdx = currentActor();
      saveSession();
    } else session.error = result.error;
    render();
    if (result.ok && session.mode === "online-host") broadcastGuestState();
    if (result.ok) scheduleTurnProgress();
    return result;
  }

  // どのプレイヤーをこの端末が操作しているか。オンラインでは自分の番だけ
  // 自動進行させないと、ホストとゲストが二重に進めてしまう。
  function localControls(actorIdx) {
    if (session.mode === "cpu") return actorIdx === 0;
    if (session.mode === "hotseat") return true;
    if (session.mode === "online-host") return actorIdx === 0;
    if (session.mode === "online-guest") return actorIdx === 1;
    return false;
  }

  function scheduleAutoAdvance() {
    if (session.autoTimer) global.clearTimeout(session.autoTimer);
    session.autoTimer = null;
    const state = session.state;
    if (!state || state.winner != null || state.pending) return;
    const actor = state.activeIdx;
    if (!localControls(actor)) return;
    if (engine.hasPhaseChoice(state, actor)) return;
    // 一拍おくのは、何が起きたか読めないまま盤面が飛ぶのを防ぐため。
    session.autoTimer = global.setTimeout(function step() {
      session.autoTimer = null;
      dispatchAction({ type:"ADVANCE_PHASE" }, actor);
    }, session.settings.fastMotion ? 40 : 300);
  }

  function scheduleTurnProgress() {
    scheduleCpu();
    scheduleAutoAdvance();
  }

  function scheduleCpu() {
    if (session.cpuTimer) global.clearTimeout(session.cpuTimer);
    if (!session.state || session.mode !== "cpu" || session.state.winner != null || currentActor() !== 1) return;
    session.cpuTimer = global.setTimeout(function cpuStep() {
      const action = engine.chooseCpuAction(session.state, 1);
      if (action) dispatchAction(action, 1);
    }, session.settings.fastMotion ? 60 : 420);
  }

  /* ---------- アカウント ---------- */

  function setAuthField(field, value) {
    session.authForm[field] = value;
  }

  function setAuthMode(mode) {
    session.authForm.mode = mode;
    account.state.error = "";
    render();
  }

  function submitAuth() {
    const form = session.authForm;
    const work = form.mode === "signup"
      ? account.signUp(form.email, form.password, form.name, form.invite)
      : account.signIn(form.email, form.password);
    return work.then(function entered() {
      session.authForm.password = "";
      return afterAuthChange();
    }).catch(function failed() { render(); });
  }

  function signOut() {
    cardPool.clearCache();
    game.net.peer.close();
    rooms.cancel();
    account.signOut();
    session.deckStore = { decks:{}, activeId:null };
    session.screen = "auth";
    session.state = null;
    render();
  }

  function afterAuthChange() {
    if (account.state.status === "signed-in" || account.state.status === "local") {
      // カードプールを先に読む。デッキはカードのIDしか持たないので、
      // プールが揃う前に読むと中身が「知らないカード」だらけになる。
      return cardPool.load().then(refreshDecks).then(function ready() {
        session.screen = "home";
        render();
      });
    }
    session.screen = "auth";
    render();
    return Promise.resolve();
  }

  function boot() {
    // 前回取得したプールをすぐ載せる。通信を待たずに正しい札で描き始められる。
    cardPool.restoreCache();
    render();
    return account.restore().then(afterAuthChange).catch(function failed(error) {
      session.error = error.message;
      session.screen = "auth";
      render();
    });
  }

  /* ---------- デッキ ---------- */

  function refreshDecks() {
    return deckStore.loadAll().then(function loaded(store) {
      session.deckStore = store;
      return store;
    }).catch(function failed(error) {
      session.error = `デッキを読み込めませんでした：${error.message}`;
      session.deckStore = deckStore.readLocal();
      return session.deckStore;
    });
  }

  // キーワード能力のルール集。どこから開いても、戻り先はホームで揃える。
  function openKeywords() {
    session.keywordSearch = "";
    session.screen = "keywords";
    session.error = "";
    session.notice = "";
    render();
  }

  function setKeywordSearch(value) {
    session.keywordSearch = value;
    render();
  }

  // 文明での絞り込み。同じものをもう一度押したら解除する。
  function setDeckCivFilter(value) {
    session.deckCivFilter = session.deckCivFilter === value ? "" : value;
    render();
  }

  function openDeckList() {
    session.screen = "decks";
    session.error = "";
    session.notice = "";
    render();
    refreshDecks().then(render);
  }

  function editDeck(deckId) {
    const record = session.deckStore.decks[deckId];
    if (!record) { session.error = "そのデッキは見つかりません。"; render(); return; }
    session.deckDraft = { id:record.id, name:record.name, cards:Object.assign({}, record.cards), special:Object.assign({}, record.special || {}) };
    session.deckSearch = "";
    session.deckCivFilter = "";
    session.screen = "deck";
    session.error = "";
    session.notice = "";
    render();
  }

  function newDeck() {
    session.deckDraft = { id:deckStore.newId(), name:`新しいデッキ ${Object.keys(session.deckStore.decks).length + 1}`, cards:{}, special:{} };
    session.deckSearch = "";
    session.deckCivFilter = "";
    session.screen = "deck";
    session.error = "";
    session.notice = "";
    render();
  }

  // カードプールと一緒に配られたデッキリストを、自分のデッキとして取り込む。
  // 取り込んだあとは普通のデッキなので、そのまま編集できる。
  function importPresetDeck(presetId) {
    const preset = (engine.REAL_DECKS || []).find(function match(item) { return item.id === presetId; });
    if (!preset) return Promise.resolve(false);
    const record = deckStore.sanitize({ name:preset.name, cards:deckStore.fromCardList(preset.cards) });
    return deckStore.save(record).then(function saved() {
      session.notice = `「${preset.name}」を取り込みました。`;
      return refreshDecks();
    }).then(function done() { render(); return true; }).catch(function failed(error) { session.error = error.message; render(); return false; });
  }

  function duplicateDeck(deckId) {
    const record = session.deckStore.decks[deckId];
    if (!record) return Promise.resolve(false);
    return deckStore.save(deckStore.duplicate(record)).then(function saved() {
      session.notice = "デッキを複製しました。";
      return refreshDecks();
    }).then(function done() { render(); return true; }).catch(function failed(error) { session.error = error.message; render(); return false; });
  }

  function removeDeck(deckId) {
    const record = session.deckStore.decks[deckId];
    if (!record) return Promise.resolve(false);
    return deckStore.remove(deckId).then(function removed() {
      session.notice = "デッキを削除しました。";
      return refreshDecks();
    }).then(function done() { render(); return true; }).catch(function failed(error) { session.error = error.message; render(); return false; });
  }

  function useDeck(deckId) {
    return deckStore.setActive(deckId).then(function done() {
      return refreshDecks();
    }).then(function ready() {
      const record = activeDeckRecord();
      session.notice = record ? `「${record.name}」を使用デッキにしました。` : "";
      render();
      return true;
    }).catch(function failed(error) { session.error = error.message; render(); return false; });
  }

  function setDeckName(value) {
    if (session.deckDraft) session.deckDraft.name = value;
  }

  function changeDeckCount(defId, delta) {
    if (!session.deckDraft) return;
    const next = Math.max(0, Math.min(engine.RULES.MAX_COPIES, (session.deckDraft.cards[defId] || 0) + delta));
    if (next === 0) delete session.deckDraft.cards[defId];
    else session.deckDraft.cards[defId] = next;
    session.error = "";
    session.notice = "";
    render();
  }

  function saveDeck() {
    if (!session.deckDraft) return Promise.resolve(false);
    const draft = session.deckDraft;
    if (!String(draft.name || "").trim()) { session.error = "デッキ名を入力してください。"; render(); return Promise.resolve(false); }
    const validation = engine.validateDeck(deckStore.toCardList(draft));
    if (!validation.valid) { session.error = validation.errors.join(" "); render(); return Promise.resolve(false); }
    return deckStore.save(draft).then(function saved(record) {
      session.notice = `「${record.name}」を保存しました。`;
      session.error = "";
      return refreshDecks();
    }).then(function done() {
      session.screen = "decks";
      render();
      return true;
    }).catch(function failed(error) { session.error = error.message; render(); return false; });
  }

  function fillStarterDeck() {
    if (!session.deckDraft) return;
    if (engine.isFictionalPool()) {
      session.error = "カードプールが届いていないので、入れるカードがありません。";
      render();
      return;
    }
    session.deckDraft.cards = deckStore.fromCardList(engine.createDemoDeck(0));
    session.notice = "標準の40枚を読み込みました。";
    session.error = "";
    render();
  }

  /* ---------- 通信対戦 ---------- */

  function broadcastGuestState() {
    if (session.state) game.net.peer.send({ type:"state", state:engine.redactStateFor(session.state, 1) });
  }

  function resetLink(roleName) {
    game.net.peer.close();
    rooms.cancel();
    session.screen = "connect";
    session.linkRole = roleName;
    session.linkSignal = "";
    session.linkInput = "";
    session.roomCode = "";
    session.waitedSeconds = 0;
    session.opponentName = "";
    session.connectionStatus = "preparing";
    session.error = "";
  }

  function openOnline(roleName) {
    resetLink(roleName);
    // ログインしていなければ部屋コードを発行できないので、旧来の手動交換に落とす。
    session.linkMode = account.isOnline() ? "code" : "manual";
    render();
    if (roleName === "host") hostPrepare();
  }

  function setLinkMode(mode) {
    session.linkMode = mode;
    session.error = "";
    render();
    if (mode === "code" && session.linkRole === "host" && !session.roomCode) hostPrepare();
  }

  // ホスト側の手順：オファーを作り、部屋コードとして公開し、応答が書かれるまで待つ。
  function hostPrepare() {
    game.net.peer.createHostOffer().then(function ready(signal) {
      session.linkSignal = signal;
      session.connectionStatus = "offer-ready";
      render();
      if (session.linkMode !== "code") return null;
      return rooms.createRoom(signal, engine.CARD_POOL_VERSION).then(function published(code) {
        session.roomCode = code;
        session.connectionStatus = "waiting-guest";
        render();
        return rooms.waitForAnswer(code, function tick(seconds) { session.waitedSeconds = seconds; render(); });
      }).then(function answered(room) {
        if (room.guestCardPoolVersion && room.guestCardPoolVersion !== engine.CARD_POOL_VERSION) {
          throw new Error("相手とカードプールのバージョンが違います。両者が同じ版を開いてください。");
        }
        session.opponentName = room.guestName || "ゲスト";
        session.connectionStatus = "connecting";
        render();
        return game.net.peer.acceptGuestAnswer(room.answer);
      });
    }).catch(function failed(error) {
      session.error = error.message;
      session.connectionStatus = "failed";
      render();
    });
  }

  // ゲスト側の手順：部屋コードでオファーを取得し、応答を書き戻す。
  function joinByCode() {
    session.connectionStatus = "preparing";
    session.error = "";
    render();
    let joined = null;
    rooms.fetchRoom(session.roomInput).then(function found(room) {
      joined = room;
      if (room.cardPoolVersion && room.cardPoolVersion !== engine.CARD_POOL_VERSION) {
        throw new Error("相手とカードプールのバージョンが違います。両者が同じ版を開いてください。");
      }
      session.opponentName = room.hostName || "ホスト";
      session.roomCode = room.code;
      return game.net.peer.createGuestAnswer(room.offer);
    }).then(function answered(signal) {
      session.linkSignal = signal;
      session.connectionStatus = "connecting";
      render();
      return rooms.publishAnswer(joined.code, signal, engine.CARD_POOL_VERSION);
    }).catch(function failed(error) {
      session.error = error.message;
      session.connectionStatus = "failed";
      render();
    });
  }

  function createGuestAnswer() {
    session.connectionStatus = "preparing";
    render();
    game.net.peer.createGuestAnswer(session.linkInput).then(function ready(signal) { session.linkSignal = signal; session.connectionStatus = "answer-ready"; render(); }).catch(function failed(error) { session.error = `接続情報を確認してください：${error.message}`; render(); });
  }

  function acceptGuestAnswer() {
    game.net.peer.acceptGuestAnswer(session.linkInput).catch(function failed(error) { session.error = `応答情報を確認してください：${error.message}`; render(); });
  }

  function startOnlineMatch(hello) {
    const guestDeck = engine.validateDeck(hello.deck || []).valid ? hello.deck : engine.createDemoDeck(7);
    startGame("online-host", {
      names: [playerName(), hello.name || "ゲスト"],
      decks: [loadDeck(), guestDeck]
    });
    game.net.peer.send({ type:"meta", names:session.state.players.map(function name(player) { return player.name; }) });
    broadcastGuestState();
  }

  function receivePeerMessage(message, roleName) {
    if (roleName === "host" && message.type === "hello") {
      if (message.cardPoolVersion && message.cardPoolVersion !== engine.CARD_POOL_VERSION) {
        game.net.peer.send({ type:"error", message:"カードプールのバージョンが違います。" });
        session.error = "相手とカードプールのバージョンが違います。";
        render();
        return;
      }
      rooms.close(session.roomCode);
      startOnlineMatch(message);
      return;
    }
    if (roleName === "host" && message.type === "action" && session.state) {
      const result = engine.applyAction(session.state, message.action, 1);
      if (!result.ok) game.net.peer.send({ type:"error", message:result.error });
      else { session.replay.push({ playerIdx:1, action:engine.clone(message.action) }); render(); }
      broadcastGuestState();
      return;
    }
    if (roleName === "guest" && message.type === "state") {
      session.state = message.state;
      session.mode = "online-guest";
      session.viewerIdx = 1;
      session.screen = "game";
      session.error = "";
      render();
      scheduleAutoAdvance();
      return;
    }
    if (roleName === "guest" && message.type === "meta") {
      session.opponentName = (message.names || [])[0] || session.opponentName;
      return;
    }
    if (message.type === "error") { session.error = message.message; render(); }
  }

  function rebuildReplay(index) {
    if (!session.replaySetup) return false;
    const bounded = Math.max(0, Math.min(session.replay.length, index));
    const state = engine.createGame(engine.clone(session.replaySetup));
    for (let actionIndex = 0; actionIndex < bounded; actionIndex += 1) {
      const entry = session.replay[actionIndex];
      const result = engine.applyAction(state, entry.action, entry.playerIdx);
      if (!result.ok) { session.error = `棋譜${actionIndex + 1}手目を再生できません：${result.error}`; break; }
    }
    session.state = state;
    session.replayIndex = bounded;
    session.mode = "replay";
    session.viewerIdx = 0;
    session.screen = "game";
    render();
    return true;
  }

  function openReplay() {
    const saved = safeLoad(SAVE_KEY, null);
    if (!saved || !saved.replaySetup || !saved.replay) return false;
    session.replaySetup = saved.replaySetup;
    session.replay = saved.replay;
    return rebuildReplay(0);
  }

  game.net.peer.configure({
    message: receivePeerMessage,
    status: function status(value) { session.connectionStatus = value; render(); },
    open: function open(roleName) {
      // 開始の合図はゲストから送る。ホストは相手のデッキと表示名を受け取ってから
      // ゲームを作るので、この時点ではまだ state を用意しない。
      session.connectionStatus = "connected";
      if (roleName === "guest") {
        rooms.close(session.roomCode);
        session.mode = "online-guest";
        session.viewerIdx = 1;
        game.net.peer.send({ type:"hello", name:playerName(), deck:loadDeck(), cardPoolVersion:engine.CARD_POOL_VERSION });
      }
      render();
    }
  });

  Object.assign(session, {
    startGame, resumeGame, dispatchAction, pickPending, saveSession, render, boot, loadDeck, activeDeckRecord,
    setAuthField, setAuthMode, submitAuth, signOut, refreshDecks, afterAuthChange,
    openDeckList, editDeck, newDeck, duplicateDeck, importPresetDeck, setDeckCivFilter, openKeywords, setKeywordSearch, removeDeck, useDeck, setDeckName, changeDeckCount, saveDeck, fillStarterDeck,
    scheduleTurnProgress, localControls,
    openOnline, setLinkMode, joinByCode, createGuestAnswer, acceptGuestAnswer, broadcastGuestState, openReplay, rebuildReplay
  });
  session.settings = Object.assign(session.settings, safeLoad(SETTINGS_KEY, {}));
  session.saveSettings = function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(session.settings)); };
  session.account = account.state;
  session.cardPool = cardPool.state;
  // ログイン処理中のボタン無効化などを反映させるため、認証状態の変化で再描画する。
  account.onChange(render);
  game.session = session;
}(globalThis));


/* source: src/js/ui/render.js */
(function defineRenderers(global) {
  const game = global.DMGame;
  const engine = game.engine;
  const ui = game.ui || (game.ui = {});

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>'"]/g, function replace(character) {
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" })[character];
    });
  }

  function joinLines(parts) {
    return parts.filter(Boolean).join(String.fromCharCode(10) + String.fromCharCode(10));
  }

  function civName(civs) {
    return (civs || []).map(function label(civ) { return engine.CIV_LABELS[civ] || civ; }).join("/");
  }

  // パワーアタッカーのように値を伴うキーワードは、値まで出さないと判断に使えない。
  function keywordLabel(state, entity, keyword) {
    const label = engine.KEYWORD_LABELS[keyword] || keyword;
    const args = engine.getKeywordArg(state, entity, keyword);
    if (!args) return label;
    if (keyword === "powerAttacker" && args.value) return `${label}+${args.value}`;
    return label;
  }

  function keywordBadges(state, entity) {
    return engine.getKeywords(state, entity).map(function badge(keyword) {
      return `<span class="keyword">${escapeHtml(keywordLabel(state, entity, keyword))}</span>`;
    }).join("");
  }

  // キーワードでない能力は、原文を読まないと何が起きるか分からない。
  // 定義から組み立てた処理内容を、原文とは別に並べて見せる。
  function effectNotes(definition, size) {
    if (size === "chip" || size === "mini") return "";
    const lines = engine.describeAbilities(definition);
    if (!lines.length) return "";
    return `<ul class="effect-notes">${lines.map(function note(line) {
      return `<li>${escapeHtml(line)}</li>`;
    }).join("")}</ul>`;
  }

  function civBars(civs) {
    return `<span class="civ-bars" aria-hidden="true">${civs.map(function bar(civ) { return `<i class="civ-${escapeHtml(civ)}"></i>`; }).join("")}</span>`;
  }

  function renderCard(state, entity, options) {
    const settings = options || {};
    if (!entity || entity.hidden || !entity.defId) return `<div class="card card-back ${settings.className || ""}" aria-label="非公開カード"><span>PRIVATE</span></div>`;
    const definition = engine.faceDef(state, entity);
    const power = definition.type === "creature" ? engine.getPower(state, entity) : null;
    const changed = power != null && power !== definition.power;
    const classes = ["card", `size-${settings.size || "full"}`, entity.tapped ? "is-tapped" : "", entity.sick ? "is-sick" : "", settings.ready ? "is-ready" : "", settings.targetable ? "is-targetable" : "", settings.selected ? "is-selected" : ""].filter(Boolean).join(" ");
    const attrs = settings.action ? `data-action="${settings.action}" data-uid="${escapeHtml(entity.uid)}" role="button" tabindex="0"` : "";
    const stack = entity.under && entity.under.length ? `<span class="stack-count" title="進化元">+${entity.under.length}</span>` : "";
    // ツインパクトは面が未確定のあいだ、2面ぶんのテキストを改行で見せる
    const twinpact = definition.type === "twinpact" ? '<span class="twinpact-tag">ツインパクト</span>' : "";
    // タマシードはバトルゾーンに並ぶがクリーチャーではない。パワーも出ないので、
    // 何なのかを名乗らせないと、攻撃できない理由が分からない。
    const tamaseed = definition.type === "tamaseed" ? '<span class="twinpact-tag is-tamaseed">タマシード</span>' : "";
    // 裏向きのマナは持ち主だけが表面を見られる。見えていても「裏向き」だと
    // 分からないと、無色1マナしか出ない理由が読めない。
    const faceDown = entity.faceDown ? '<span class="twinpact-tag is-facedown">裏向き</span>' : "";
    const hyper = engine.isHyper(state, entity) ? '<span class="hyper-tag">ハイパーモード</span>' : "";
    const bodyText = escapeHtml(definition.text).split(String.fromCharCode(10)).join("<br>");
    const notes = effectNotes(definition, settings.size);
    const noteTitle = engine.describeAbilities(definition).join(String.fromCharCode(10));
    return `<article class="${classes}" ${attrs} data-focus="card-${escapeHtml(entity.uid)}" title="${escapeHtml(joinLines([definition.text, noteTitle]))}">
      ${civBars(definition.civs)}<header><b class="cost">${definition.cost}</b><span>${escapeHtml(civName(definition.civs))}</span></header>
      <div class="card-name">${escapeHtml(definition.name)}</div><div class="card-race">${escapeHtml((definition.races || [definition.type === "spell" ? "呪文" : ""]).join(" / "))}</div>
      <p>${bodyText}</p>${notes}<footer><span class="badges">${keywordBadges(state, entity)}</span>${power == null ? "" : `<strong class="power ${changed ? "is-modified" : ""}">${power}</strong>`}</footer>
      ${entity.sick ? '<span class="state-tag">召喚酔い</span>' : ""}${stack}${twinpact}${tamaseed}${faceDown}${hyper}</article>`;
  }

  // 墓地は枚数だけ見えていればよかったが、「この呪文を自分の墓地から唱えて
  // もよい」と書かれたカードは、押せなければ書いてあることが起こせない。
  // 中身を並べ、今そこから使える札だけを押せるようにする。
  function renderGraveyard(state, player, viewerIdx, canControl) {
    if (!player.graveyard.length) return "";
    const cards = player.graveyard.map(function card(entity) {
      const usable = canControl && !state.pending && Boolean(engine.altPlayable(state, viewerIdx, entity, "graveyard"));
      return renderCard(state, entity, { size:"chip", ready:usable, action:usable ? "play" : "" });
    }).join("");
    return `<section class="zone graveyard-zone"><div class="zone-heading"><span>GRAVEYARD</span><b>${player.graveyard.length}</b></div><div class="mana-cards">${cards}</div></section>`;
  }

  // 表向きのシールド（G城など）は中身が見えている以上、札として見せないと
  // 何が効いているのか分からない。伏せたシールドは従来どおり枚数だけ。
  function renderShields(state, player, label) {
    const row = player.shields.map(function shield(entity) {
      // シールドの上に置かれた表向きのカード（紋章）は、伏せたシールドでも見える。
      const crests = (entity && entity.crests || []).map(function crest(card) {
        return renderCard(state, card, { size:"chip", className:"shield-crest" });
      }).join("");
      const face = (!entity || entity.hidden || !entity.defId)
        ? '<i class="shield" aria-label="伏せられたシールド"></i>'
        : renderCard(state, entity, { size:"chip", className:"shield-open" });
      return crests ? `<span class="shield-stack">${face}${crests}</span>` : face;
    }).join("") || '<span class="empty-zone">NO SHIELD</span>';
    return `<section class="zone shields${player.shields.length === 1 ? " is-danger" : ""}" aria-label="${escapeHtml(label)}のシールド"><span class="zone-label">SHIELD <b>${player.shields.length}</b></span><div class="shield-row">${row}</div></section>`;
  }

  function zoneSize(count) {
    if (count >= 10) return "chip";
    if (count >= 7) return "mini";
    if (count >= 5) return "compact";
    return "full";
  }

  function renderBattleZone(state, player, playerIdx, session, opponent) {
    const size = zoneSize(player.battle.length);
    return `<section class="zone battle-zone ${opponent ? "opponent" : "self"}"><div class="zone-heading"><span>${opponent ? "OPPONENT FIELD" : "YOUR FIELD"}</span><b>${player.battle.length}</b></div><div class="card-grid">${player.battle.map(function card(entity) {
      const selected = session.selectedAttacker === entity.uid;
      const ready = !opponent && playerIdx === state.activeIdx && engine.canAttack(state, entity, { kind:"player" });
      const attackerFound = session.selectedAttacker ? engine.findEntity(state, session.selectedAttacker) : null;
      const targetable = Boolean(opponent && attackerFound && engine.canAttack(state, attackerFound.entity, { kind:"creature", uid:entity.uid }));
      return renderCard(state, entity, { size, ready, targetable, selected, action:targetable ? "attack-creature" : (ready ? "select-attacker" : "") });
    }).join("") || '<span class="empty-zone">EMPTY FIELD</span>'}</div></section>`;
  }

  function manaSummary(state, player) {
    const counts = {};
    player.mana.forEach(function count(entity) { engine.faceDef(state, entity).civs.forEach(function civ(name) { counts[name] = (counts[name] || 0) + 1; }); });
    return Object.keys(counts).map(function item(civ) { return `<span class="mana-civ civ-text-${civ}">${engine.CIV_LABELS[civ]}${counts[civ]}</span>`; }).join("");
  }

  function renderRequirement(state, viewerIdx) {
    if (state.winner != null) return `${state.players[state.winner].name}の勝利 — ${state.reason}`;
    if (state.pending) return state.pending.playerIdx === viewerIdx ? state.pending.prompt : "相手の選択を待っています。";
    const owner = state.activeIdx === viewerIdx ? "あなたのターン" : `${state.players[state.activeIdx].name}のターン`;
    const guidance = { start:"ターンを開始してください", draw:"ドロー完了 — 次へ進んでください", charge:"手札から1枚をマナに置くか、スキップできます", main:"カードを使うか、攻撃ステップへ進んでください", attack:"攻撃可能なクリーチャーを選ぶか、ターン終了へ進んでください", end:"ターンを終了してください" };
    return `${owner} ／ ${guidance[state.phase]}`;
  }

  // 答えを2つ以上返す問いかけ（「2つ選ぶ」「好きな数選ぶ」）は、押した時点では
  // 確定させず、選んでから「決定」でまとめて返す。1つだけの問いかけは
  // 押せば決まるので、確認のひと手間を挟まない。
  function renderPending(state, viewerIdx, picks) {
    if (!state.pending || state.pending.playerIdx !== viewerIdx) return "";
    const pending = state.pending;
    const limit = pending.max == null ? (pending.options || []).length : pending.max;
    const multi = limit > 1;
    const chosen = multi ? (picks || []) : [];
    const options = (pending.options || []).map(function option(item) {
      const value = typeof item === "object" ? item.value : item;
      const label = typeof item === "object" ? item.label : item;
      if (!multi) return `<button class="choice" data-action="resolve-pending" data-value="${escapeHtml(value)}">${escapeHtml(label)}</button>`;
      const times = chosen.filter(function same(picked) { return picked === value; }).length;
      return `<button class="choice${times ? " is-picked" : ""}" data-action="pick-pending" data-value="${escapeHtml(value)}">${escapeHtml(label)}${times > 1 ? `<b>×${times}</b>` : ""}</button>`;
    }).join("");
    const need = pending.min || 0;
    const footer = multi
      ? `<div class="pending-footer"><span>${chosen.length} / ${limit}${need ? `（${need}つ以上）` : ""}</span><button data-action="clear-pending"${chosen.length ? "" : " disabled"}>選び直す</button><button class="primary" data-action="confirm-pending"${chosen.length < need ? " disabled" : ""}>決定</button></div>`
      : "";
    return `<div class="pending-panel" role="dialog" aria-modal="true" aria-labelledby="pending-title"><div><span class="eyebrow">DECISION</span><h2 id="pending-title">${escapeHtml(pending.prompt)}</h2><div class="pending-options">${options}</div>${footer}</div></div>`;
  }

  // 汎用の「次へ」ではなく、押したら何が起きるかを書く。
  // 選択の余地が無いステップ（start / draw / end）はそもそもボタンを出さない。
  const STEP_LABELS = {
    charge: "マナを置かずに進む",
    main: "攻撃ステップへ",
    attack: "ターンを終了する"
  };

  function renderGame(session) {
    const state = session.state;
    const viewerIdx = session.mode === "cpu" ? 0 : session.viewerIdx;
    const view = engine.redactStateFor(state, viewerIdx);
    const self = view.players[viewerIdx];
    const opponentIdx = 1 - viewerIdx;
    const opponent = view.players[opponentIdx];
    const originalSelf = state.players[viewerIdx];
    const canControl = session.mode !== "replay" && (session.mode === "hotseat" || session.mode === "online-host" || session.mode === "online-guest" || viewerIdx === 0);
    const handAction = state.phase === "charge" ? "charge" : (state.phase === "main" ? "play" : "");
    const myTurn = canControl && !state.pending && state.activeIdx === viewerIdx && state.winner == null;
    const hasChoice = engine.hasPhaseChoice(state, viewerIdx);
    const stepLabel = STEP_LABELS[state.phase];
    return `<div class="app-shell ${session.settings.fastMotion ? "fast-motion" : ""}"><header class="topbar"><button class="brand" data-action="home" aria-label="ホームへ"><span>DUEL</span><b>PRIVATE TABLE</b></button><div class="turn-callout"><span class="pulse"></span>${session.mode === "replay" ? `棋譜再生 ${session.replayIndex} / ${session.replay.length}` : escapeHtml(renderRequirement(state,viewerIdx))}</div><div class="top-actions">${session.mode === "replay" ? '<button data-action="replay-prev">←</button><button data-action="replay-next">→</button>' : `<button data-action="toggle-motion">演出 ${session.settings.fastMotion ? "短縮" : "標準"}</button><button data-action="concede">投了</button>`}</div></header>
      <main class="game-layout"><div class="board"><section class="player-strip opponent-strip"><div><span class="eyebrow">OPPONENT</span><h2>${escapeHtml(opponent.name)}</h2></div><div class="counts"><span>手札 <b>${opponent.hand.length}</b></span><span>山札 <b>${opponent.deck.length}</b></span><span>墓地 <b>${opponent.graveyard.length}</b></span><span>マナ <b>${opponent.mana.length}</b></span></div></section>
      ${renderShields(state, opponent, opponent.name)}${renderBattleZone(state, state.players[opponentIdx], opponentIdx, session, true)}<section class="combat-line"><span>COMBAT LINE</span>${session.selectedAttacker ? '<button class="player-target" data-action="attack-player">プレイヤーを攻撃</button>' : '<i></i>'}</section>${renderBattleZone(state, state.players[viewerIdx], viewerIdx, session, false)}${renderShields(state, self, self.name)}
      <section class="zone mana-zone"><div class="zone-heading"><span>MANA</span><b>${originalSelf.mana.filter(function open(entity) { return !entity.tapped; }).length} / ${originalSelf.mana.length}</b></div><div class="mana-summary">${manaSummary(state, originalSelf)}</div><div class="mana-cards">${originalSelf.mana.map(function mana(entity) {
        // マナゾーンからの召喚を許す常在能力があれば、マナの札も押せるようにする。
        const fromMana = canControl && !state.pending && Boolean(engine.altPlayable(state, viewerIdx, entity, "mana"));
        return renderCard(state, entity, { size:"chip", ready:fromMana, action:fromMana ? "play" : "" });
      }).join("")}</div></section>
      ${renderGraveyard(state, originalSelf, viewerIdx, canControl)}
      <section class="zone hand-zone"><div class="zone-heading"><span>YOUR HAND</span><b>${self.hand.length}</b></div><div class="hand-scroll">${self.hand.map(function hand(entity) {
        let enabled = canControl && state.activeIdx === viewerIdx && !state.pending && Boolean(handAction);
        if (handAction === "play" && enabled) enabled = engine.canPayCost(state, viewerIdx, engine.findEntity(state, entity.uid).entity);
        return renderCard(state, entity, { size:"full", ready:Boolean(enabled), action:enabled ? handAction : "" });
      }).join("") || '<span class="empty-zone">NO CARDS</span>'}</div></section><div class="phase-controls"><div class="phase-track">${engine.RULES.PHASES.map(function phase(name) { return `<span class="${state.phase === name ? "active" : ""}">${name.toUpperCase()}</span>`; }).join("")}</div>${myTurn && hasChoice && stepLabel ? `<button class="primary" data-action="advance">${stepLabel}</button>` : (myTurn ? '<span class="auto-step"><i></i>自動で進行中…</span>' : '<span class="auto-step is-idle">相手の手番です</span>')}</div>${session.error ? `<p class="error-banner" role="alert">${escapeHtml(session.error)}</p>` : ""}</div>
      <aside class="log-panel"><div class="log-heading"><span class="eyebrow">MATCH LOG</span><b>${state.log.length}</b></div><ol>${state.log.slice().reverse().map(function log(item) { return `<li>${escapeHtml(item.message)}</li>`; }).join("")}</ol></aside></main>${renderPending(state, viewerIdx, session.pendingPicks)}${state.winner != null ? `<div class="result-panel"><span class="eyebrow">MATCH COMPLETE</span><h1>${escapeHtml(state.players[state.winner].name)}の勝利</h1><p>${escapeHtml(state.reason)}</p><div><button class="primary" data-action="rematch">再戦する</button><button data-action="home">ホームへ</button></div></div>` : ""}</div>`;
  }

  function renderAccountBar(session) {
    const account = session.account || {};
    if (account.status === "local") return '<span class="invite-badge is-warning">LOCAL ONLY</span>';
    const name = account.user ? account.user.name : "";
    return `<div class="account-chip"><span class="invite-badge">INVITE ONLY</span><b>${escapeHtml(name)}</b><button data-action="sign-out">ログアウト</button></div>`;
  }

  function renderAuth(session) {
    const account = session.account || {};
    const form = session.authForm;
    const signup = form.mode === "signup";
    if (account.status === "denied") {
      return `<main class="auth-screen"><section class="auth-card"><div class="wordmark"><span>DUEL</span><b>PRIVATE TABLE</b></div><span class="eyebrow">ACCESS DENIED</span><h1>まだ招待されていません</h1><p>${escapeHtml(account.error || "")}</p><p class="auth-hint">管理者に <b>${escapeHtml(account.user ? account.user.email : "")}</b> を allowlist へ登録してもらってください。</p><button class="primary" data-action="sign-out">別のアカウントでログイン</button></section></main>`;
    }
    const loading = account.status === "loading";
    return `<main class="auth-screen"><section class="auth-card"><div class="wordmark"><span>DUEL</span><b>PRIVATE TABLE</b></div><span class="eyebrow">INVITE ONLY</span><h1>${signup ? "アカウントを作る" : "ログイン"}</h1>
      <div class="auth-tabs"><button class="${signup ? "" : "is-active"}" data-action="auth-mode" data-value="signin">ログイン</button><button class="${signup ? "is-active" : ""}" data-action="auth-mode" data-value="signup">新規登録</button></div>
      <form class="auth-form" data-action="auth-submit">
        <label>メールアドレス<input type="email" name="email" autocomplete="email" data-action="auth-field" data-field="email" data-focus="auth-email" value="${escapeHtml(form.email)}" required></label>
        <label>パスワード<input type="password" name="password" autocomplete="${signup ? "new-password" : "current-password"}" data-action="auth-field" data-field="password" data-focus="auth-password" value="${escapeHtml(form.password)}" required></label>
        ${signup ? `<label>表示名<input type="text" name="name" maxlength="20" data-action="auth-field" data-field="name" data-focus="auth-name" value="${escapeHtml(form.name)}" placeholder="対戦相手に表示されます"></label>
        <label>招待コード<input type="text" name="invite" data-action="auth-field" data-field="invite" data-focus="auth-invite" value="${escapeHtml(form.invite)}" placeholder="管理者から受け取ったコード"></label>` : ""}
        <button class="primary" type="submit" ${loading || account.busy ? "disabled" : ""}>${account.busy ? "処理中…" : (signup ? "登録して入室" : "ログイン")}</button>
      </form>
      ${account.error ? `<p class="error-banner" role="alert">${escapeHtml(account.error)}</p>` : ""}
      <p class="auth-hint">このテーブルは招待制です。登録できるのは allowlist にメールアドレスが載っている人だけです。</p>
    </section></main>`;
  }

  // キーワード能力のルール集。カードには名前しか書かれないので、
  // 「その名前が何を意味するか」を引ける場所を、カードとは別に用意する。
  function renderKeywords(session) {
    const query = String(session.keywordSearch || "").toLowerCase();
    // どのキーワードが今のプールで実際に使われているかを数える。
    // 0 のものは「語彙としてはあるが、まだ使うカードが無い」と分かる。
    const usage = {};
    engine.RAW_CARDS.forEach(function scan(card) {
      const faces = card.faces || [card];
      faces.forEach(function face(item) {
        (item.keywords || []).forEach(function keyword(value) { usage[value] = (usage[value] || 0) + 1; });
        ((item.hyperMode || {}).keywords || []).forEach(function keyword(value) { usage[value] = (usage[value] || 0) + 1; });
        (item.selfKeywords || []).forEach(function entry(item2) { usage[item2.keyword] = (usage[item2.keyword] || 0) + 1; });
      });
    });

    const matches = function matches(keyword, rule) {
      if (!query) return true;
      const label = engine.KEYWORD_LABELS[keyword] || keyword;
      return `${label} ${keyword} ${rule.text}`.toLowerCase().indexOf(query) >= 0;
    };

    const sections = engine.KEYWORD_GROUPS.map(function group(item) {
      const rows = Object.keys(engine.KEYWORD_RULES).filter(function inGroup(keyword) {
        return engine.KEYWORD_RULES[keyword].group === item.id && matches(keyword, engine.KEYWORD_RULES[keyword]);
      }).map(function row(keyword) {
        const rule = engine.KEYWORD_RULES[keyword];
        const count = usage[keyword] || 0;
        const args = engine.PARAMETERIZED_KEYWORDS.indexOf(keyword) >= 0
          ? '<span class="keyword-arg">値をとる</span>' : "";
        return `<article class="keyword-entry"><h3><span class="keyword">${escapeHtml(engine.KEYWORD_LABELS[keyword] || keyword)}</span>${args}<b class="keyword-count ${count ? "" : "is-unused"}">${count}枚</b></h3><p>${escapeHtml(rule.text)}</p></article>`;
      }).join("");
      if (!rows) return "";
      return `<section class="keyword-group"><h2>${escapeHtml(item.label)}</h2>${rows}</section>`;
    }).join("");

    return `<main class="keywords-screen"><header><button data-action="home">← ホーム</button><div><span class="eyebrow">RULEBOOK</span><h1>キーワード能力</h1></div><span class="keyword-total">${Object.keys(engine.KEYWORD_RULES).length}種類</span></header>
      <p class="auth-hint">カードには能力の名前しか書かれません。ここはその意味を引くための一覧です。右の数字は、今のカードプールでその能力を持つカードの枚数です。</p>
      <div class="deck-tools"><label>キーワードを検索<input type="search" data-action="keyword-search" data-focus="keyword-search" value="${escapeHtml(session.keywordSearch || "")}" placeholder="名前・説明"></label></div>
      ${sections || '<p class="empty-zone">条件に合うキーワードがありません。</p>'}</main>`;
  }

  function renderHome(session) {
    const hasSave = Boolean(localStorage.getItem("dm-private-table-save-v1"));
    const active = session.activeDeckRecord ? session.activeDeckRecord() : null;
    const total = active ? Object.keys(active.cards).reduce(function sum(value, defId) { return value + active.cards[defId]; }, 0) : 0;
    const deckLine = active ? `使用デッキ：<b>${escapeHtml(active.name)}</b>（${total}枚）` : "使用デッキが未設定です";
    const online = session.account && session.account.status === "signed-in";
    return `<main class="home-screen"><nav><div class="wordmark"><span>DUEL</span><b>PRIVATE TABLE</b></div>${renderAccountBar(session)}</nav><section class="hero"><div class="hero-copy"><span class="eyebrow">TYPOGRAPHIC CARD BATTLE</span><h1>読む。選ぶ。<br><em>盤面を制する。</em></h1><p>イラストに頼らず、判断に必要なすべてを組版した、2人用プライベート・カードテーブル。</p><p class="active-deck ${total === 40 ? "valid" : ""}">${deckLine}</p><div class="hero-actions"><button class="primary" data-action="start-cpu">CPU対戦を始める</button><button data-action="start-hotseat">2人で遊ぶ</button><button data-action="online-host">オンライン部屋を作る</button><button data-action="online-guest">部屋コードで参加</button>${hasSave ? '<button data-action="resume">前回の対戦を続ける</button><button data-action="open-replay">棋譜を再生する</button>' : ""}</div>${online ? "" : '<p class="auth-hint">ログインしていないため、離れた相手との対戦は手動の接続情報交換になります。</p>'}</div><div class="hero-card" aria-hidden="true"><div class="orbit orbit-a"></div><div class="orbit orbit-b"></div><div class="sample-card"><span class="sample-cost">5</span><small>火 / 自然</small><h2>翠炎の王牙</h2><p>進化―森獣。<br>W・ブレイカー。</p><strong>7000</strong></div></div></section><section class="feature-row"><article><b>01</b><h2>全情報を一望</h2><p>コスト、文明、現在パワー、状態を視線移動なく確認。</p></article><article><b>02</b><h2>決定的ルール</h2><p>同じ盤面と操作は、常に同じ結果へ。対戦は自動保存。</p></article><article><b>03</b><h2>架空カード20種</h2><p>権利に配慮したオリジナルカードだけで構成。</p></article></section><footer><button data-action="open-decks">デッキを管理</button><button data-action="open-keywords">キーワード能力を調べる</button><span>CARD POOL ${escapeHtml(engine.CARD_POOL_VERSION)}</span></footer></main>`;
  }

  const STATUS_LABELS = {
    idle: "待機中", preparing: "準備中…", "offer-ready": "招待情報の準備ができました",
    "waiting-guest": "相手の参加を待っています", "answer-ready": "応答情報の準備ができました",
    connecting: "接続中…", connected: "接続しました", disconnected: "切断されました",
    failed: "接続できませんでした", "invalid-message": "不正なデータを受信しました",
    new: "初期化中", checking: "経路を確認中…", completed: "接続確立", closed: "閉じました"
  };

  function statusLabel(status) {
    return STATUS_LABELS[status] || status;
  }

  function renderConnect(session) {
    const host = session.linkRole === "host";
    const online = session.account && session.account.status === "signed-in";
    const code = session.linkMode === "code";
    const signalLabel = host ? "この招待情報を友人へ送る" : "この応答情報を部屋作成者へ返す";
    const inputLabel = host ? "友人から届いた応答情報を貼り付ける" : "部屋作成者から届いた招待情報を貼り付ける";
    const codeBody = host
      ? `<div class="room-code-block"><span class="eyebrow">ROOM CODE</span><b class="room-code">${escapeHtml(session.roomCode || "······")}</b>${session.roomCode ? '<button data-action="copy-code">コードをコピー</button>' : ""}<p>${session.roomCode ? `このコードを相手に伝えてください。参加待ち ${session.waitedSeconds}秒` : "コードを発行しています…"}</p></div>`
      : `<label>部屋コード（${game.net.rooms.CODE_LENGTH}文字）<input type="text" class="room-code-input" autocapitalize="characters" maxlength="${game.net.rooms.CODE_LENGTH}" data-action="room-input" data-focus="room-input" value="${escapeHtml(session.roomInput)}" placeholder="ABC123"></label><button class="primary" data-action="join-code">この部屋に参加する</button>`;
    const manualBody = `<label>${inputLabel}<textarea data-action="signal-input" data-focus="signal-input" placeholder="ここに接続情報を貼り付け">${escapeHtml(session.linkInput)}</textarea></label>
      ${host ? '<button class="primary" data-action="accept-answer">応答情報を適用して接続</button>' : '<button class="primary" data-action="create-answer">応答情報を作成</button>'}
      <label>${signalLabel}<textarea readonly data-signal-output placeholder="準備中…">${escapeHtml(session.linkSignal)}</textarea></label>
      ${session.linkSignal ? '<button data-action="copy-signal">接続情報をコピー</button>' : ""}`;
    return `<main class="connect-screen"><header><button data-action="home">← ホーム</button><span class="invite-badge">WEBRTC / HOST AUTHORITY</span></header><section class="connect-card"><span class="eyebrow">PRIVATE CONNECTION</span><h1>${host ? "オンライン部屋を作る" : "部屋コードで参加"}</h1><p>対戦データはP2Pで直接送られます。ゲストには非公開カードの内容を配信しません。${session.opponentName ? `<br>相手：<b>${escapeHtml(session.opponentName)}</b>` : ""}</p>
      <div class="status-line"><i></i>${escapeHtml(statusLabel(session.connectionStatus))}</div>
      ${online ? `<div class="link-tabs"><button class="${code ? "is-active" : ""}" data-action="link-mode" data-value="code">部屋コード</button><button class="${code ? "" : "is-active"}" data-action="link-mode" data-value="manual">接続情報を手動で交換</button></div>` : '<p class="auth-hint">ログインすると部屋コードだけで接続できます。</p>'}
      ${online && code ? codeBody : manualBody}
      ${session.error ? `<p class="error-banner" role="alert">${escapeHtml(session.error)}</p>` : ""}</section></main>`;
  }

  function deckTotal(cards) {
    return Object.keys(cards || {}).reduce(function sum(value, defId) { return value + cards[defId]; }, 0);
  }

  // カードプールの状態。ここが揃っていないとデッキが組めないので、黙って隠さない。
  function renderPoolStatus(session) {
    const pool = session.cardPool;
    if (!pool) return "";
    if (pool.status === "loaded" || pool.status === "cached") {
      return `<p class="auth-hint">カードプール：<b>${pool.kinds}</b>種類${pool.status === "cached" ? "（この端末に保存された内容）" : ""}</p>`;
    }
    if (pool.status === "loading") return '<p class="auth-hint">カードプールを読み込んでいます…</p>';
    if (pool.status === "error") return `<p class="error-banner" role="alert">${escapeHtml(pool.error)}</p>`;
    return '<p class="auth-hint">カードプールが未登録です。管理者が <code>scripts\publish-cards.ps1</code> で投入すると、全端末で同じカードが使えます。</p>';
  }

  // カードプールと一緒に配られた既成のデッキリスト。取り込むと自分のデッキになる。
  function renderDeckPresets() {
    const presets = engine.REAL_DECKS || [];
    if (!presets.length) return "";
    return `<section class="deck-presets"><span class="eyebrow">READY-MADE</span><p class="auth-hint">用意されたデッキを取り込んで、そのまま使ったり編集したりできます。</p>
      <div class="deck-preset-row">${presets.map(function preset(item) {
        return `<button data-action="deck-preset" data-id="${escapeHtml(item.id)}">${escapeHtml(item.name)}（${item.cards.length}枚）</button>`;
      }).join("")}</div></section>`;
  }

  function renderDecks(session) {
    const store = session.deckStore;
    const ids = Object.keys(store.decks).sort(function byName(a, b) { return store.decks[a].name.localeCompare(store.decks[b].name, "ja"); });
    const items = ids.map(function deckRow(id) {
      const record = store.decks[id];
      const total = deckTotal(record.cards);
      const active = store.activeId === id;
      const kinds = Object.keys(record.cards).length;
      return `<article class="deck-row ${active ? "is-active" : ""}"><div class="deck-row-main"><h2>${escapeHtml(record.name)}</h2><p><b class="${total === 40 ? "valid" : "invalid"}">${total}</b> / 40 枚 ・ ${kinds}種類${active ? ' ・ <span class="deck-active-tag">使用中</span>' : ""}</p></div><div class="deck-row-actions">${active ? "" : `<button data-action="deck-use" data-id="${escapeHtml(id)}">使用する</button>`}<button data-action="deck-edit" data-id="${escapeHtml(id)}">編集</button><button data-action="deck-duplicate" data-id="${escapeHtml(id)}">複製</button><button class="danger" data-action="deck-delete" data-id="${escapeHtml(id)}">削除</button></div></article>`;
    }).join("");
    return `<main class="decks-screen"><header><button data-action="home">← ホーム</button><div><span class="eyebrow">DECK LIBRARY</span><h1>デッキ管理</h1></div><button class="primary" data-action="deck-new">＋ 新しいデッキ</button></header>
      ${session.error ? `<p class="error-banner" role="alert">${escapeHtml(session.error)}</p>` : ""}${session.notice ? `<p class="notice-banner">${escapeHtml(session.notice)}</p>` : ""}
      ${renderPoolStatus(session)}
      <section class="deck-list">${items || '<p class="empty-zone">デッキがまだありません。「＋ 新しいデッキ」から作成してください。</p>'}</section>
      ${renderDeckPresets()}
      <p class="auth-hint">${session.account && session.account.status === "signed-in" ? "デッキはアカウントに保存され、別の端末からも同じものを使えます。" : "ログインしていないため、デッキはこの端末にのみ保存されます。"}</p></main>`;
  }

  // 文明の並び順は RULES.CIVILIZATIONS が唯一の基準。
  // 多色は「どれか1つの文明」に押し込めないので、独立した束にする。
  const MULTI_GROUP = "multi";

  function civGroupOf(card) {
    if ((card.civs || []).length > 1) return MULTI_GROUP;
    return (card.civs || [])[0] || "zero";
  }

  function civGroupLabel(group) {
    return group === MULTI_GROUP ? "多色" : (engine.CIV_LABELS[group] || group);
  }

  function civGroupOrder(group) {
    if (group === MULTI_GROUP) return engine.RULES.CIVILIZATIONS.length;
    const index = engine.RULES.CIVILIZATIONS.indexOf(group);
    return index < 0 ? engine.RULES.CIVILIZATIONS.length + 1 : index;
  }

  // 文明 → コスト → 名前 の順。同じ文明のカードが必ず隣り合う。
  function sortByCivilization(cards) {
    return cards.slice().sort(function order(left, right) {
      const groupDiff = civGroupOrder(civGroupOf(left)) - civGroupOrder(civGroupOf(right));
      if (groupDiff) return groupDiff;
      if (left.cost !== right.cost) return left.cost - right.cost;
      return String(left.name).localeCompare(String(right.name), "ja");
    });
  }

  function renderCivFilter(session, cards) {
    const selected = session.deckCivFilter || "";
    const counts = {};
    cards.forEach(function tally(card) {
      const group = civGroupOf(card);
      counts[group] = (counts[group] || 0) + 1;
    });
    const groups = Object.keys(counts).sort(function order(a, b) { return civGroupOrder(a) - civGroupOrder(b); });
    const chip = function chip(value, label, count) {
      const active = selected === value ? " is-active" : "";
      const civClass = value && value !== MULTI_GROUP ? ` civ-chip-${escapeHtml(value)}` : "";
      return `<button class="civ-chip${civClass}${active}" data-action="deck-civ" data-id="${escapeHtml(value)}">${escapeHtml(label)}<b>${count}</b></button>`;
    };
    return `<div class="civ-filter" role="group" aria-label="文明で絞り込む">${
      chip("", "すべて", cards.length)
    }${groups.map(function each(group) { return chip(group, civGroupLabel(group), counts[group]); }).join("")}</div>`;
  }

  function renderDeck(session) {
    const draft = session.deckDraft || { name:"", cards:{} };
    const total = deckTotal(draft.cards);
    const query = session.deckSearch.toLowerCase();
    // 架空カードは代役であって、デッキに入れる札ではない。
    // プールが届いていない端末では、選べるカードは0件になる。
    const buildable = engine.buildableCards();
    const searched = buildable.filter(function filter(card) { return !query || `${card.name} ${card.text} ${(card.races || []).join(" ")}`.toLowerCase().indexOf(query) >= 0; });
    // 絞り込みの選択肢は、検索結果の中身から作る（0件の文明はボタンにしない）。
    const civFilter = session.deckCivFilter || "";
    const cards = sortByCivilization(civFilter
      ? searched.filter(function byCiv(card) { return civGroupOf(card) === civFilter; })
      : searched);
    // カードプールがまだ届いていない端末では、IDだけ分かって中身が無いことがある。
    // 消さずに「不明なカード」として見せ、何が入っているかを保てるようにする。
    const cardCost = function cardCost(defId) { return engine.CARD_INDEX[defId] ? engine.CARD_INDEX[defId].cost : 99; };
    const cardName = function cardName(defId) { return engine.CARD_INDEX[defId] ? engine.CARD_INDEX[defId].name : `不明なカード（${defId}）`; };
    const chosen = Object.keys(draft.cards).sort(function byCost(a, b) { return cardCost(a) - cardCost(b); });
    return `<main class="deck-screen"><header><button data-action="deck-cancel">← デッキ管理</button><div><span class="eyebrow">DECK WORKSHOP</span><h1>デッキ編集</h1></div><div class="deck-total ${total === 40 ? "valid" : ""}"><b>${total}</b><span>/ 40</span></div></header>
      <div class="deck-tools"><label class="deck-name-field">デッキ名<input type="text" maxlength="40" data-action="deck-name" data-focus="deck-name" value="${escapeHtml(draft.name)}" placeholder="デッキ名"></label><label>カードを検索<input type="search" data-action="deck-search" data-focus="deck-search" value="${escapeHtml(session.deckSearch)}" placeholder="名前・種族・テキスト"></label><button data-action="open-keywords">キーワード能力</button><button data-action="deck-fill" ${buildable.length ? "" : "disabled"}>標準の40枚を入れる</button><button class="primary" data-action="deck-save">保存する</button></div>
      ${session.error ? `<p class="error-banner" role="alert">${escapeHtml(session.error)}</p>` : ""}${session.notice ? `<p class="notice-banner">${escapeHtml(session.notice)}</p>` : ""}
      <section class="deck-summary">${chosen.map(function chip(defId) { return `<button class="deck-chip" data-action="deck-dec" data-id="${escapeHtml(defId)}" title="1枚減らす"><b>${draft.cards[defId]}</b>${escapeHtml(cardName(defId))}</button>`; }).join("") || '<span class="empty-zone">カードを選んでください</span>'}</section>
      ${buildable.length ? "" : '<p class="notice-banner">カードプールがまだ届いていません。ログインすると、デッキに入れられるカードが表示されます。</p>'}
      ${renderCivFilter(session, searched)}
      ${renderLibrary(cards, draft)}</main>`;
  }

  // 文明ごとに見出しを付けて並べる。絞り込んでいる時も同じ組み立てを通す。
  function renderLibrary(cards, draft) {
    if (!cards.length) return '<section class="library"><span class="empty-zone">条件に合うカードがありません。</span></section>';
    const sections = [];
    let currentGroup = null;
    let items = [];
    const flush = function flush() {
      if (!items.length) return;
      sections.push(`<h2 class="civ-heading civ-heading-${escapeHtml(currentGroup)}">${escapeHtml(civGroupLabel(currentGroup))}<b>${items.length}</b></h2><section class="library">${items.join("")}</section>`);
      items = [];
    };
    cards.forEach(function each(card) {
      const group = civGroupOf(card);
      if (group !== currentGroup) { flush(); currentGroup = group; }
      const count = draft.cards[card.id] || 0;
      const entity = { uid:`preview-${card.id}`, defId:card.id, ownerIdx:0, tapped:false, sick:false, under:[], marks:{}, mods:[] };
      // 盤面ではないので、ゾーンの揃った空の state で描く。battle だけの
      // 作りものを渡すと、シールドや墓地を見る条件でカードごと落ちる。
      items.push(`<article class="library-item">${renderCard(engine.previewState(), entity, { size:"compact" })}<div class="counter"><button data-action="deck-dec" data-id="${card.id}" ${count ? "" : "disabled"}>−</button><b>${count}</b><button data-action="deck-inc" data-id="${card.id}" ${count >= 4 ? "disabled" : ""}>＋</button></div></article>`);
    });
    flush();
    return sections.join("");
  }

  function renderApplication(session) {
    const root = document.getElementById("app");
    if (!root) return;
    const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.focus : "";
    const board = root.querySelector(".board");
    const scrollTop = board ? board.scrollTop : 0;
    const screens = { deck:renderDeck, decks:renderDecks, keywords:renderKeywords, connect:renderConnect, auth:renderAuth, home:renderHome };
    const draw = session.screen === "game" && session.state ? renderGame : (screens[session.screen] || renderHome);
    root.innerHTML = draw(session);
    const nextBoard = root.querySelector(".board");
    if (nextBoard) nextBoard.scrollTop = scrollTop;
    if (active && global.CSS && CSS.escape) { const next = root.querySelector(`[data-focus="${CSS.escape(active)}"]`); if (next) next.focus({ preventScroll:true }); }
  }

  Object.assign(ui, { escapeHtml, renderCard, renderApplication, statusLabel, civGroupOf, civGroupLabel, sortByCivilization });

(function initializeUi(global) {
  const game = global.DMGame;
  const engine = game.engine;
  const session = game.session;

  // 再描画で入力欄が作り直されるとカーソルが飛ぶため、
  // 「打つたびに絞り込む」検索欄以外は render せずモデルだけ更新する。
  const QUIET_INPUTS = {
    "auth-field": function authField(target) { session.setAuthField(target.dataset.field, target.value); },
    "deck-name": function deckName(target) { session.setDeckName(target.value); },
    "room-input": function roomInput(target) { session.roomInput = target.value.toUpperCase(); if (target.value !== session.roomInput) target.value = session.roomInput; },
    "signal-input": function signalInput(target) { session.linkInput = target.value; }
  };

  const SCROLL_TOP_ACTIONS = ["start-cpu", "start-hotseat", "resume", "rematch", "home", "open-decks", "open-keywords", "deck-new", "deck-edit", "deck-cancel", "online-host", "online-guest", "open-replay", "sign-out"];

  function activate(target) {
    const action = target.dataset.action;
    const id = target.dataset.id;
    if (!action) return;

    /* アカウント */
    if (action === "auth-mode") session.setAuthMode(target.dataset.value);
    else if (action === "sign-out") session.signOut();

    /* 画面遷移 */
    else if (action === "start-cpu") session.startGame("cpu");
    else if (action === "start-hotseat") session.startGame("hotseat");
    else if (action === "resume") session.resumeGame();
    else if (action === "rematch") session.startGame(session.mode === "online-host" || session.mode === "online-guest" ? "cpu" : session.mode);
    else if (action === "home") { session.screen = "home"; session.error = ""; session.notice = ""; session.render(); }
    else if (action === "open-decks") session.openDeckList();
    else if (action === "open-replay") session.openReplay();
    else if (action === "replay-prev") session.rebuildReplay(session.replayIndex - 1);
    else if (action === "replay-next") session.rebuildReplay(session.replayIndex + 1);

    /* デッキ */
    else if (action === "deck-new") session.newDeck();
    else if (action === "deck-edit") session.editDeck(id);
    else if (action === "deck-duplicate") session.duplicateDeck(id);
    else if (action === "deck-preset") session.importPresetDeck(id);
    else if (action === "deck-civ") session.setDeckCivFilter(id);
    else if (action === "open-keywords") session.openKeywords();
    else if (action === "deck-delete") {
      const record = session.deckStore.decks[id];
      if (record && global.confirm(`デッキ「${record.name}」を削除します。よろしいですか？`)) session.removeDeck(id);
    }
    else if (action === "deck-use") session.useDeck(id);
    else if (action === "deck-cancel") session.openDeckList();
    else if (action === "deck-save") session.saveDeck();
    else if (action === "deck-fill") session.fillStarterDeck();
    // 架空カードは代役であって、デッキに入れる札ではない。
    // 一覧に出していないので押せないはずだが、押せた場合に備えてここでも止める。
    else if (action === "deck-inc") { if (!engine.isFictionalPool()) session.changeDeckCount(id, 1); }
    else if (action === "deck-dec") session.changeDeckCount(id, -1);

    /* 接続 */
    else if (action === "online-host") session.openOnline("host");
    else if (action === "online-guest") session.openOnline("guest");
    else if (action === "link-mode") session.setLinkMode(target.dataset.value);
    else if (action === "join-code") session.joinByCode();
    else if (action === "copy-code") navigator.clipboard.writeText(session.roomCode);
    else if (action === "create-answer") session.createGuestAnswer();
    else if (action === "accept-answer") session.acceptGuestAnswer();
    else if (action === "copy-signal") navigator.clipboard.writeText(session.linkSignal);

    /* 対戦操作 */
    else if (action === "advance") session.dispatchAction({ type:"ADVANCE_PHASE" });
    else if (action === "charge") session.dispatchAction({ type:"CHARGE_MANA", uid:target.dataset.uid });
    else if (action === "play") session.dispatchAction({ type:"PLAY_CARD", uid:target.dataset.uid });
    else if (action === "select-attacker") { session.selectedAttacker = target.dataset.uid; session.error = ""; session.render(); }
    else if (action === "attack-player") session.dispatchAction({ type:"DECLARE_ATTACK", attackerUid:session.selectedAttacker, target:{ kind:"player" } });
    else if (action === "attack-creature") session.dispatchAction({ type:"DECLARE_ATTACK", attackerUid:session.selectedAttacker, target:{ kind:"creature", uid:target.dataset.uid } });
    else if (action === "resolve-pending") session.dispatchAction({ type:"RESOLVE_PENDING", answer:target.dataset.value });
    else if (action === "pick-pending") session.pickPending(target.dataset.value);
    else if (action === "clear-pending") { session.pendingPicks = []; session.render(); }
    else if (action === "confirm-pending") {
      const picks = (session.pendingPicks || []).slice();
      session.pendingPicks = [];
      session.dispatchAction({ type:"RESOLVE_PENDING", answer:picks });
    }
    else if (action === "concede" && session.state && session.state.winner == null) session.dispatchAction({ type:"CONCEDE" });
    else if (action === "toggle-motion") { session.settings.fastMotion = !session.settings.fastMotion; session.saveSettings(); session.render(); }

    if (SCROLL_TOP_ACTIONS.indexOf(action) >= 0) global.scrollTo({ top:0, left:0, behavior:"auto" });
  }

  function start() {
    const root = document.getElementById("app");

    root.addEventListener("click", function onClick(event) {
      const target = event.target.closest("[data-action]");
      if (target && target.tagName !== "FORM" && !target.disabled) activate(target);
    });

    root.addEventListener("submit", function onSubmit(event) {
      const form = event.target.closest('form[data-action="auth-submit"]');
      if (!form) return;
      event.preventDefault();
      session.submitAuth();
    });

    root.addEventListener("keydown", function onKeyDown(event) {
      if (event.key === "Enter" && event.target.dataset.action === "room-input") {
        event.preventDefault();
        session.joinByCode();
        return;
      }
      if ((event.key === "Enter" || event.key === " ") && event.target.matches('[role="button"][data-action]')) {
        event.preventDefault();
        activate(event.target);
      }
    });

    root.addEventListener("input", function onInput(event) {
      const quiet = QUIET_INPUTS[event.target.dataset.action];
      if (quiet) { quiet(event.target); return; }
      // 検索欄は描き直しでフォーカスが飛ぶので、入れ直してから末尾へ戻す。
      const searchAction = event.target.dataset.action;
      if (searchAction !== "deck-search" && searchAction !== "keyword-search") return;
      if (searchAction === "deck-search") session.deckSearch = event.target.value;
      else session.keywordSearch = event.target.value;
      session.render();
      const input = document.querySelector(`[data-action="${searchAction}"]`);
      if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    });

    session.boot();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start, { once:true });
  else start();
}(globalThis));

  </script>
