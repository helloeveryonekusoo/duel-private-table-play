(function defineState(global) {
  const engine = global.DMGame.engine;
  const ZONES = ["deck", "hand", "shields", "mana", "battle", "graveyard", "special"];

  function createEntity(defId, ownerIdx, uid) {
    return { uid, defId, ownerIdx, tapped:false, sick:false, faceUp:false, under:[], marks:{}, mods:[] };
  }

  function nextRandom(state) {
    state.seed = (state.seed + 0x6D2B79F5) >>> 0;
    let value = state.seed;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
  }

  function shuffle(state, array) {
    for (let index = array.length - 1; index > 0; index -= 1) {
      const swapIndex = Math.floor(nextRandom(state) * (index + 1));
      const held = array[index];
      array[index] = array[swapIndex];
      array[swapIndex] = held;
    }
    return array;
  }

  function createPlayer(name) {
    return { name, deck:[], hand:[], shields:[], mana:[], battle:[], graveyard:[], special:[], chargedThisTurn:false };
  }

  function createGame(options) {
    const settings = options || {};
    const state = {
      version:1,
      seed:(settings.seed == null ? 20260821 : settings.seed) >>> 0,
      nextUid:1,
      turnCount:1,
      activeIdx:0,
      phase:"start",
      players:[createPlayer((settings.names && settings.names[0]) || "あなた"), createPlayer((settings.names && settings.names[1]) || "CPU")],
      pending:null,
      triggerQueue:[],
      effectQueue:[],
      eventLog:[],
      log:[],
      combat:null,
      winner:null,
      reason:null,
      extraTurns:[],
      // ターンやゲームをまたぐ記録。能力の使用回数・ターン中の出来事・期限つき効果。
      usedTurn:{},
      usedGame:{},
      perTurnUse:{},
      turnStats:{ shieldsBroken:[0, 0] },
      lastLooked:[],
      lastTargets:[],
      floatingEffects:[],
      delayedEffects:[],
      loopCount:0
    };
    const decks = settings.decks || [engine.createDemoDeck(0), engine.createDemoDeck(7)];

    decks.forEach(function loadDeck(deck, playerIdx) {
      deck.forEach(function addCard(defId) {
        state.players[playerIdx].deck.push(createEntity(defId, playerIdx, `e${state.nextUid++}`));
      });
      shuffle(state, state.players[playerIdx].deck);
      for (let count = 0; count < engine.RULES.STARTING_SHIELDS; count += 1) {
        state.players[playerIdx].shields.push(state.players[playerIdx].deck.shift());
      }
      for (let count = 0; count < engine.RULES.STARTING_HAND; count += 1) {
        state.players[playerIdx].hand.push(state.players[playerIdx].deck.shift());
      }
    });
    engine.addLog(state, "対戦を開始しました。先攻の最初のターンはドローしません。");
    return state;
  }

  function getZone(state, playerIdx, zoneName) {
    if (!state.players[playerIdx] || ZONES.indexOf(zoneName) < 0) return null;
    return state.players[playerIdx][zoneName];
  }

  function findEntity(state, uid) {
    if (!state || !Array.isArray(state.players)) return null;
    for (let playerIdx = 0; playerIdx < state.players.length; playerIdx += 1) {
      for (const zoneName of ZONES) {
        // デッキ編集画面のように、盤面を持たない状態から派生値を引くことがある。
        // 無いゾーンは黙って飛ばし、見つからなければ null を返す。
        const zone = getZone(state, playerIdx, zoneName);
        if (!zone) continue;
        const index = zone.findIndex(function match(entity) { return entity.uid === uid; });
        if (index >= 0) return { entity:zone[index], playerIdx, zoneName, index };
      }
    }
    return null;
  }

  function moveEntity(state, uid, destinationPlayerIdx, destinationZone, options) {
    const found = findEntity(state, uid);
    const targetZone = getZone(state, destinationPlayerIdx, destinationZone);
    if (!found || !targetZone) return null;
    const entity = found.entity;
    getZone(state, found.playerIdx, found.zoneName).splice(found.index, 1);
    // ツインパクトが場以外へ移ったら、選んでいた面を捨てて合成面（多色カード）へ戻す。
    // destroy は moveZone イベントを経由しないので、ここに置かないと漏れる。
    if (destinationZone !== "battle" && entity.face != null) delete entity.face;
    // 裏向きなのはマナゾーンにある間だけ。離れたら表のカードに戻る。
    if (destinationZone !== "mana" && entity.faceDown) delete entity.faceDown;
    // 表向きなのはシールドゾーンにある間だけ。ギャラクシールドの印も一緒に落とす。
    if (destinationZone !== "shields") {
      if (entity.faceUp) delete entity.faceUp;
      if (entity.marks && entity.marks.galaxyShield) delete entity.marks.galaxyShield;
    }
    // 出方の印（革命チェンジ／侵略）は場を離れたら消す。残しておくと、
    // 同じカードが次に普通に出た時までファイナル革命が誘発してしまう。
    if (destinationZone !== "battle" && entity.marks) { delete entity.marks.enteredBy; delete entity.marks.enteredTurn; delete entity.marks.badChosen; delete entity.marks.altCost; }
    // 封印されたクリーチャーが場を離れたら、乗っていた封印も持ち主の墓地へ。
    // 置いたままにすると、どのゾーンにも属さないカードが宙に浮く。
    if (destinationZone !== "battle" && (entity.seals || []).length) {
      entity.seals.splice(0).forEach(function bury(card) { state.players[card.ownerIdx].graveyard.push(card); });
    }
    // 複数枚で1つのシールドになっているものは、離れる時もひとまとまりで動く。
    // ばらして数えると、シールドの数（＝残り体力）が食い違う。
    const carried = (found.zoneName === "shields" && destinationZone !== "shields" && (entity.under || []).length)
      ? entity.under.splice(0)
      : [];
    if (options && options.toTop) targetZone.unshift(entity);
    else targetZone.push(entity);
    carried.forEach(function follow(card) {
      const zone = getZone(state, destinationPlayerIdx, destinationZone);
      if (zone) zone.push(card);
    });
    return { entity, fromPlayerIdx:found.playerIdx, fromZone:found.zoneName, toPlayerIdx:destinationPlayerIdx, toZone:destinationZone };
  }

  // 行き先を決めずにゾーンから外す。シールドの上に置くなど、
  // 通常のゾーンに属さない場所へ移すときに使う。
  function removeEntity(state, uid) {
    const found = findEntity(state, uid);
    if (!found) return null;
    getZone(state, found.playerIdx, found.zoneName).splice(found.index, 1);
    if (found.entity.face != null) delete found.entity.face;
    return found.entity;
  }

  // シールドゾーンにある表向きのカード。表向きのシールドそのものと、
  // シールドの上に置かれたカード（紋章）の両方を指す。
  function faceUpShieldCards(state) {
    const entries = [];
    state.players.forEach(function scan(player, playerIdx) {
      player.shields.forEach(function shield(entity) {
        if (entity.faceUp) entries.push({ entity, playerIdx, shieldUid:entity.uid, crest:false });
        (entity.crests || []).forEach(function crest(card) {
          entries.push({ entity:card, playerIdx, shieldUid:entity.uid, crest:true });
        });
      });
    });
    return entries;
  }

  function findCrest(state, uid) {
    return faceUpShieldCards(state).find(function match(entry) { return entry.entity.uid === uid; }) || null;
  }

  // シールドが離れる時、その上に置かれていたカードは持ち主の墓地へ。
  function releaseCrests(state, shield) {
    (shield.crests || []).splice(0).forEach(function bury(card) {
      state.players[card.ownerIdx].graveyard.push(card);
    });
  }

  function redactEntity(entity, visible) {
    if (!visible) return { uid:entity.uid, hidden:true };
    return engine.clone(entity);
  }

  function redactStateFor(state, viewerIdx) {
    const view = engine.clone(state);
    view.players = state.players.map(function redactPlayer(player, playerIdx) {
      const copy = engine.clone(player);
      copy.deck = player.deck.map(function hiddenDeck(entity) { return redactEntity(entity, false); });
      // 「相手は手札を表向きにしてプレイする」カードがあれば、その手札は
      // 相手にも見える。自分の手札は当然いつでも見える。
      const openHand = playerIdx === viewerIdx || engine.handIsRevealed(state, playerIdx);
      copy.hand = player.hand.map(function handCard(entity) { return redactEntity(entity, openHand); });
      // 裏向きのマナ（水晶チャージャーなど）は、持ち主だけが表面を確認できる。
      // 枚数とタップ状態は盤面の情報なので、実体そのものは隠さない。
      copy.mana = player.mana.map(function manaCard(entity) {
        if (!entity.faceDown || playerIdx === viewerIdx) return engine.clone(entity);
        const hidden = engine.clone(entity);
        delete hidden.defId;
        hidden.hidden = true;
        return hidden;
      });
      copy.shields = player.shields.map(function shieldCard(entity) {
        const view = redactEntity(entity, Boolean(entity.faceUp));
        // シールドが伏せられていても、その上に置かれた表向きのカードは見える。
        if (entity.crests && entity.crests.length) view.crests = entity.crests.map(engine.clone);
        return view;
      });
      // 封印は裏向き。何枚乗っているかは盤面の情報なので見えてよいが、
      // 中身は山札の上のカードそのものなので、両者に伏せたままにする。
      copy.battle = player.battle.map(function battleCard(entity) {
        const view = engine.clone(entity);
        if ((entity.seals || []).length) {
          view.seals = entity.seals.map(function hide(card) { return { uid:card.uid, hidden:true }; });
        }
        return view;
      });
      return copy;
    });
    if (state.pending && state.pending.playerIdx !== viewerIdx) {
      view.pending = { type:"opponentWaiting", playerIdx:state.pending.playerIdx, prompt:"相手が選択中です。" };
    }
    return view;
  }

  engine.createEntity = createEntity;
  engine.createGame = createGame;
  engine.nextRandom = nextRandom;
  engine.shuffle = shuffle;
  engine.getZone = getZone;
  engine.findEntity = findEntity;
  engine.moveEntity = moveEntity;
  engine.removeEntity = removeEntity;
  engine.faceUpShieldCards = faceUpShieldCards;
  engine.findCrest = findCrest;
  engine.releaseCrests = releaseCrests;
  // シールドゾーンの表向きのカードを1枚、持ち主の墓地に置く。
  // 紋章はゾーンに属さないので直接動かし、表向きのシールド（G城など）は
  // 通常のゾーン移動として扱う（置換効果とZラッシュを通すため）。
  engine.buryFaceUpShieldCard = function buryFaceUpShieldCard(state, uid) {
    const entry = findCrest(state, uid);
    if (!entry) return false;
    if (!entry.crest) {
      engine.applyEvent(state, { type:"moveZone", entityUid:uid, toPlayerIdx:entry.entity.ownerIdx, toZone:"graveyard" });
      return true;
    }
    const shield = state.players[entry.playerIdx].shields.find(function match(item) { return item.uid === entry.shieldUid; });
    if (!shield) return false;
    shield.crests.splice(shield.crests.indexOf(entry.entity), 1);
    state.players[entry.entity.ownerIdx].graveyard.push(entry.entity);
    engine.addLog(state, `「${engine.getDef(entry.entity.defId).name}」が墓地に置かれました。`, [entry.entity.uid]);
    return true;
  };
  engine.redactStateFor = redactStateFor;
}(globalThis));

  const engine = global.DMGame.engine;

  function allBattleEntities(state) {
    return state.players.reduce(function join(all, player) { return all.concat(player.battle); }, []);
  }

  // 封印が1つでも乗っていれば、そのクリーチャーはバトルゾーンにいないものとして扱う。
  // 盤面からは消えないので、選ぶことはできる（canBeChosen は素通りさせる）。
  function isSealed(state, entity) {
    return Boolean(entity && (entity.seals || []).length);
  }

  // G城とギャラクシールドで置いたカードは、表向きのシールドとして能力が働く。
  // 「能力の発生源になりうるもの」はバトルゾーンだけではない。
  // ただの表向きのシールド（相手に表向きにされただけ）は発生源にしない。
  function activeCastles(state) {
    return state.players.reduce(function join(all, player) {
      return all.concat((player.shields || []).filter(function open(entity) {
        if (!entity.faceUp) return false;
        return engine.getDef(entity.defId).type === "castle" || Boolean((entity.marks || {}).galaxyShield);
      }));
    }, []);
  }

  function allActiveSources(state) {
    // 封印されたクリーチャーの能力は、常在・誘発・置換のすべてが働かない。
    // ここで除くことで、3種類まとめて止まる。
    return allBattleEntities(state).filter(function unsealed(entity) {
      return !isSealed(state, entity);
    }).concat(activeCastles(state));
  }

  // 実体が「今持っている能力」の全部。カードに書かれたものだけではない。
  //   ・ハイパーモードを解放していれば、その欄の能力
  //   ・下に敷かれたカードの「超魂X」の能力
  // 常在・誘発・置換の3箇所がすべてここを通るようにして、拾い漏れを防ぐ。
  // シールド・フォース：出す時に選んだシールドが、まだシールドゾーンにあるか。
  // 無ければSF能力は働かない（選ばなかった場合も同じ）。
  function shieldForceActive(state, entity) {
    const bound = entity.marks && entity.marks.shieldForce;
    if (!bound) return false;
    const playerIdx = controllerOf(state, entity);
    return (state.players[playerIdx].shields || []).some(function same(shield) { return shield.uid === bound; });
  }

  // 「選んだ名前を持つクリーチャーの能力をすべて無視する」。
  // 無視する側は declareIgnoredName で state.ignoreSources に登録される。
  // 能力の一覧を作る途中でまた能力の一覧を引くと無限に潜るので、
  // ここでは登録された実体の印だけを見る（能力の走査はしない）。
  function abilitiesAreIgnored(state, entity) {
    const sources = state.ignoreSources || [];
    if (!sources.length) return false;
    const name = engine.faceDef(state, entity).name;
    return sources.some(function active(uid) {
      if (uid === entity.uid) return false;
      const found = engine.findEntity(state, uid);
      if (!found || found.zoneName !== "battle") return false;
      return (found.entity.marks || {}).ignoredName === name;
    });
  }

  function abilitiesOf(state, entity) {
    if (abilitiesAreIgnored(state, entity)) return [];
    const definition = engine.faceDef(state, entity);
    let abilities = definition.abilities || [];
    if (isHyper(state, entity) && definition.hyperMode) {
      abilities = abilities.concat(definition.hyperMode.abilities || []);
    }
    if (definition.shieldForce && shieldForceActive(state, entity)) {
      abilities = abilities.concat(definition.shieldForce.abilities || []);
    }
    (entity.under || []).forEach(function beneath(card) {
      const beneathDef = engine.getDef(card.defId);
      if (beneathDef.soulX) abilities = abilities.concat(beneathDef.soulX.abilities || []);
    });
    return abilities;
  }

  // ハイパーモードを解放しているか。解放は印で持ち、コントローラーの次のターン開始で消える。
  function isHyper(state, entity) {
    return Boolean(entity.marks && entity.marks.hyper);
  }

  // Zラッシュ：自分のシールドが1つでも減ったら、その瞬間にハイパーモードが解放される。
  // 誘発ではなく常在なので、選択の余地なく即座に有効になる。
  function noteShieldLeft(state, playerIdx) {
    state.players[playerIdx].battle.forEach(function unlock(entity) {
      if (!hasKeyword(state, entity, "zRush")) return;
      if (entity.marks.hyper) return;
      entity.marks.hyper = true;
      engine.addLog(state, `「${engine.faceDef(state, entity).name}」のハイパーモードが解放されました。`, [entity.uid]);

  }

  // 引数を取るキーワード（パワーアタッカー+2000 など）は keywordArgs に値を置く。
  // keywords は真偽フラグのままにして、hasKeyword() の呼び出し側を壊さない。
  function getKeywordArg(state, entityOrDef, keyword) {
    const definition = entityOrDef.defId ? engine.faceDef(state, entityOrDef) : entityOrDef;
    if (!hasKeywordOnDefinition(state, entityOrDef, keyword)) return null;
    return (definition.keywordArgs || {})[keyword] || {};

  function hasKeywordOnDefinition(state, entityOrDef, keyword) {
    if (entityOrDef.defId) return hasKeyword(state, entityOrDef, keyword);
    return (entityOrDef.keywords || []).indexOf(keyword) >= 0;
  }

  // 「マナゾーンにドラゴンが4枚以上あれば」のような、ゾーンの枚数を見る条件の土台。
  // 数える場所と数える条件を1か所に集約し、条件語彙とコスト軽減の両方から使う。
  // sourceUid は「自分の他の◯◯1つにつき」を数えるために要る。
  // 渡さないと filter.notSelf が効かず、自分自身まで数に入る。
  function countZoneMatches(state, viewerIdx, spec, sourceUid) {
    // zone は配列も受ける。「バトルゾーンまたはマナゾーンに合計5枚以上」のように、
    // 複数のゾーンをまたいだ合計を条件にするカードがあるため。
    const zoneNames = spec.zone ? [].concat(spec.zone) : ["battle"];
    const owners = spec.owner === "any" ? [0, 1] : [spec.owner === "opponent" ? 1 - viewerIdx : viewerIdx];
    return owners.reduce(function total(sum, playerIdx) {
      return sum + zoneNames.reduce(function perZone(count, zoneName) {
        return count + (state.players[playerIdx][zoneName] || []).filter(function match(entity) {
          return matchesFilter(state, entity, spec.filter || {}, viewerIdx, sourceUid || null);
        }).length;
      }, 0);
    }, 0);
  }

  function countManaOfCiv(state, playerIdx, civ) {
    return state.players[playerIdx].mana.filter(function match(entity) {
      // 裏向きのマナは無色。faceDef を通さないと、表面の文明を数えてしまう。
      return engine.faceDef(state, entity).civs.indexOf(civ) >= 0;
    }).length;
  }

  // マナ武装・G・ゼロ・ニンジャストライクなど「盤面の状況で有効になる能力」の共通判定。
  // 能力ごとに条件式を書かせると必ず表現がぶれるので、語彙をここに集約する。
  function meetsCondition(state, playerIdx, condition, entity) {
    if (!condition) return true;
    // デッキ編集の一覧のように、盤面ではない場所から呼ばれることがある。

    // 条件を満たさないほうが正しい）。実際にここで画面が落ちていた。
    const player = (state.players || [])[playerIdx] || {};
    // 「このクリーチャーが進化していれば」のように、持ち主自身の状態を見る条件。
    if (condition.selfEvolved != null && ((entity && entity.under || []).length > 0) !== condition.selfEvolved) return false;
    // 「このクリーチャーが出たターン、〜」。enteredThisTurn は選ぶ相手を絞るフィルタなので、
    // 能力の持ち主自身の話を書くにはこちらが要る。
    if (condition.selfEnteredThisTurn != null
      && (((entity && entity.marks || {}).enteredTurn === state.turnCount) !== condition.selfEnteredThisTurn)) return false;
    // 「このクリーチャーの下にカードが3枚以上あれば」。超魂Xが数えるのは、
    // 能力を与えられている側（一番上のクリーチャー）の下の枚数。
    if (condition.underMin != null && ((entity && entity.under || []).length) < condition.underMin) return false;
    if (condition.manaCiv && countManaOfCiv(state, playerIdx, condition.manaCiv.civ) < (condition.manaCiv.min || 1)) return false;
    // 「マナゾーンに光、水、自然の各文明があれば」。manaCiv は1文明ぶんしか
    // 見られないので、複数を同時に要求する条件はこちらで書く。
    if (condition.manaCivs && condition.manaCivs.some(function missing(civ) {
      return countManaOfCiv(state, playerIdx, civ) < 1;
    })) return false;
    if (condition.manaMin != null && (player.mana || []).length < condition.manaMin) return false;
    if (condition.manaMax != null && (player.mana || []).length > condition.manaMax) return false;
    if (condition.shieldsMin != null && (player.shields || []).length < condition.shieldsMin) return false;
    if (condition.shieldsMax != null && (player.shields || []).length > condition.shieldsMax) return false;
    if (condition.handMin != null && (player.hand || []).length < condition.handMin) return false;
    if (condition.handMax != null && (player.hand || []).length > condition.handMax) return false;
    if (condition.graveyardMin != null && (player.graveyard || []).length < condition.graveyardMin) return false;
    if (condition.battle) {
      // 「自分の“他の”オラクルがあれば」。notSelf を効かせるには、
      // 誰が数えているのか（能力の持ち主）を渡さないといけない。
      const matched = (player.battle || []).filter(function count(other) {
        return matchesFilter(state, other, condition.battle.filter || {}, playerIdx, entity ? entity.uid : null);
      }).length;
      if (matched < (condition.battle.min || 1)) return false;
    }
    if (condition.zoneMatching) {
      const spec = condition.zoneMatching;
      const count = countZoneMatches(state, playerIdx, spec);
      if (spec.min != null && count < spec.min) return false;
      if (spec.max != null && count > spec.max) return false;
    }
    // 自分と相手のシールドの数を比べる（「自分のシールドが相手より多ければ」）。
    if (condition.shieldsMoreThanOpponent && (player.shields || []).length <= (((state.players || [])[1 - playerIdx] || {}).shields || []).length) return false;
    // 「バトルゾーンに《同名》がなければ」。手札から誘発する能力が、
    // すでに場に出ている自分自身と重複しないようにするために使う。
    if (condition.absentSelfName && entity) {
      const name = engine.getDef(entity.defId).name;
      const present = allBattleEntities(state).some(function same(other) {
        return engine.getDef(other.defId).name === name;
      });
      if (present) return false;
    }
    if (condition.freePlaysThisTurn) {
      const spec = condition.freePlaysThisTurn;
      const ownerIdx = spec.owner === "opponent" ? 1 - playerIdx : playerIdx;
      const count = ((state.turnStats || {}).freePlays || [])[ownerIdx] || 0;
      if (count < (spec.min || 1)) return false;
    }
    // 「攻撃してブロックされなかった時」。攻撃の解決が終わった時点で
    // 攻撃したクリーチャーに控えた印を読む。
    if (condition.attackUnblocked != null) {
      if (!entity) return false;
      if (Boolean((entity.marks || {}).attackUnblocked) !== condition.attackUnblocked) return false;
    }
    // 「このターン2度目の攻撃であれば」。attacks は攻撃を宣言した時点で
    // 数え上げているので、その攻撃自身がすでに含まれている。
    if (condition.attacksThisTurn) {
      const spec = condition.attacksThisTurn;
      const ownerIdx = spec.owner === "opponent" ? 1 - playerIdx : playerIdx;
      const count = ((state.turnStats || {}).attacks || [])[ownerIdx] || 0;
      if (spec.min != null && count < spec.min) return false;
      if (spec.max != null && count > spec.max) return false;
    }
    // 「そのパワーが0より大きければ」。基準が能力の持ち主自身のパワーなので、
    // ゾーンの枚数を数える条件では書けない。0より大きいは selfPowerMin:1。
    if (condition.selfPowerMin != null) {
      if (!entity || getPower(state, entity) < condition.selfPowerMin) return false;
    }
    // 「そのターン、クリーチャーが3体以上出ていれば」。召喚に限らず
    // バトルゾーンに出た数を数える（plays）。owner を書かなければ両者の合計。
    if (condition.entriesThisTurn) {
      const spec = condition.entriesThisTurn;
      const counts = (state.turnStats || {}).plays || [0, 0];
      const count = spec.owner === "self" ? (counts[playerIdx] || 0)
        : (spec.owner === "opponent" ? (counts[1 - playerIdx] || 0) : (counts[0] || 0) + (counts[1] || 0));
      if (spec.min != null && count < spec.min) return false;
      if (spec.max != null && count > spec.max) return false;
    }
    // 「クリーチャーが自分を攻撃する時」。攻撃された時の窓は、攻撃先が
    // プレイヤーかクリーチャーかで意味が変わる。
    if (condition.attackedTarget && (state.combat || {}).target) {
      if (state.combat.target.kind !== condition.attackedTarget) return false;
    }
    // 「自分のクリーチャーを1体破壊してもよい。そうした場合〜」。
    // 断れる選択の後で「実際にやったか」を見る。断った時も候補が無かった時も、
    // 直前の選択は空に更新されているので 0 になる。
    if (condition.lastTargetsMin != null && (state.lastTargets || []).length < condition.lastTargetsMin) return false;
    // 「この呪文を『D・D・D』で唱えたなら」。どう使われたかは能力が走る頃には
    // 手がかりが残らないので、使う前に立てた印を見る。
    if (condition.selfMark && !(entity && (entity.marks || {})[condition.selfMark])) return false;
    // 「表向きで自分のシールドゾーンにあれば」。裏向きのシールドと区別する。
    if (condition.selfFaceUp != null && Boolean(entity && entity.faceUp) !== condition.selfFaceUp) return false;
    // 「このクリーチャーに含まれるカードが10枚以上あれば」。自分自身も1枚に含む。
    if (condition.selfStackMin != null) {
      if (!entity || ((entity.under || []).length + 1) < condition.selfStackMin) return false;
    }
    // 「マナゾーンから実行した時」。実行の窓は出所で意味が変わる。
    if (condition.executedFrom) {
      const event = (state.currentEvent || {});
      if (event.executedFrom !== condition.executedFrom) return false;
    }
    if (condition.myTurn && state.activeIdx !== playerIdx) return false;
    if (condition.opponentTurn && state.activeIdx === playerIdx) return false;
    // 「そのターン、自分のシールドが2つ以上ブレイクされていなければ」のような、
    // ターン中の出来事を見る条件。件数は state.turnStats に貯める。
    if (condition.shieldsBrokenThisTurn) {
      const spec = condition.shieldsBrokenThisTurn;
      const ownerIdx = spec.owner === "opponent" ? 1 - playerIdx : playerIdx;
      const broken = ((state.turnStats || {}).shieldsBroken || [])[ownerIdx] || 0;
      if (spec.min != null && broken < spec.min) return false;
      if (spec.max != null && broken > spec.max) return false;
    }
    // 直前に見た山札のカードが条件に合うか（「そのカードがドラゴンなら」）。
    if (condition.lastLooked) {
      const spec = condition.lastLooked;
      const matched = (state.lastLooked || []).filter(function match(uid) {
        const found = engine.findEntity(state, uid);
        return found && matchesFilter(state, found.entity, spec.filter || {}, playerIdx, null);
      }).length;
      if (matched < (spec.min || 1)) return false;
    }
    // 自分と相手で枚数を比べる条件（「自分のクリーチャーの数が相手より多ければ」）。
    if (condition.zoneCompare) {
      const spec = condition.zoneCompare;
      const mine = countZoneMatches(state, playerIdx, { zone:spec.zone, owner:"self", filter:spec.filter });
      const theirs = countZoneMatches(state, playerIdx, { zone:spec.zone, owner:"opponent", filter:spec.filter });
      if (spec.more && mine <= theirs) return false;
      if (spec.atLeast && mine < theirs) return false;
      // 「相手のクリーチャーが自分より4体以上多ければ」。多いか少ないかだけでなく、
      // 差がいくつ以上あるかを見る必要がある。
      if (spec.opponentMoreBy != null && theirs - mine < spec.opponentMoreBy) return false;
    }
    if (condition.not && meetsCondition(state, playerIdx, condition.not, entity)) return false;
    return true;
  }

  // 常在能力の走査は4箇所で必要になるので、条件判定込みでここに一本化する。
  function forEachStaticEffect(state, callback) {
    // 「次の相手のターンの終わりまで、相手は呪文を唱えられない」のような、
    // 発生源が場を離れても続く効果。常在効果と同じ判定に載せるためここで混ぜる。
    (state.floatingEffects || []).forEach(function floating(item) {
      callback(item.effect, { uid:item.sourceUid || null }, item.controllerIdx);
    });
    allActiveSources(state).forEach(function scan(source) {
      const sourceController = controllerOf(state, source);
      abilitiesOf(state, source).forEach(function ability(item) {
        if (item.trigger !== "static") return;
        if (!meetsCondition(state, sourceController, item.condition, source)) return;
        (item.effects || []).forEach(function effect(entry) { callback(entry, source, sourceController); });
      });
    });
  }

  function affectsPlayer(effect, sourceController, playerIdx) {
    if (effect.who === "any") return true;
    if (effect.who === "opponent") return sourceController !== playerIdx;
    return sourceController === playerIdx;
  }

  // restrictAttack / restrictBlock / restrictSpell の判定。
  // 以前は語彙だけあって参照されておらず、カードに書いても無効だった。
  // 制限効果が数えるカウンター。「各ターン1回しか唱えられない」は
  // そのターンに何回唱えたかを見ないと判定できない。
  // 「各ターン1体しかクリーチャーを出せない」は召喚に限らないので、
  // バトルゾーンに出た回数（plays）を数える。召喚だけを数える summons とは別物。
  const RESTRICT_COUNTERS = { restrictSpell:"casts", restrictSummon:"plays", restrictAttack:"attacks" };

  function isRestricted(state, playerIdx, op, entity) {
    let restricted = false;
    forEachStaticEffect(state, function check(effect, source, sourceController) {
      if (restricted || effect.op !== op) return;
      if (!affectsPlayer(effect, sourceController, playerIdx)) return;
      if (effect.filter && entity && !matchesFilter(state, entity, effect.filter, sourceController, source.uid)) return;
      if (effect.maxPerTurn != null) {
        const counter = RESTRICT_COUNTERS[op];
        const used = counter ? (((state.turnStats || {})[counter] || [])[playerIdx] || 0) : 0;
        if (used < effect.maxPerTurn) return;
      }
      restricted = true;
    });
    return restricted;
  }

  // 「相手は各ターン合計N回までしか、クリーチャーを召喚したり呪文を唱えたり
  // できない」。召喚と呪文で別々に数えると「合計」の上限が書けないので、
  // 両方を足して見る。効果で場に出す（踏み倒し）は召喚ではないので数に入らない。
  function reachedPlayLimit(state, playerIdx) {
    const stats = state.turnStats || {};
    const used = ((stats.summons || [])[playerIdx] || 0) + ((stats.casts || [])[playerIdx] || 0);
    let blocked = false;
    forEachStaticEffect(state, function check(effect, source, sourceController) {
      if (blocked || effect.op !== "restrictPlay") return;
      if (!affectsPlayer(effect, sourceController, playerIdx)) return;
      if (effect.maxPerTurn == null) return;
      if (used >= effect.maxPerTurn) blocked = true;
    });
    return blocked;
  }

  // 「相手はその数字と同じコストのカードを実行できない」。回数の上限ではなく
  // 「このカードは実行できない」という禁止なので、1枚ずつ見るしかない。
  function playBlockedFor(state, playerIdx, entity) {
    let blocked = false;
    forEachStaticEffect(state, function check(effect, source, sourceController) {
      if (blocked || effect.op !== "restrictPlay" || !effect.filter) return;
      if (!affectsPlayer(effect, sourceController, playerIdx)) return;
      if (matchesFilter(state, entity, effect.filter, sourceController, source.uid)) blocked = true;
    });
    return blocked;
  }
  engine.playBlockedFor = playBlockedFor;

  // 「相手は手札を表向きにしてプレイする」。配信のときに、その手札だけ開く。
  function handIsRevealed(state, playerIdx) {
    let revealed = false;
    forEachStaticEffect(state, function check(effect, source, sourceController) {
      if (revealed || effect.op !== "revealHand") return;
      if (!affectsPlayer(effect, sourceController, playerIdx)) return;
      revealed = true;
    });
    return revealed;
  }

  function getPower(state, entity) {
    const definition = engine.faceDef(state, entity);
    // ハイパーモード中はパワーの数値そのものが差し替わる（加算ではない）。
    let value = (isHyper(state, entity) && definition.hyperMode && definition.hyperMode.power != null)
      ? definition.hyperMode.power
      : (definition.power || 0);
    entity.mods.forEach(function applyMod(mod) {
      // 「パワーを-∞する」。有限の数で代用すると、あとからパワーを上げる
      // カードで打ち消せてしまうので、無限そのものとして扱う。
      // state は JSON で往復するため、貯めるときは文字列のままにする。
      if (mod.kind === "power") value += (mod.value === "-infinity" ? -Infinity : mod.value);
    });
    forEachStaticEffect(state, function aura(effect, source, sourceController) {
      if (effect.op !== "powerAura") return;
      if (!matchesFilter(state, entity, effect.filter || {}, sourceController, source.uid)) return;
      value += effect.value || 0;
      // 「相手の手札にある呪文1枚につき+2000」。参照のたびに数え直すので、
      // 枚数が変わればパワーもその場で変わる（原文が常在の書き方のため）。
      if (effect.valuePer) {
        const spec = effect.valuePer;
        value += countZoneMatches(state, sourceController, spec, source.uid) * (spec.value || 0);
      }
    });
    // パワーアタッカー：攻撃中だけパワーが上がる
    if (state.combat && state.combat.attackerUid === entity.uid) {
      const attacker = getKeywordArg(state, entity, "powerAttacker");
      if (attacker) value += attacker.value || 0;
    }
    return value;
  }

  // 重ねられる進化元が今いるか。コストの計算は進化元を選ぶより前に来るので、
  // 「進化として召喚するなら安くなる」はここで見るしかない。
  function evolutionBaseExists(state, playerIdx, definition) {
    const spec = definition.evolution;
    if (!spec || spec.star) return false;
    const zone = spec.zone || "battle";
    return (state.players[playerIdx][zone] || []).some(function base(entity) {
      return matchesDefinition(engine.faceDef(state, entity), spec.from || {});
    });
  }

  // 進化元に含まれるカードの枚数。実際に選んだ進化元が決まっていればそれを、
  // まだなら「一番多いもの」を数える（手札で見えるコストは、その札で出せる
  // 一番安い値にしておかないと、出せるのに出せないように見える）。
  function baseCardCount(state, playerIdx, definition, context) {
    const chosen = context && context.baseUids;
    if (chosen && chosen.length) {
      return chosen.reduce(function total(sum, uid) {
        const found = engine.findEntity(state, uid);
        return sum + (found ? ((found.entity.under || []).length + 1) : 0);
      }, 0);
    }
    const spec = definition.evolution;
    if (!spec || spec.star) return 0;
    const zone = spec.zone || "battle";
    return (state.players[playerIdx][zone] || []).reduce(function largest(best, entity) {
      if (!matchesDefinition(engine.faceDef(state, entity), spec.from || {})) return best;
      return Math.max(best, (entity.under || []).length + 1);
    }, 0);
  }

  function getCost(state, cardOrEntity, playerIdx, context) {
    const definition = cardOrEntity.defId ? engine.faceDef(state, cardOrEntity) : cardOrEntity;
    let value = definition.cost || 0;
    forEachStaticEffect(state, function costEffect(effect, source, sourceController) {
      if (effect.op !== "costMod") return;
      if (!affectsPlayer(effect, sourceController, playerIdx)) return;
      // 「各ターン1度、コストを1少なくしてもよい」。実際に支払う瞬間に消費させると
      // 表示と支払いで値がずれるので、「そのターンまだ召喚していない間だけ効く」と読む。
      if (effect.oncePerTurn && (((state.turnStats || {}).summons || [])[playerIdx] || 0) > 0) return;
      // 「自分の手札にある◯◯すべてに与える」。どこにある札に効くかを書けないと、
      // マナや墓地から実行する時まで安くなってしまう。
      if (effect.zone && (context || {}).zone !== effect.zone) return;
      if (!matchesDefinition(definition, effect.filter || {})) return;
      value += effect.value || 0;
      // 「自分のドラゴン1つにつきコストを1少なくする」。他のカードに
      // シンパシーを配る書き方で、数え直しは参照のたびに起こる。
      if (effect.valuePer) {
        const spec = effect.valuePer;
        value += countZoneMatches(state, sourceController, spec, source.uid) * (spec.value || 0);
      }
    });
    // シンパシー：条件に合う自分のクリーチャー1体につきコストを下げる
    const sympathy = playerIdx != null ? getKeywordArg(state, cardOrEntity, "sympathy") : null;
    if (sympathy) {
      const matched = state.players[playerIdx].battle.filter(function count(entity) {
        return matchesFilter(state, entity, sympathy.filter || {}, playerIdx, null);
      }).length;
      const reduce = sympathy.max != null ? Math.min(matched, sympathy.max) : matched;
      // シンパシーの下限はカードによって違う。「1以下にはならない」と
      // 書かれたものを既定の0で扱うと、0コストで出せてしまう。
      value = Math.max(sympathy.floor || 0, value - reduce);
    }
    // カード自身が持つ軽減（「マナゾーンにドラゴンが4枚以上あれば3少なくなる」など）。
    // 常在効果と違い、手札や山札にある間も効くのでカード定義から直接読む。
    if (playerIdx != null) {
      (definition.costReduction || []).forEach(function reduce(entry) {
        if (entry.perBaseCard != null) {
          // 「進化元に含まれるカード1枚につき2少なくする。ただしコストは2以下にならない」
          const cards = baseCardCount(state, playerIdx, definition, context);
          value = Math.max(entry.floor == null ? 0 : entry.floor, value + entry.perBaseCard * cards);
        } else if (entry.per) {
          const matched = countZoneMatches(state, playerIdx, entry.per);
          let amount = (entry.value || 0) * matched;
          if (entry.max != null) amount = Math.max(amount, -Math.abs(entry.max));
          value += amount;
        } else if (entry.condition && entry.condition.hasEvolutionBase != null) {
          // 「NEO進化クリーチャーとして召喚するなら、コストを3少なくする」。
          // 進化元を選ぶより前にコストが決まるので、「重ねられる相手がいるか」で見る。
          if (evolutionBaseExists(state, playerIdx, definition) === entry.condition.hasEvolutionBase) value += entry.value || 0;
        } else if (meetsCondition(state, playerIdx, entry.condition)) {
          value += entry.value || 0;
        }
      });
    }
    return Math.max(0, value);
  }

  // getKeywords の再入を止める札。state には持たせない（配信に混ぜない）。
  const keywordScan = {};

  function getKeywords(state, entity) {
    // キーワードも能力なので、無視されるならまとめて無くなる。
    if (abilitiesAreIgnored(state, entity)) return [];
    const definition = engine.faceDef(state, entity);
    const keywords = new Set(definition.keywords || []);
    // カード自身が状況次第で得るキーワード。場の発生源からは働けない
    // （手札やシールドゾーンにある間に効くため）ので、定義から直接読む。
    (definition.selfKeywords || []).forEach(function conditional(entry) {
      if (meetsCondition(state, controllerOf(state, entity), entry.condition, entity)) keywords.add(entry.keyword);
    });
    if (isHyper(state, entity) && definition.hyperMode) {
      (definition.hyperMode.keywords || []).forEach(function hyper(value) { keywords.add(value); });
    }
    if (definition.shieldForce && shieldForceActive(state, entity)) {
      (definition.shieldForce.keywords || []).forEach(function sf(value) { keywords.add(value); });
    }
    // 「自分のクリーチャーは離れない」のように、場のカードがキーワードを配る常在効果。
    // 条件つきの静的能力を走査するので、その途中でまたキーワードを引かれると
    // 無限に潜る。同じ実体を計算中は、この走査だけを飛ばす。
    if (!keywordScan[entity.uid]) {
      keywordScan[entity.uid] = true;
      try {
        forEachStaticEffect(state, function aura(effect, source, sourceController) {
          if (effect.op !== "keywordAura") return;
          if (!matchesFilter(state, entity, effect.filter || {}, sourceController, source.uid)) return;
          keywords.add(effect.keyword);
        });
      } finally { delete keywordScan[entity.uid]; }
    }
    // 超魂X：下に敷かれたカードが、その上のクリーチャーにキーワードを与える。
    (entity.under || []).forEach(function beneath(card) {
      const soul = engine.getDef(card.defId).soulX || {};
      if (!soul.keywords) return;
      if (!meetsCondition(state, controllerOf(state, entity), soul.condition, entity)) return;
      soul.keywords.forEach(function granted(value) { keywords.add(value); });
    });
    entity.mods.forEach(function keywordMod(mod) {
      if (mod.kind === "keyword" && mod.granted) keywords.add(mod.keyword);
      if (mod.kind === "keyword" && !mod.granted) keywords.delete(mod.keyword);
    });
    return Array.from(keywords);
  }

  function hasKeyword(state, entity, keyword) {
    return getKeywords(state, entity).indexOf(keyword) >= 0;
  }

  function matchesDefinition(definition, filter) {
    // ツインパクトは、どちらかの面が条件を満たせば該当する。
    // （墓地の1枚を「クリーチャー」としても「呪文」としても参照できるため）
    if (definition.faces) {
      // 文明の数だけは合成面で見る。ツインパクトはどのゾーンでも多色カードとして扱われ、
      // 面ごとに見ると「単色が2つ」に化けてしまう。
      if (filter.civsMin != null && (definition.civs || []).length < filter.civsMin) return false;
      const perFace = Object.assign({}, filter);
      delete perFace.civsMin;
      return definition.faces.some(function anyFace(face) { return matchesDefinition(face, perFace); });
    }
    if (filter.type && definition.type !== filter.type) return false;
    // 「クリーチャー1体またはタマシードを1枚」。type は1つしか書けないので、
    // ゾーンに他の種類も居る場面では「以外を除く」書き方だと取りこぼす。
    if (filter.types && filter.types.indexOf(definition.type) < 0) return false;
    // 「カードに能力が書かれていない」。常在効果で与えられた能力は数えないので、
    // 実体ではなくカードの定義を見る（だからここに置く）。
    if (filter.vanilla != null) {
      const blank = !(definition.keywords || []).length
        && !(definition.abilities || []).length
        && !(definition.selfKeywords || []).length;
      if (blank !== filter.vanilla) return false;
    }
    if (filter.civs && !filter.civs.some(function civ(civName) { return definition.civs.indexOf(civName) >= 0; })) return false;
    if (filter.races && !filter.races.some(function race(raceName) { return (definition.races || []).indexOf(raceName) >= 0; })) return false;
    // 「ドラゴン」のような種族カテゴリは、種族名にその語を含むものすべてを指す
    // （例：アーマード・ドラゴンは「ドラゴン」に該当する）。
    if (filter.raceIncludes && !filter.raceIncludes.some(function category(word) {
      return (definition.races || []).some(function race(raceName) { return raceName.indexOf(word) >= 0; });
    })) return false;
    if (filter.costMin != null && definition.cost < filter.costMin) return false;
    if (filter.costMax != null && definition.cost > filter.costMax) return false;
    // 多色（2文明以上）かどうか。ドギラゴン閃のように多色だけを参照する能力に使う。
    if (filter.civsMin != null && (definition.civs || []).length < filter.civsMin) return false;
    if (filter.evolution != null && Boolean(definition.evolution) !== filter.evolution) return false;
    // 「NEOクリーチャー」。進化かどうかだけでは区別できないので別に見る。
    if (filter.neo != null && Boolean((definition.evolution || {}).neo) !== filter.neo) return false;
    // 「『出た時』の能力を持つクリーチャー」のように、能力の有無で選ぶ。
    if (filter.hasTrigger && !(definition.abilities || []).some(function has(ability) { return ability.trigger === filter.hasTrigger; })) return false;
    // not は matchesFilter だけでなくこちらでも効かせる。ここに無いと
    // costMod や進化元の条件に not を書いたとき、黙って全部に当たってしまう。
    if (filter.not && matchesDefinition(definition, filter.not)) return false;

  const engine = global.DMGame.engine;

    // 「シールドゾーンに置かれた時」を誘発させてしまうと処理の順序が狂う。

    shield.marks.exLife = entity.uid;
    player.shields.push(shield);

    entity.marks.exLifeDone = true;

        replacements.push({
          sourceUid:staying.entity.uid,
          key:`${staying.entity.uid}:noLeave`,
          ability:{ replaceWith:[{ op:"stay" }] },
          controllerIdx:staying.playerIdx
        });
      }
    }

    // 「相手のカードの効果によっては離れない」。バトルや自分の効果は防がないので、
    // イベントに刻まれた原因（どちらのプレイヤーの効果か）を見て判断する。
    if (event.entityUid && event.causeIdx != null
        && (event.type === "destroy" || (event.type === "moveZone" && event.toZone !== "battle"))) {
      const shielded = engine.findEntity(state, event.entityUid);
      if (shielded && shielded.zoneName === "battle" && event.causeIdx !== shielded.playerIdx) {
        let guard = null;
        engine.forEachStaticEffect(state, function check(effect, source, sourceController) {
          if (guard || effect.op !== "protectFromOpponent") return;
          if (sourceController !== shielded.playerIdx) return;
          if (effect.filter && !engine.matchesFilter(state, shielded.entity, effect.filter, sourceController, source.uid)) return;
          guard = source;
        });
        if (guard) {
          replacements.push({
            sourceUid:guard.uid || shielded.entity.uid,
            key:`${shielded.entity.uid}:protect`,
            ability:{ replaceWith:[{ op:"stay" }] },
            controllerIdx:shielded.playerIdx
          });
        }
      }
    }

    // エスケープはキーワードなので、カード定義に replacement を書かせず
    // ここで置換候補として合成する（同じ挙動を2通りに書かせない）。
    if (event.type === "destroy" && event.entityUid) {
      const found = engine.findEntity(state, event.entityUid);
      // エスケープ：墓地に置くかわりに、自分のシールドを1つ手札に加えて
      // バトルゾーンにとどまる。引き換えを払うので「してもよい」であり、
      // シールドが1つも無ければ払えない（replacementIsPayable が弾く）。
      // 加えたシールドの「S・トリガー」は使えないが、シールドを手札に加える
      // 効果はもともとS・トリガーを通さないので、ここでは何もしなくてよい。
      if (found && found.zoneName === "battle" && engine.hasKeyword(state, found.entity, "escape")) {
        const ability = { optional:true, replaceWith:[{ op:"stay" }, { op:"shieldToHand", count:1, owner:"self" }] };
        if (replacementIsPayable(state, ability, found.playerIdx, found.entity.uid)) {
          replacements.push({
            sourceUid:found.entity.uid,
            key:`${found.entity.uid}:escape`,
            ability,
            controllerIdx:found.playerIdx,
            optional:true
          });
        }
      }
    }
    return replacements;
  }

  function performEvent(state, event) {
    if (event.type === "draw") {
      const player = state.players[event.playerIdx];
      const requested = event.count || 0;
      for (let count = 0; count < requested; count += 1) {
        if (player.deck.length === 0) break;
        player.hand.push(player.deck.shift());
      }
      // ルール上の敗北は「最後の1枚を引いた瞬間」であって、引けなくなった時点ではない
      // （第2部 §10）。引き終えた結果 0 枚なら、その場で敗北が確定する。
      if (requested > 0 && player.deck.length === 0 && !engine.cannotLose(state, event.playerIdx)) {
        // 「山札の最後の1枚を引く時、負けるかわりに勝つ」。
        if (engine.winsOnDeckOut && engine.winsOnDeckOut(state, event.playerIdx)) {
          // 「引き切ったら勝つ」も、負けるのは相手。相手が「負けない」なら成立しない。
          if (engine.cannotLose(state, 1 - event.playerIdx)) {
            engine.addLog(state, `${state.players[1 - event.playerIdx].name}は敗北しませんでした。`);
            return;
          }
          state.winner = event.playerIdx;
          state.reason = "山札を引き切った";
        } else {
          state.winner = 1 - event.playerIdx;
          state.reason = "山札切れ";
        }
      }
    } else if (event.type === "moveZone") {
      const move = engine.moveEntity(state, event.entityUid, event.toPlayerIdx, event.toZone, { toTop:event.toTop });
      if (move && move.fromZone === "shields") {
        engine.noteShieldLeft(state, move.fromPlayerIdx);
        // 「カードが自分のシールドゾーンを離れた時」。ブレイクに限らず、
        // 手札に加える・墓地に置くなど、離れ方を問わずここを通る。
        if (engine.collectTriggers) engine.collectTriggers(state, { type:"shieldLeft", entityUid:event.entityUid, playerIdx:move.fromPlayerIdx });
      }
      // 「カードが自分のマナゾーンを離れた時」。マナ破壊でも、マナから召喚した
      // 場合でも、離れ方を問わずここを通る。誰のマナかは watch の filter で絞る。
      if (move && move.fromZone === "mana" && engine.collectTriggers) {
        engine.collectTriggers(state, { type:"manaLeave", entityUid:event.entityUid, playerIdx:move.fromPlayerIdx });
      }
      const moved = engine.findEntity(state, event.entityUid);
      // ジャストダイバー：場に出た時点で印を付ける。外れるのは自分の次のターン開始時。
      if (moved && moved.zoneName === "battle" && engine.hasKeyword(state, moved.entity, "justDiver")) moved.entity.marks.justDiver = true;
      // ガイアッシュのような「このターン出たクリーチャー」を参照する能力のために、
      // 出た瞬間のターン番号を控える。出方（革命チェンジなど）は移動前に印を付ける。
      if (moved && moved.zoneName === "battle") {
        moved.entity.marks.enteredTurn = state.turnCount;
        addExLifeShield(state, moved);
        // シールド・フォース：出す時に、束ねるシールドを選ばせる。
        if (engine.queueShieldForce) engine.queueShieldForce(state, moved.entity.uid);
        // ヨビニオン：召喚によって出た時だけ開く。
        if (engine.queueYobinion) engine.queueYobinion(state, moved.entity.uid);
        // 「クリーチャーを出す」の回数。召喚に限らず、場に出た回数そのもの。
        state.turnStats = state.turnStats || {};
        state.turnStats.plays = state.turnStats.plays || [0, 0];
        state.turnStats.plays[moved.playerIdx] += 1;
        // 「マナゾーンのカードをタップせずに出た」。支払いを伴う実行だけが有料で、
        // 効果で場に出したものはすべてこちらに入る。支払った側が名乗り出るので、
        // 名乗りの無いものを踏み倒しとみなす。以前は実行の経路でしか印を付けて
        // おらず、効果で出したクリーチャーが「踏み倒しではない」ことになっていた。
        if (state.paidEntryUid !== moved.entity.uid) {
          moved.entity.marks.freePlayed = true;
          state.turnStats.freePlays = state.turnStats.freePlays || [0, 0];
          state.turnStats.freePlays[moved.playerIdx] += 1;
          if (engine.collectTriggers) engine.collectTriggers(state, { type:"freePlay", sourceUid:moved.entity.uid, playerIdx:moved.playerIdx });
        }
      }
    } else if (event.type === "destroy") {
      const found = engine.findEntity(state, event.entityUid);
      if (found && found.zoneName === "battle") {
        const stack = found.entity.under.splice(0);
        // 「下にあったカードをすべて墓地から〜」。墓地へ落ちた後では、どれが
        // 下にあったのか分からなくなる。動かす前に控えておく。
        found.entity.marks.lastUnder = stack.map(function uid(card) { return card.uid; });
        engine.moveEntity(state, event.entityUid, found.entity.ownerIdx, "graveyard");
        stack.forEach(function bury(entity) { state.players[entity.ownerIdx].graveyard.push(entity); });
      }
    } else if (event.type === "tap" || event.type === "untap") {
      const found = engine.findEntity(state, event.entityUid);
      // 「クリーチャーがタップした時」。すでに倒れているものを重ねて倒しても
      // 誘発しない（倒れた瞬間だけが「タップした時」）。
      const wasUntapped = Boolean(found) && !found.entity.tapped;
      if (found) found.entity.tapped = event.type === "tap";
      if (found && event.type === "tap" && wasUntapped && found.zoneName === "battle") {
        engine.collectTriggers(state, { type:"tapped", entityUid:found.entity.uid, playerIdx:found.playerIdx });
      }
    } else if (event.type === "powerMod") {
      const found = engine.findEntity(state, event.entityUid);
      // 「次の自分のターンのはじめまで」は、効果を使った側のターンで切れる。
      // カードの持ち主に紐づく turn とは切れ目が違うので、誰の効果かを控える。
      if (found) found.entity.mods.push({ kind:"power", value:event.value, duration:event.duration || "turn", byIdx:event.byIdx, createdTurn:state.turnCount });
    } else if (event.type === "keywordMod") {
      const found = engine.findEntity(state, event.entityUid);
      if (found) found.entity.mods.push({ kind:"keyword", keyword:event.keyword, granted:event.granted, duration:event.duration || "turn", byIdx:event.byIdx, createdTurn:state.turnCount });
    } else if (event.type === "loseGame") {
      if (engine.cannotLose(state, event.playerIdx)) return;
      state.winner = 1 - event.playerIdx;
      state.reason = event.reason || "敗北";
    }
  }

  // 「破壊されるかわりに◯◯へ」の行き先。1つずつ分岐を増やすと必ず抜けるので表にする。
  const REPLACEMENT_ZONES = { toMana:"mana", bounce:"hand", toShield:"shields", toDeckTop:"deck", toDeckBottom:"deck", discard:"graveyard" };

  // 置換の中身は「行き先の差し替え」1つとは限らない。
  // 「かわりに自分のシールドを2つ手札に加える」のような副作用も一緒に書けるようにする。
  function replacementToEvent(state, replacement, event) {
    const steps = replacement.ability.replaceWith || [];
    let result = event;
    const extras = [];
    steps.forEach(function step(effect) {
      if (effect.op === "stay") {
        // 何も起きなかったことにする。performEvent は知らない type を無視する。
        result = { type:"noop", replaced:event.type, entityUid:event.entityUid };
        return;
      }
      const zone = REPLACEMENT_ZONES[effect.op];
      if (zone && event.entityUid && !effect.asEffect && result === event) {
        const found = engine.findEntity(state, event.entityUid);
        if (found) {
          result = { type:"moveZone", entityUid:event.entityUid, toPlayerIdx:found.entity.ownerIdx, toZone:zone, toTop:effect.op === "toDeckTop", replaced:event.type };
          return;
        }
      }
      extras.push(effect);
    });
    if (extras.length) {
      engine.queueEffects(state, extras, { controllerIdx:replacement.controllerIdx, sourceUid:replacement.sourceUid });
    }
    return result;
  }

  function applyEvent(state, rawEvent) {
    const event = engine.clone(rawEvent);
    event.id = event.id || `v${state.eventLog.length + 1}`;
    // どちらのプレイヤーのカードの効果で起きたイベントか。効果の実行中だけ立っている。
    // バトルやルールによる移動には原因が付かないので、そこは保護の対象にならない。
    if (event.causeIdx == null && state.effectCause != null) event.causeIdx = state.effectCause;
    event.usedReplacements = event.usedReplacements || [];
    const replacements = collectReplacements(state, event).filter(function unused(item) { return event.usedReplacements.indexOf(item.key) < 0; });
    // 「してもよい」置換が混ざっていれば、適用しない選択肢も出す。
    const skippable = replacements.length > 0 && replacements.every(function optional(item) { return item.optional; });
    if (replacements.length > 1 || (replacements.length === 1 && skippable)) {
      state.pending = {
        type:"chooseMode",
        playerIdx:replacements[0].controllerIdx,
        prompt:replacements.length === 1 ? "置換効果を使いますか？" : "適用する置換効果を選んでください。",
        options:replacements.map(function option(item) {
          const found = engine.findEntity(state, item.sourceUid);
          const name = found ? engine.getDef(found.entity.defId).name : "置換効果";
          // 「かわりに手札に戻すかマナゾーンに置く」のように、同じカードが
          // 複数の行き先を持つことがある。名前だけでは選び分けられない。
          return { value:item.key, label:item.label ? `${name}（${item.label}）` : name };
        }).concat(skippable ? [{ value:"none", label:"使わない" }] : []),
        min:1,
        max:1,
        skippable:false,
        resume:{ kind:"replacement", event, replacements }
      };
      return false;
    }
    let finalEvent = event;
    if (replacements.length === 1) {
      finalEvent.usedReplacements.push(replacements[0].key);
      finalEvent = replacementToEvent(state, replacements[0], finalEvent);
    }
    // 「離れた時」は、動く前にどこにいたかを控えておかないと判定できない。
    const beforeMove = finalEvent.entityUid ? engine.findEntity(state, finalEvent.entityUid) : null;
    const fromZone = beforeMove ? beforeMove.zoneName : null;
    performEvent(state, finalEvent);
    state.eventLog.push(finalEvent);
    if (engine.collectTriggers) engine.collectTriggers(state, finalEvent);
    // 「このクリーチャーが離れた時」。破壊も、手札やマナへ戻された場合も、
    // バトルゾーンから出たならすべてここを通す。
    if (engine.collectTriggers && finalEvent.entityUid && fromZone === "battle"
      && (finalEvent.type === "destroy" || (finalEvent.type === "moveZone" && finalEvent.toZone !== "battle"))) {
      const left = engine.findEntity(state, finalEvent.entityUid);
      if (left && left.zoneName !== "battle") {
        engine.collectTriggers(state, { type:"leave", entityUid:finalEvent.entityUid, playerIdx:left.playerIdx });
        // メガ・ラスト・バースト：離れて手札・マナゾーン・墓地に置かれたら、
        // そのカードの呪文側をコストを支払わずに唱えてもよい。
        if (engine.queueMegaLastBurst) engine.queueMegaLastBurst(state, finalEvent.entityUid);
      }
    }
    // 「どこからでも墓地に置かれた時」。破壊も、手札やマナから落ちた場合も、
    // 行き先が墓地ならすべてここを通す。移動が済んで実際に墓地にある時だけ。
    //
    // destroy は moveZone を経由しないので、両方の型を見る必要がある。
    if (engine.collectTriggers && finalEvent.entityUid
      && (finalEvent.type === "destroy" || (finalEvent.type === "moveZone" && finalEvent.toZone === "graveyard"))) {
      const landed = engine.findEntity(state, finalEvent.entityUid);
      if (landed && landed.zoneName === "graveyard") {
        engine.collectTriggers(state, { type:"toGraveyard", entityUid:finalEvent.entityUid, playerIdx:landed.playerIdx });
      }
    }
    return true;
  }

  engine.collectReplacements = collectReplacements;
  engine.performEvent = performEvent;
  engine.applyEvent = applyEvent;
  engine.replacementToEvent = replacementToEvent;
}(globalThis));

(function defineEffects(global) {
  const engine = global.DMGame.engine;
  const EFFECTS = {};

  function entitiesInSelector(state, selector, controllerIdx, sourceUid) {
    if (selector && selector.self) {
      const source = engine.findEntity(state, sourceUid);
      return source ? [source.entity] : [];
    }
    // 「その後、そのクリーチャーに〜」。直前の効果が選んだ相手をそのまま受け継ぐ。
    // 選ばれなかった（断った・候補が無かった）場合は空になる。
    if (selector && selector.lastTargets) {
      return (state.lastTargets || []).map(function find(uid) {
        const found = engine.findEntity(state, uid);
        return found ? found.entity : null;
      }).filter(function usable(entity) {
        return entity && engine.matchesFilter(state, entity, selector.filter || {}, controllerIdx, sourceUid);
      });
    }
    // 「相手のクリーチャーが〜した時、そのクリーチャーを破壊する」。
    // 見張った相手そのものを指す。owner で絞る ownerIsWatched とは別で、
    // こちらはカード1枚を名指しする。
    if (selector && selector.watched) {
      const found = state.lastWatched ? engine.findEntity(state, state.lastWatched) : null;
      if (!found) return [];
      return engine.matchesFilter(state, found.entity, selector.filter || {}, controllerIdx, sourceUid) ? [found.entity] : [];
    }
    const target = selector || {};
    // zone は文字列でも配列でもよい。「手札またはマナゾーンから」を1つのセレクタで書く。
    const zones = target.zone ? [].concat(target.zone) : ["battle"];
    const entities = [];
    state.players.forEach(function scanPlayer(player) {
      zones.forEach(function scanZone(zoneName) {
        (player[zoneName] || []).forEach(function candidate(entity) {
          if (engine.matchesFilter(state, entity, Object.assign({}, target.filter || {}, { owner:target.owner }), controllerIdx, sourceUid) && engine.canBeChosen(state, entity, controllerIdx)) entities.push(entity);
        });
      });
    });
    // 「パワーが一番小さい／大きいものを1体選び」。1枚ごとの条件では書けず、
    // 候補が出そろってから比べる必要があるので、絞り込みはここで行う。
    // 同じパワーが複数あれば全部残し、その中から選ばせる。
    let remaining = entities;
    if (target.powerExtreme && remaining.length) {
      const powers = remaining.map(function power(entity) { return engine.getPower(state, entity); });
      const limit = target.powerExtreme === "max" ? Math.max.apply(null, powers) : Math.min.apply(null, powers);
      remaining = remaining.filter(function extreme(entity) { return engine.getPower(state, entity) === limit; });
    }
    // 「相手が自分のクリーチャーを選ぶ時、可能ならこのクリーチャーを選ぶ」。
    // 「可能なら」なので、他の絞り込み（一番パワーが小さいものなど）を通り抜けて
    // 候補に残った時だけ効く。だから絞り込みの最後に置く。
    const forced = remaining.filter(function must(entity) {
      return engine.controllerOf(state, entity) !== controllerIdx && engine.hasKeyword(state, entity, "mustBeChosen");
    });
    if (forced.length) {
      const owners = forced.map(function owner(entity) { return engine.controllerOf(state, entity); });
      // 効くのはそのクリーチャーの持ち主のぶんだけ。自分の側の候補までは狭めない。
      remaining = remaining.filter(function keep(entity) {
        const owner = engine.controllerOf(state, entity);
        return owners.indexOf(owner) < 0 || engine.hasKeyword(state, entity, "mustBeChosen");
      });
    }
    return remaining;
  }

  function targetCount(selector, candidates) {
    if (selector.countMode === "all") return candidates.length;
    return selector.count == null ? 1 : selector.count;
  }

  function queueEffects(state, effects, ctx) {
    (effects || []).forEach(function enqueue(effect) { state.effectQueue.push({ effect:engine.clone(effect), ctx:engine.clone(ctx) }); });
  }

  // 選択の答えを、待ち行列の「先頭」に積む。
  // 後ろに積むと、モードを選んでいる間に待たされていた後続の効果が先に走り、
  // 「Aするか選ぶ。その後Bする」が「Bしてから A」になってしまう。
  function queueEffectsFront(state, effects, ctx) {
    const items = (effects || []).map(function build(effect) {
      return { effect:engine.clone(effect), ctx:engine.clone(ctx) };
    });
    if (items.length) state.effectQueue.unshift.apply(state.effectQueue, items);
  }

  function executeEffectItem(state, item) {
    const effect = item.effect;
    // forEach が配った対象を、自前のセレクタを持たない効果が引き継ぐ。
    // これが無いと「1体選び、アンタップして、パワーを上げて、能力を与える」が書けない。
    if (!effect.target && !effect._targets && item.ctx.targets) effect._targets = item.ctx.targets.slice();
    if (effect.target && !effect._targets) {
      const candidates = entitiesInSelector(state, effect.target, item.ctx.controllerIdx, item.ctx.sourceUid);
      const count = Math.min(targetCount(effect.target, candidates), candidates.length);
      // 対象が無かった場合も「直前に選んだもの」を空に更新する。前の効果の選択が
      // 残っていると、costMaxRef のような連動条件が誤った上限で動く。
      if (count === 0) { state.lastTargets = []; return true; }
      if (effect.target.random) {
        effect._targets = engine.shuffle(state, candidates.slice()).slice(0, count).map(function uid(entity) { return entity.uid; });
        state.lastTargets = effect._targets.slice();
        // 選ぶ余地が無ければ黙って進める。ただし「〜してもよい」は、
        // 候補が1つでも「やらない」が選べる。ここを機械に決めさせると、
        // 断れることに意味がある能力（相手にシールドを与えるなど）が強制になる。
      } else if (effect.target.countMode === "all" || effect.target.self
        || (!effect.target.optional && candidates.length <= count)) {
        effect._targets = candidates.slice(0, count).map(function uid(entity) { return entity.uid; });
        state.lastTargets = effect._targets.slice();
      } else {
        // 「相手は自分の手札を1枚捨てる」のように、選ぶ人が能力の持ち主とは限らない。
        // chooser:"watched" は「見張ったカードの持ち主が選ぶ」。
        // 「いずれかのプレイヤーが〜した時、そのプレイヤーは選んで破壊する」に使う。
        let chooserIdx = effect.target.chooser === "opponent" ? 1 - item.ctx.controllerIdx : item.ctx.controllerIdx;
        if (effect.target.chooser === "watched" && state.lastWatched) {
          const watched = engine.findEntity(state, state.lastWatched);
          if (watched) chooserIdx = engine.controllerOf(state, watched.entity);
        }
        state.pending = {
          type:"chooseTarget",
          playerIdx:chooserIdx,
          prompt:"効果の対象を選んでください。",
          options:candidates.map(function option(entity) { return { value:entity.uid, label:engine.getDef(entity.defId).name }; }),
          min:effect.target.optional ? 0 : count,
          max:count,
          skippable:Boolean(effect.target.optional),
          resume:{ kind:"effectTarget", item }
        };
        return false;
      }
    }
    const handler = EFFECTS[effect.op];
    if (!handler) throw new Error(`未登録の効果opです: ${effect.op}`);
    // この効果が起こすイベントに「誰のカードの効果か」を刻むための目印。
    const previousCause = state.effectCause;
    state.effectCause = item.ctx.controllerIdx;
    try { handler(state, item.ctx, effect); }
    finally { state.effectCause = previousCause; }
    return true;
  }

  function triggerLabel(state, trigger) {
    const found = engine.findEntity(state, trigger.ctx.sourceUid);
    return found ? engine.faceDef(state, found.entity).name : "能力";
  }

    state.lastLooked = taken.slice();
    // 「1枚を手札に加えるかマナゾーンに置き」。行き先そのものを選ばせるカードは、
    // 何を取るか決まってからでないと訊けない。取れなかった時は訊く意味がない。
    if (effect.toChoice && taken.length) {
      state.pending = {
        type:"chooseMode",
        playerIdx,
        prompt:effect.toChoicePrompt || "そのカードをどこに置きますか？",
        options:effect.toChoice.map(function option(zone) { return { value:zone, label:ZONE_LABELS[zone] || zone }; }),
        min:1,
        max:1,
        skippable:false,
        resume:{ kind:"lookAndChooseDest", controllerIdx:playerIdx, lookedUids, taken, effect:engine.clone(effect) }
      };
      return;
    }
    moveLookResult(state, playerIdx, lookedUids, taken, effect, effect.to || "hand");
  }

  const ZONE_LABELS = { hand:"手札", mana:"マナゾーン", graveyard:"墓地", shields:"シールドゾーン", deck:"山札の下" };

  // 見た順を保ったまま、取ったものと残りに分ける。
  function moveLookResult(state, playerIdx, lookedUids, taken, effect, toZone) {
    const player = state.players[playerIdx];
    lookedUids.forEach(function move(uid) {
      const found = engine.findEntity(state, uid);
      if (!found) return;
      const entity = found.entity;
      const chosen = (taken || []).indexOf(uid) >= 0;
      // 場に出す時だけはイベントを通す。置換効果と「出た時」の能力を通すため。
      // 山札から抜いたままでは実体を探せないので、抜かずにそのまま動かす。
      if (chosen && toZone === "battle" && engine.canBeSummoned(state, entity, playerIdx, "deck")) {
        entity.sick = true;
        engine.applyEvent(state, { type:"moveZone", entityUid:entity.uid, toPlayerIdx:playerIdx, toZone:"battle", sourceUid:entity.uid });
        return;
      }
      player.deck.splice(player.deck.indexOf(entity), 1);
      // 「手札に加えるか、タップしてマナゾーンに置く」。行き先によってタップの
      // 有無が変わるカードがあるので、タップする行き先だけを並べて指定させる。
      if (chosen && (effect.tappedIn || []).indexOf(toZone) >= 0) entity.tapped = true;
      // 出せない状況（各ターンの上限など）なら、選ばれていても残りと同じ扱いにする。
      if (chosen && toZone !== "battle") player[toZone].push(entity);
      else player[effect.restTo || "deck"].push(entity);
    });
  }

  engine.finishLookAndChoose = finishLookAndChoose;
  engine.askLookGroup = askLookGroup;
  engine.moveLookResult = moveLookResult;

  // EXライフの身代わり。離れるかわりに、紐づいたシールドを1つ墓地へ置く。
  EFFECTS.exLifeToGraveyard = function exLifeToGraveyard(state, ctx, effect) {
    const found = engine.findEntity(state, ctx.sourceUid);
    if (!found) return;
    const shield = engine.exLifeShieldOf(state, found.entity);
    if (!shield) return;
    delete shield.marks.exLife;
    engine.applyEvent(state, { type:"moveZone", entityUid:shield.uid, toPlayerIdx:shield.ownerIdx, toZone:"graveyard" });
  };

  // メクレイドN：山札の上から3枚を見て、その中から指定の種族でコストN以下のカードを
  // 1枚、コストを支払わずに使ってもよい。残りを山札の下に置く。
  //
  // 見ている3枚はどのゾーンにも属さない。実体を探せないと選択も実行もできないので、
  // 山札の先頭に戻したまま「候補の uid」だけを控え、答えが返ってから動かす。
  EFFECTS.mecleid = function mecleid(state, ctx, effect) {
    if (engine.deckLookBlocked(state, ctx.controllerIdx)) return;
    const player = state.players[ctx.controllerIdx];
    const looked = player.deck.slice(0, effect.count == null ? 3 : effect.count);
    if (!looked.length) return;
    // 上限は数値で書くのが基本だが、「自分の手札の枚数以下のコスト」のように
    // その場の枚数で決まるカードがある。見ている札は手札に入っていない。
    const limit = effect.costFrom === "hand"
      ? player.hand.length
      : (effect.value == null ? Infinity : effect.value);
    const legal = looked.filter(function usable(entity) {
      const definition = engine.faceDef(state, entity);
      if (engine.getCost(state, definition, ctx.controllerIdx) > limit) return false;
      return !effect.filter || engine.matchesDefinition(definition, effect.filter);
    });
    const lookedUids = looked.map(function uid(entity) { return entity.uid; });
    if (!legal.length) { finishMecleid(state, ctx.controllerIdx, lookedUids, null, effect.restTo); return; }
    state.pending = {
      type:"chooseMode",
      playerIdx:ctx.controllerIdx,
      prompt:effect.prompt || `メクレイド${effect.value == null ? "" : effect.value}：使うカードを選んでください。`,
      options:legal.map(function option(entity) {
        const definition = engine.faceDef(state, entity);
        return { value:entity.uid, label:`${definition.name}（コスト${definition.cost}）` };
      }).concat([{ value:"none", label:"使わない" }]),
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"mecleid", lookedUids, controllerIdx:ctx.controllerIdx, restTo:effect.restTo || "deck" }
    };
  };

  // 見た中から使わなかったぶんの行き先。既定は山札の下で、順序は見た順を保つ。
  // 「実行しないなら、自分の手札に加える」と書かれたカードのために手札も選べる。
  function finishMecleid(state, playerIdx, uids, keptUid, restTo) {
    const player = state.players[playerIdx];
    uids.forEach(function move(uid) {
      if (uid === keptUid) return;
      const index = player.deck.findIndex(function match(entity) { return entity.uid === uid; });
      if (index < 0) return;
      const entity = player.deck.splice(index, 1)[0];
      if (restTo && restTo !== "deck") player[restTo].push(entity);
      else player.deck.push(entity);
    });
  }
  engine.mecleidRest = finishMecleid;

  // ガチンコ・ジャッジ：おたがいに山札の一番上を表向きにし、コストが大きいほうが勝ち。
  // 引き分けは勝ちではない（第2部の勝敗判定と同じく、明確に上回った時だけ勝ち）。
  EFFECTS.gachinkoJudge = function gachinkoJudge(state, ctx, effect) {
    if (engine.deckLookBlocked(state, ctx.controllerIdx)) return;
    const opponentIdx = 1 - ctx.controllerIdx;
    const mine = state.players[ctx.controllerIdx].deck[0] || null;
    const theirs = state.players[opponentIdx].deck[0] || null;
    const myCost = mine ? engine.getDef(mine.defId).cost || 0 : -1;
    const theirCost = theirs ? engine.getDef(theirs.defId).cost || 0 : -1;
    [mine, theirs].forEach(function show(entity) { if (entity) entity.faceUp = true; });
    const won = myCost > theirCost;
    engine.addLog(state, `ガチンコ・ジャッジ：${myCost} 対 ${theirCost}（${won ? "勝ち" : "勝てず"}）`);
    [[mine, ctx.controllerIdx], [theirs, opponentIdx]].forEach(function bury(pair) {
      if (pair[0]) engine.applyEvent(state, { type:"moveZone", entityUid:pair[0].uid, toPlayerIdx:pair[1], toZone:"graveyard" });
    });
    engine.queueEffects(state, (won ? effect.then : effect.else) || [], ctx);
  };

  // 発生源が場を離れても続く効果を貼る。turns は「あと何ターン分もつか」。
  // 1 なら、この能力を使ったターンと次のターンの終わりまで効く。
  // 「そのターンの終わりに〜」。後のターンの終わりに1度だけ走る予約。
  // floatEffect は常在効果を貼るものなので、1度きりの処理はこちらで持つ。
  // 発生源が場を離れても走るよう、予約はプレイヤーに紐づける。
  EFFECTS.delayedEffect = function delayedEffect(state, ctx, effect) {
    state.delayedEffects = state.delayedEffects || [];
    state.delayedEffects.push({
      effects:engine.clone(effect.effects || []),
      controllerIdx:ctx.controllerIdx,
      sourceUid:ctx.sourceUid,
      // 「次の自分のターンのはじめに」。追加ターンがあるとターン番号では
      // 「次の自分のターン」を数えられないので、予約した人のターンが
      // 始まったことで見る。予約したターン自身では走らせない。
      at:effect.at || "turnEnd",
      createdTurn:state.turnCount,
      runOnTurn:state.turnCount + (effect.turns == null ? 0 : effect.turns)
    });
  };
  EFFECTS.floatEffect = function floatEffect(state, ctx, effect) {
    state.floatingEffects = state.floatingEffects || [];
    // 同じ期限で複数の効果を貼れる（「負けず、かつ離れない」のような一続きの記述）。
    const list = effect.effects ? effect.effects : [effect.effect || {}];
    list.forEach(function attach(item) {
      state.floatingEffects.push({
        effect:engine.clone(item),
        controllerIdx:ctx.controllerIdx,
        sourceUid:ctx.sourceUid,
        expiresTurn:state.turnCount + (effect.turns == null ? 1 : effect.turns)
      });
    });
  };

  // ターンの残りをとばす。解決の途中なので直接フェーズを動かさず、印だけ立てる。
  EFFECTS.skipTurn = function skipTurn(state) {
    state.skipRest = true;
    state.combat = null;
    engine.addLog(state, "ターンの残りがとばされました。");
  };
  EFFECTS.reveal = function reveal(state, ctx, effect) { selectFromZone(state, ctx.controllerIdx, effect.zone || "deck", {}).slice(0,effect.count || 1).forEach(function revealCard(entity) { entity.faceUp = true; }); };
  // メガ・ラスト・バースト：離れて手札・マナゾーン・墓地に置かれたカードの
  // 呪文側を、コストを支払わずに唱えてもよい。
  // 誘発として積まれてから走るので、他の選択と順番を取り合わない。
  // ヨビニオン：山札の上から「これよりコストが小さいクリーチャー」が出るまで
  // 表向きにする。何枚めくるかは引いてみるまで決まらないので、lookAndPick の
  // ように枚数を先に決める書き方では表せない。
  //
  // 「してもよい」なので、まず開くかどうかを訊く。開いた後は、出るまで
  // めくり続けるところに選ぶ余地は無い（残りはシャッフルして山札の下）。
  EFFECTS.yobinion = function yobinion(state, ctx) {
    if (engine.deckLookBlocked(state, ctx.controllerIdx)) return;
    const found = engine.findEntity(state, ctx.sourceUid);
    if (!found || !state.players[ctx.controllerIdx].deck.length) return;
    state.pending = {
      type:"chooseMode",
      playerIdx:ctx.controllerIdx,
      prompt:"ヨビニオン：山札をめくりますか？",
      options:[{ value:"go", label:"めくる" }, { value:"none", label:"めくらない" }],
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"yobinion", uid:ctx.sourceUid, controllerIdx:ctx.controllerIdx }
    };
  };

  // めくる本体。答えが返ってから呼ぶ。
  engine.performYobinion = function performYobinion(state, playerIdx, sourceUid) {
    const found = engine.findEntity(state, sourceUid);
    if (!found) return;
    const limit = engine.getCost(state, engine.faceDef(state, found.entity), playerIdx);
    const player = state.players[playerIdx];
    const revealed = [];
    let target = null;
    while (player.deck.length) {
      const card = player.deck.shift();
      const definition = engine.faceDef(state, card);
      // 見たものは全部めくった扱い。条件に合う1体が出たら、そこで止まる。
      if (definition.type === "creature" && engine.getCost(state, definition, playerIdx) < limit) { target = card; break; }
      revealed.push(card);
    }
    // 残りをシャッフルして山札の下へ。出す前に戻しておかないと、
    // 「出た時」の能力が山札を見る時に食い違う。
    engine.shuffle(state, revealed).forEach(function bury(card) { player.deck.push(card); });
    if (!target) {
      engine.addLog(state, `${player.name}の「ヨビニオン」は条件に合うクリーチャーを見つけられませんでした。`, [sourceUid]);
      return;
    }
    if (!engine.canBeSummoned(state, target, playerIdx, "deck")) { player.deck.push(target); return; }
    // 山札から抜いたままでは実体を探せないので、一度だけ山札の先頭に戻す。
    player.deck.unshift(target);
    target.sick = true;
    engine.applyEvent(state, { type:"moveZone", entityUid:target.uid, toPlayerIdx:playerIdx, toZone:"battle", sourceUid:target.uid });
  };

  EFFECTS.megaLastBurst = function megaLastBurst(state, ctx) {
    const found = engine.findEntity(state, ctx.sourceUid);
    if (!found || ["hand", "mana", "graveyard"].indexOf(found.zoneName) < 0) return;
    const definition = engine.getDef(found.entity.defId);
    const spellFace = definition.faces && definition.faces[1];
    if (!spellFace) return;
    state.pending = {
      type:"chooseMode",
      playerIdx:ctx.controllerIdx,
      prompt:`メガ・ラスト・バースト：「${spellFace.name}」をコストを支払わずに唱えますか？`,
      options:[{ value:"cast", label:"唱える" }, { value:"none", label:"唱えない" }],
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"megaLastBurst", uid:ctx.sourceUid, controllerIdx:ctx.controllerIdx }
    };
  };

  // 「数字をひとつ言う」。言った数はその場かぎりの値ではなく、後から貼る効果の
  // 中に埋め込む必要がある（次に別の数を言っても、先に貼った効果は変わらない）。
  // そこで then の中の "$declared" を、答えが返った時点でその数字に差し替える。
  EFFECTS.declareNumber = function declareNumber(state, ctx, effect) {
    const low = effect.min == null ? 1 : effect.min;
    // 「このクリーチャーに含まれるカードの枚数まで」のように、上限がその場で
    // 決まるカードがある。数字を並べる前に数えておく。
    let high = effect.max == null ? 12 : effect.max;
    if (effect.maxFrom && effect.maxFrom.selfStack) {
      const source = engine.findEntity(state, ctx.sourceUid);
      high = source ? ((source.entity.under || []).length + 1) : 0;
    }
    const options = [];
    for (let value = low; value <= high; value += 1) options.push({ value:String(value), label:String(value) });
    if (!options.length) return;
    state.pending = {
      type:"chooseMode",
      playerIdx:ctx.controllerIdx,
      prompt:effect.prompt || "数字をひとつ言ってください。",
      options,
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"declareNumber", ctx:engine.clone(ctx), then:engine.clone(effect.then || []) }
    };
  };

  // 「その捨てたカードと同じコストの」。参照したカードのコストを、
  // declareNumber と同じ仕組みで効果に焼き付ける。
  // 生きた参照（costMaxRef）のままだと、後の効果で参照先が変わったときに
  // すでに貼った効果の意味まで変わってしまう。
  EFFECTS.bakeCost = function bakeCost(state, ctx, effect) {
    const uids = effect.from === "watched"
      ? (state.lastWatched ? [state.lastWatched] : [])
      : (state.lastTargets || []);
    const found = uids.length ? engine.findEntity(state, uids[0]) : null;
    if (!found) return;
    const cost = engine.getCost(state, engine.faceDef(state, found.entity), ctx.controllerIdx);
    engine.queueEffectsFront(state, engine.substituteDeclared(engine.clone(effect.then || []), cost), ctx);
  };

  // "$declared" を、言った数字に差し替える。入れ子の配列・オブジェクトも辿る。
  engine.substituteDeclared = function substituteDeclared(value, number) {
    if (Array.isArray(value)) return value.map(function each(item) { return substituteDeclared(item, number); });
    if (value && typeof value === "object") {
      const copy = {};
      Object.keys(value).forEach(function key(name) { copy[name] = substituteDeclared(value[name], number); });
      return copy;
    }
    return value === "$declared" ? number : value;
  };

  // スマッシュ・バースト：攻撃する時、このカードの呪文側を、バトルゾーンに
  // 置いたままコストを支払わずに唱えてもよい。カードは動かないので、
  // 呪文側の「唱えた時」の効果だけをその場で解決する。
  EFFECTS.smashBurst = function smashBurst(state, ctx) {
    const found = engine.findEntity(state, ctx.sourceUid);
    if (!found || found.zoneName !== "battle") return;
    const definition = engine.getDef(found.entity.defId);
    const spellFace = definition.faces && definition.faces[1];
    if (!spellFace) return;
    state.pending = {
      type:"chooseMode",
      playerIdx:ctx.controllerIdx,
      prompt:`スマッシュ・バースト：「${spellFace.name}」をコストを支払わずに唱えますか？`,
      options:[{ value:"cast", label:"唱える" }, { value:"none", label:"唱えない" }],
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"smashBurst", uid:ctx.sourceUid, controllerIdx:ctx.controllerIdx }
    };
  };

  // シールド・フォースの実体。カードには書かない。出た時に engine が誘発として積み、
  // どのシールドと束ねるかを訊く。選んだシールドが残っている間だけSF能力が働く。
  EFFECTS.bindShieldForce = function bindShieldForce(state, ctx) {
    const found = engine.findEntity(state, ctx.sourceUid);
    if (!found || found.zoneName !== "battle") return;
    const shields = state.players[ctx.controllerIdx].shields || [];
    if (!shields.length) return;
    state.pending = {
      type:"chooseMode",
      playerIdx:ctx.controllerIdx,
      prompt:"「シールド・フォース」で束ねるシールドを選んでください。",
      options:shields.map(function option(shield, index) {
        return { value:shield.uid, label:`${index + 1}つ目のシールド` };
      }).concat([{ value:"none", label:"選ばない" }]),
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"shieldForce", uid:ctx.sourceUid }
    };
  };

  // 出た時に1度だけ訊く。誘発として積むので、他の「出た時」と順番を取り合う。
  engine.queueShieldForce = function queueShieldForce(state, uid) {
    const found = engine.findEntity(state, uid);
    if (!found || found.zoneName !== "battle") return;
    if (!engine.hasKeyword(state, found.entity, "shieldForce")) return;
    if (found.entity.marks.shieldForceAsked) return;
    found.entity.marks.shieldForceAsked = true;
    state.triggerQueue.push({
      id:`t${state.nextUid++}`,
      effects:[{ op:"bindShieldForce" }],
      ctx:{ sourceUid:uid, controllerIdx:found.playerIdx }
    });
  };

  // 「クリーチャーの名前を1つ選ぶ。選んだ名前を持つクリーチャーの能力をすべて無視する」。
  // 名前はゲーム上のどのクリーチャー名でもよいので、候補はカードプールから作る。
  // 選んだ名前は発生源に控え、発生源がバトルゾーンにある間だけ効く。
  EFFECTS.ignoreAbilitiesOfName = function ignoreAbilitiesOfName(state, ctx, effect) {
    const found = engine.findEntity(state, ctx.sourceUid);
    if (!found) return;
    const ownName = engine.faceDef(state, found.entity).name;
    const names = [];
    (engine.RAW_CARDS || []).forEach(function collect(card) {
      const faces = card.faces || [card];
      faces.forEach(function face(item) {
        if (item.type !== "creature") return;
        if (effect.excludeSelfName && item.name === ownName) return;
        if (names.indexOf(item.name) < 0) names.push(item.name);
      });
    });
    if (!names.length) return;
    state.pending = {
      type:"chooseMode",
      playerIdx:ctx.controllerIdx,
      prompt:effect.prompt || "クリーチャーの名前を1つ選んでください。",
      options:names.map(function option(name) { return { value:name, label:name }; }),
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"ignoreName", uid:ctx.sourceUid }
    };
  };

  // 超魂レイド：出た時、山札の上から3枚を表向きにして、その中から進化元に
  // なれるカードを1枚この下に置いてもよい。残りは山札の下へ。
  EFFECTS.soulRaid = function soulRaid(state, ctx, effect) {
    if (engine.deckLookBlocked(state, ctx.controllerIdx)) return;
    const found = engine.findEntity(state, ctx.sourceUid);
    if (!found || found.zoneName !== "battle") return;
    const player = state.players[ctx.controllerIdx];
    const looked = player.deck.slice(0, effect.count == null ? 3 : effect.count);
    if (!looked.length) return;
    const lookedUids = looked.map(function uid(entity) { return entity.uid; });
    // 「このクリーチャーの進化元になれるカード」。進化条件をそのまま使う。
    const spec = engine.getDef(found.entity.defId).evolution || {};
    const legal = looked.filter(function usable(entity) {
      return engine.matchesDefinition(engine.faceDef(state, entity), spec.from || {});
    });
    if (!legal.length) { engine.mecleidRest(state, ctx.controllerIdx, lookedUids, null, "deck"); return; }
    state.pending = {
      type:"chooseMode",
      playerIdx:ctx.controllerIdx,
      prompt:effect.prompt || "このクリーチャーの下に置くカードを選んでください。",
      options:legal.map(function option(entity) {
        return { value:entity.uid, label:engine.faceDef(state, entity).name };
      }).concat([{ value:"none", label:"置かない" }]),
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"soulRaid", uid:ctx.sourceUid, controllerIdx:ctx.controllerIdx, lookedUids }
    };
  };

  // 「下にあったカードをすべて墓地から、◯◯の下に置くか、表向きの1つのシールドに
  // する」。どちらにするかを選ばせ、下に置くならその相手も選ばせる。
  EFFECTS.returnPastStack = function returnPastStack(state, ctx, effect) {
    const found = engine.findEntity(state, ctx.sourceUid);
    const uids = (found ? (found.entity.marks || {}).lastUnder : null) || [];
    const cards = uids.filter(function inGraveyard(uid) {
      const card = engine.findEntity(state, uid);
      return card && card.zoneName === "graveyard";
    });
    if (!cards.length) return;
    const hosts = (state.players[ctx.controllerIdx].battle || []).filter(function host(entity) {
      const definition = engine.faceDef(state, entity);
      return definition.evolution && definition.type === "creature";
    });
    const options = hosts.map(function option(entity) {
      return { value:`under:${entity.uid}`, label:`${engine.faceDef(state, entity).name}の下に置く` };
    }).concat([{ value:"shield", label:"表向きの1つのシールドにする" }]);
    state.pending = {
      type:"chooseMode",
      playerIdx:ctx.controllerIdx,
      prompt:effect.prompt || "下にあったカードをどうしますか？",
      options,
