      countTurnAction(state, playerIdx, "summons");
      state.paidEntryUid = (free && !paidOutside) ? null : uid;
      engine.applyEvent(state, { type:"moveZone", entityUid:uid, toPlayerIdx:playerIdx, toZone:"battle", sourceUid:uid });
      state.paidEntryUid = null;
      engine.addLog(state, `${state.players[playerIdx].name}は「${definition.name}」を出しました。`, [uid]);
    } else if (definition.type === "castle") {
      // G城は実行したら表向きでシールド化される。以降そこで能力が働く。
      found.entity.faceUp = true;
      state.turnStats = state.turnStats || {};
      engine.applyEvent(state, { type:"moveZone", entityUid:uid, toPlayerIdx:playerIdx, toZone:"shields", sourceUid:uid });
      engine.addLog(state, `${state.players[playerIdx].name}は「${definition.name}」を表向きのシールドとして置きました。`, [uid]);
    } else if (definition.type === "spell") {
      // 誘発を集めてから場所を移す。順序が逆だと、ツインパクトが墓地へ移った時点で
      // 面が外れ、呪文面の能力を見失う（誘発時に effects は複製されるので移動後も安全）。
      countTurnAction(state, playerIdx, "casts");
      state.eventLog.push({ type:"cast", sourceUid:uid, playerIdx });
      engine.collectTriggers(state, { type:"cast", sourceUid:uid, playerIdx, executedFrom:playedFrom });
      engine.addLog(state, `${state.players[playerIdx].name}は「${definition.name}」を唱えました。`, [uid]);
      // チャージャー：唱えたあと墓地ではなくマナゾーンへ置く
      // 水晶チャージャーは、マナゾーンへ「裏向きで」置く。裏向きのマナは
      // 無色1マナとしてしか使えないので、通常のチャージャーとは別物。
      const crystal = engine.hasKeyword(state, found.entity, "crystalCharger");
      let castZone = (crystal || engine.hasKeyword(state, found.entity, "charger")) ? "mana" : "graveyard";
      let toTop = false;
      // castFrom の after：「唱えた後、山札の下に置く」のように、
      // 唱えさせた側が行き先を指定している場合はそちらが優先する。
      // 「自分の墓地から呪文を唱えた時、唱えた後で、墓地のかわりに山札の下に置く」。
      // 唱えさせた側の指定（castFrom の after）があればそちらが優先。
      const after = (state.castFromAfter || {})[uid] || engine.castAfterZoneFor(state, playerIdx, playedFrom);
      if (after) {
        if (state.castFromAfter) delete state.castFromAfter[uid];
        if (after === "deckBottom") castZone = "deck";
        else if (after === "deckTop") { castZone = "deck"; toTop = true; }
        else castZone = after;
      }
      engine.applyEvent(state, { type:"moveZone", entityUid:uid, toPlayerIdx:found.entity.ownerIdx, toZone:castZone, toTop });
      if (crystal && castZone === "mana") {
        const placed = engine.findEntity(state, uid);
        if (placed && placed.zoneName === "mana") placed.entity.faceDown = true;
      }
    }
    // 「マナをタップせずにカードを出した時」に反応する能力の窓。
    // バトルゾーンに出る型は events 側で開いているので、ここは呪文と城だけ。
    // 呪文は唱えた時点で場に残らないため、移動を済ませてから最後に開く。
    if (free && !paidOutside && !entersBattle) engine.collectTriggers(state, { type:"freePlay", sourceUid:uid, playerIdx });
    // 「カードを実行した時」。種類も出所も問わず、実行の経路をすべて通す。
    // 何に反応するかは watch と condition.executedFrom で絞る。
    engine.collectTriggers(state, { type:"execute", sourceUid:uid, playerIdx, executedFrom:playedFrom });
    engine.drainQueue(state);
    return { ok:true };
  }

  function playCard(state, playerIdx, uid, options) {
    const settings = options || {};
    const found = engine.findEntity(state, uid);
    if (!found || found.playerIdx !== playerIdx) return { ok:false, error:"そのカードは使えません。" };
    // 呼び出し側が出所を決めている時（D・D・D など、通常の経路を通らないもの）は
    // それをそのまま使う。手札から使う分は従来どおり判定する。
    const source = settings.spec ? { ok:true, spec:settings.spec } : resolvePlaySource(state, playerIdx, found);
    if (!source.ok) return { ok:false, error:"そのカードは手札にありません。" };
    settings.spec = source.spec;
    const card = engine.getDef(found.entity.defId);
    if (!engine.canBeSummoned(state, found.entity, playerIdx, found.zoneName, true)) return { ok:false, error:"現在はそのカードを使えません。" };

    // ツインパクトは、どちらの面を使うか先に決める。支払える面が1つならそれを採る。
    if (card.faces && settings.face == null && !settings.free) {
      const usable = playableFaces(state, playerIdx, found.entity);
      if (!usable.length) return { ok:false, error:"どちらの面も使えません。" };
      if (usable.length === 1) settings.face = usable[0];
      else {
        state.pending = {
          type:"chooseMode",
          playerIdx,
          prompt:"どちらの面を使いますか？",
          options:usable.map(function option(index) {
            const face = card.faces[index];
            return { value:String(index), label:`${face.name}（${face.type === "spell" ? "呪文" : "クリーチャー"} コスト${face.cost}）` };
          }),
          min:1,
          max:1,
          skippable:false,
          resume:{ kind:"twinpactFace", uid, free:Boolean(settings.free), alreadyPaid:Boolean(settings.alreadyPaid) }
        };
        return { ok:true };
      }
    }
    if (card.faces && settings.face == null) settings.face = 0;
    // B・A・D：安く出すか、ターンの終わりまで残すかを選ばせる。
    // どちらも選べることがこのキーワードの中身なので、機械に決めさせない。
    // 踏み倒しではコストを払わないので訊かない。
    if (!settings.free && !settings.alreadyPaid && settings.bad == null) {
      const bad = engine.getKeywordArg(state, found.entity, "bad");
      if (bad && bad.value) {
        state.pending = {
          type:"chooseMode",
          playerIdx,
          prompt:`B・A・D ${bad.value} を使いますか？（コストが${bad.value}少なくなり、このターンの終わりに破壊されます）`,
          options:[{ value:"bad", label:`B・A・D ${bad.value} を使う` }, { value:"normal", label:"普通に召喚する" }],
          min:1,
          max:1,
          skippable:false,
          resume:{ kind:"badChoice", uid, face:settings.face }
        };
        return { ok:true };
      }
    }
    // 「このクリーチャーを［水(3)］支払って召喚してもよい」。
    // どちらで払うかに意味がある（安いほうには引き換えの能力が付く）ので、
    // 両方払える時は機械に決めさせない。
    if (!settings.free && !settings.alreadyPaid && settings.altCost == null && card.altCost) {
      const canAlt = Boolean(findPayment(state, playerIdx, found.entity, settings.face == null ? null : settings.face, null, 0, true));
      const canNormal = playableFaces(state, playerIdx, found.entity).length > 0;
      if (canAlt && canNormal) {
        state.pending = {
          type:"chooseMode",
          playerIdx,
          prompt:"どちらのコストで召喚しますか？",
          options:[
            { value:"alt", label:`［${engine.CIV_LABELS[card.altCost.civ] || card.altCost.civ}(${card.altCost.value})］で召喚する` },
            { value:"normal", label:"普通に召喚する" }
          ],
          min:1,
          max:1,
          skippable:false,
          resume:{ kind:"altCostChoice", uid, face:settings.face }
        };
        return { ok:true };
      }
      if (canAlt && !canNormal) settings.altCost = true;
    }
    if (settings.altCost) found.entity.marks.altCost = true;
    const definition = card.faces ? card.faces[settings.face] : card;
    // ギャラクシールド：普通に使うか、シールドとして置くかを選ばせる。
    // どちらも選べることがこのキーワードの中身なので、機械に決めさせない。
    if (!settings.free && !settings.alreadyPaid && settings.galaxy == null && galaxyShieldArgs(state, found.entity)) {
      const canGalaxy = canPayGalaxyShield(state, playerIdx, found.entity);
      const canNormal = playableFaces(state, playerIdx, found.entity).length > 0;
      if (canGalaxy && canNormal) {
        const args = galaxyShieldArgs(state, found.entity);
        state.pending = {
          type:"chooseMode",
          playerIdx,
          prompt:"ギャラクシールドで置きますか？（表向きの新しいシールドになります）",
          options:[
            { value:"galaxy", label:`ギャラクシールド［${engine.CIV_LABELS[args.civ] || args.civ}(${args.value})］で置く` },
            { value:"normal", label:"普通に使う" }
          ],
          min:1,
          max:1,
          skippable:false,
          resume:{ kind:"galaxyChoice", uid, face:settings.face }
        };
        return { ok:true };
      }
      if (canGalaxy && !canNormal) settings.galaxy = true;
    }
    if (settings.galaxy) return placeGalaxyShield(state, playerIdx, found.entity);
    if (definition.type === "spell" && engine.isRestricted(state, playerIdx, "restrictSpell", found.entity)) return { ok:false, error:"今は呪文を唱えられません。" };
    // 「各ターン合計N回までしか、クリーチャーを召喚したり呪文を唱えたりできない」。
    // 数えるのは召喚と呪文だけ。効果で場に出すのはここを通らないので数に入らない。
    // ハイパーエナジー：安くする引き換えに自分のクリーチャーをタップする。
    // 何体タップするかに選ぶ余地があるので機械に決めさせない。
    // 踏み倒し・支払い済みでは訊かない（軽減する対象の支払いが無い）。
    if (!settings.free && !settings.alreadyPaid && settings.hyperAsked !== true
      && engine.hasKeyword(state, found.entity, "hyperEnergy")) {
      settings.hyperAsked = true;
      if (offerHyperEnergy(state, playerIdx, found.entity, settings)) return { ok:true };
    }
    // 「そのコストのカードを実行できない」。回数の上限とは別で、1枚ごとの禁止。
    if (engine.playBlockedFor(state, playerIdx, found.entity)) return { ok:false, error:"そのカードは現在実行できません。" };
    if ((definition.type === "creature" || definition.type === "spell") && engine.reachedPlayLimit(state, playerIdx)) {
      return { ok:false, error:"このターンはもう召喚も呪文もできません。" };
    }
    if (!settings.free && !settings.alreadyPaid && !(source.spec && source.spec.effect.free) && !canPayCost(state, playerIdx, found.entity)) return { ok:false, error:"コストまたは文明条件を満たしていません。" };
    if (definition.evolution && !definition.evolution.star) {
      const bases = evolutionBases(state, playerIdx, definition);
      // 「NEO進化として召喚するなら安くなる」を使ったなら、重ねずには出せない。
      // 安くした理由が消えるので、その選択肢を出さない。
      const discountNeedsBase = !settings.free && !settings.alreadyPaid && (definition.costReduction || []).some(function entry(item) {
        return item.condition && item.condition.hasEvolutionBase === true && (item.value || 0) !== 0;
      });
      const optional = Boolean(definition.evolution.neo) && !(discountNeedsBase && bases.length);
      const needed = evolutionCount(definition);
      if (bases.length < needed && !optional) return { ok:false, error:"条件を満たす進化元がありません。" };
      if (bases.length && !settings.baseUids && (bases.length > needed || optional)) {
        state.pending = {
          type:"chooseTarget",
          playerIdx,
          prompt:optional ? "どのクリーチャーに重ねますか？" : `進化元を${needed}体選んでください。`,
          options:bases.map(function option(base) { return { value:base.uid, label:engine.faceDef(state, base).name }; })
            .concat(optional ? [{ value:"none", label:"重ねずに出す" }] : []),
          min:optional ? 1 : needed,
          max:needed,
          skippable:false,
          resume:{ kind:"playEvolution", uid, free:Boolean(settings.free), alreadyPaid:Boolean(settings.alreadyPaid), face:settings.face }
        };
        return { ok:true };
      }
      if (bases.length >= needed && !settings.baseUids) {
        settings.baseUids = bases.slice(0, needed).map(function uid(base) { return base.uid; });
      }
    }
    return finishPlay(state, playerIdx, uid, settings);
  }

  // このステップでプレイヤーが選べることが残っているかを返す。
  // false のステップはボタンを押させる意味がないので、UI 側が自動で次へ進める。
  // ルール判定そのものなのでエンジンに置く（UI に同じ判定を書くと必ずずれる）。
  function hasPhaseChoice(state, playerIdx) {
    if (!state || state.winner != null) return false;
    if (state.skipRest) return false;
    if (state.activeIdx !== playerIdx) return false;
    const player = state.players[playerIdx];

    if (state.phase === "charge") return !player.chargedThisTurn && player.hand.length > 0;

    if (state.phase === "main") {
      const fromOtherZones = ["mana", "graveyard", "shields", "deck"].some(function zone(zoneName) {
        return player[zoneName].some(function ready(entity) { return Boolean(altPlayable(state, playerIdx, entity, zoneName)); });
      });
      if (fromOtherZones) return true;
      return player.hand.some(function playable(entity) {
        const card = engine.getDef(entity.defId);
        const faces = card.faces || [card];
        return faces.some(function usableFace(face, index) {
          if (!findPayment(state, playerIdx, entity, card.faces ? index : null) && !isFreeSummon(state, playerIdx, entity)) return false;
          // 進化元がいない進化クリーチャーは、コストを払えても場に出せない。
          // NEO進化は重ねずに出せるので、この制限を受けない。
          return !face.evolution || face.evolution.star || face.evolution.neo || engine.evolutionBases(state, playerIdx, face).length > 0;
        });
      });
    }

    if (state.phase === "attack") {
      const opponent = state.players[1 - playerIdx];
      return player.battle.some(function ready(entity) {
        if (engine.canAttack(state, entity, { kind:"player" })) return true;
        return opponent.battle.some(function target(other) {
          return engine.canAttack(state, entity, { kind:"creature", uid:other.uid });
        });
      });
    }

    if (forcedAttackers(state, playerIdx).length) return true;

    // start / draw / end は宣言する内容が無く、押させても盤面は変わらない。
    return false;
  }

  // 「可能なら毎ターン攻撃する」。攻撃できるうちは攻撃ステップを抜けさせない。
  // 語彙だけあって参照されないキーワードは、書いても効かない罠になる。
  function forcedAttackers(state, playerIdx) {
    if (state.phase !== "attack") return [];
    const opponent = state.players[1 - playerIdx];
    return state.players[playerIdx].battle.filter(function forced(entity) {
      if (!engine.hasKeyword(state, entity, "mustAttack")) return false;
      if (engine.canAttack(state, entity, { kind:"player" })) return true;
      return opponent.battle.some(function target(other) {
        return engine.canAttack(state, entity, { kind:"creature", uid:other.uid });
      });
    });
  }

  function chargeMana(state, playerIdx, uid) {
    const player = state.players[playerIdx];
    const found = engine.findEntity(state, uid);
    if (state.phase !== "charge") return { ok:false, error:"現在はマナチャージステップではありません。" };
    if (player.chargedThisTurn) return { ok:false, error:"このターンはすでにマナを置いています。" };
    if (!found || found.playerIdx !== playerIdx || found.zoneName !== "hand") return { ok:false, error:"そのカードは手札にありません。" };
    // 面を選ばずに置くので、ツインパクトは合成面＝多色として扱われ、タップインになる。
    const definition = engine.faceDef(state, found.entity);
    // 単色でも「マナゾーンに置く時、このカードはタップして置く」と書かれたカードがある。
    found.entity.tapped = definition.civs.length > 1 || Boolean(definition.manaTapped);
    engine.applyEvent(state, { type:"moveZone", entityUid:uid, toPlayerIdx:playerIdx, toZone:"mana" });
    player.chargedThisTurn = true;
    engine.collectTriggers(state, { type:"manaCharge", sourceUid:uid, playerIdx });
    engine.addLog(state, `${player.name}は「${definition.name}」をマナに置きました。`, [uid]);
    engine.drainQueue(state);
    return { ok:true };
  }

  function startTurn(state) {
    const player = state.players[state.activeIdx];
    player.chargedThisTurn = false;
    state.usedTurn = {};
    state.perTurnUse = {};
    state.turnStats = { shieldsBroken:[0, 0], summons:[0, 0], plays:[0, 0], casts:[0, 0], attacks:[0, 0], freePlays:[0, 0] };
    // 期限の切れた効果を落とす。切れ目をターン開始に固定しておくと、
    // 「次の相手のターンの終わりまで」が turns:1 で素直に書ける。
    state.floatingEffects = (state.floatingEffects || []).filter(function alive(item) {
      return state.turnCount <= item.expiresTurn;
    });
    player.mana.concat(player.battle).forEach(function reset(entity) {
      // ジャストダイバーが切れるのは、コントローラーの次のターンが始まる瞬間。
      if (entity.marks.justDiver) delete entity.marks.justDiver;
      // Zラッシュの解放は「次の自分のターンのはじめまで」。
      if (entity.marks.hyper) delete entity.marks.hyper;
      if (entity.marks.freeze) delete entity.marks.freeze;
      // 封印されている間はいないものとして扱うので、アンタップもしない。
      else if (!engine.hasKeyword(state, entity, "noUntap") && !engine.isSealed(state, entity)) entity.tapped = false;
      entity.sick = false;
      entity.mods = entity.mods.filter(function permanent(mod) { return mod.duration === "permanent" || mod.duration === "untilMyNextTurn"; });
    });
    // 「次の自分のターンのはじめまで」。切れ目はカードの持ち主ではなく、
    // 効果を使った側のターンで決まる。相手のクリーチャーに貼る効果は
    // duration:"turn" では長さが合わないので、こちらで期限を見る。
    state.players.forEach(function sweep(side) {
      side.battle.concat(side.mana).forEach(function drop(entity) {
        entity.mods = entity.mods.filter(function alive(mod) {
          if (mod.duration !== "untilMyNextTurn") return true;
          return !(mod.byIdx === state.activeIdx && mod.createdTurn < state.turnCount);
        });
      });
    });
    // 「逆転撃」の後払いは、アンタップを済ませてから。使ったマナが起きる前に
    // 請求すると、払えるはずの場面で負けてしまう。
    payCounterDebts(state);
    if (state.winner != null) return;
    runTurnStartDelayedEffects(state);
    engine.collectTriggers(state, { type:"turnStart", playerIdx:state.activeIdx });
    engine.addLog(state, `${player.name}のターン ${state.turnCount}。`);
    engine.drainQueue(state);
  }

  function advancePhase(state) {
    const phases = engine.RULES.PHASES;
    const index = phases.indexOf(state.phase);
    // 「ターンの残りをとばす」。開始・終了ステップまで飛ばすと
    // ターン終了時の能力が抜けるので、終了ステップへ寄せてから通常処理に戻す。
    if (state.skipRest && state.phase !== "start" && state.phase !== "end") {
      state.phase = "end";
      return;
    }
    if (state.phase === "start") {
      startTurn(state);
      state.phase = "draw";
      if (!(state.turnCount === 1 && state.activeIdx === 0)) engine.applyEvent(state, { type:"draw", playerIdx:state.activeIdx, count:1 });
      engine.addLog(state, state.turnCount === 1 && state.activeIdx === 0 ? "先攻1ターン目のドローをスキップしました。" : `${state.players[state.activeIdx].name}はカードを1枚引きました。`);
      return;
    }
    if (state.phase === "end") {
      delete state.skipRest;
      engine.collectTriggers(state, { type:"turnEnd", playerIdx:state.activeIdx });
      engine.drainQueue(state);
      returnNinjaStrikers(state);
      engine.drainQueue(state);
      destroyBadCreatures(state);
      engine.drainQueue(state);
      runDelayedEffects(state);
      engine.drainQueue(state);
      state.activeIdx = state.extraTurns.length ? state.extraTurns.shift() : 1 - state.activeIdx;
      state.turnCount += 1;
      state.phase = "start";
      return;
    }
    state.phase = phases[index + 1];
  }

  // 「かわりにこのシールドをブレイクさせる」G城を探す。
  function breakSubstitute(state, defenderIdx) {
    return state.players[defenderIdx].shields.find(function castle(entity) {
      if (!entity.faceUp || engine.getDef(entity.defId).type !== "castle") return false;
      return (engine.getDef(entity.defId).abilities || []).some(function ability(item) {
        return item.trigger === "replacement" && item.event === "shieldBreak";
      });
    }) || null;
  }

  // ブレイクは1つずつ進む。ブレイクの前に選択が入るカード（各ブレイクの前に
  // シールドを足す、かわりに別のシールドを割らせる）があるので、
  // ループの途中で中断して再開できる形にしておく。
  function breakShields(state, attackerIdx, defenderIdx, count, attackerUid) {
    state.breaking = {
      attackerIdx,
      defenderIdx,
      attackerUid:attackerUid || null,
      remaining:count,
      broken:[],
      askedBefore:false,
      askedSubstitute:false,
      substituteUid:null
    };
    continueBreaking(state);
  }

  // ブレイクの前に働く能力（「各ブレイクの前に◯◯する」）。選択待ちになれば true。
  function offerBeforeBreak(state, job) {
    if (!job.attackerUid) return false;
    const found = engine.findEntity(state, job.attackerUid);
    if (!found || found.zoneName !== "battle") return false;
    // 他の誘発と違い、ここは collectTriggers を通らないので condition を自分で見る。
    // 見ないと「出たターンだけ」のような条件つきの能力が、常に働いてしまう。
    const abilities = engine.abilitiesOf(state, found.entity).filter(function before(item) {
      return item.trigger === "beforeBreak"
        && engine.meetsCondition(state, found.playerIdx, item.condition, found.entity);
    });
    if (!abilities.length) return false;
    abilities.forEach(function queue(item) {
      engine.queueEffects(state, item.effects || [], { sourceUid:found.entity.uid, controllerIdx:found.playerIdx });
    });
    engine.drainQueue(state);
    return Boolean(state.pending);
  }

  // 「かわりにこのシールドをブレイクさせてもよい」。守り手に選ばせる。
  function offerBreakSubstitute(state, job) {
    const substitute = breakSubstitute(state, job.defenderIdx);
    if (!substitute) return false;
    state.pending = {
      type:"chooseMode",
      playerIdx:job.defenderIdx,
      // 何のかわりなのかを言わないと選べない。「今からシールドが1つ割られる。
      // それを表向きのG城が肩代わりできる」という状況をそのまま書く。
      prompt:`シールドが1つブレイクされます。かわりに表向きの「${engine.getDef(substitute.defId).name}」をブレイクさせますか？`,
      options:[
        { value:substitute.uid, label:`「${engine.getDef(substitute.defId).name}」をブレイクさせる（伏せたシールドは残る）` },
        { value:"none", label:"伏せたシールドをブレイクさせる" }
      ],
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"breakSubstitute" }
    };
    return true;
  }

  function performBreak(state, job) {
    const defender = state.players[job.defenderIdx];
    const substitute = job.substituteUid ? defender.shields.find(function match(entity) { return entity.uid === job.substituteUid; }) : null;
    const shield = substitute || defender.shields[defender.shields.length - 1];
    if (!shield) return;
    defender.shields.splice(defender.shields.indexOf(shield), 1);
    // シールドの上に置かれていた表向きのカードは、一緒に墓地へ落ちる。
    engine.releaseCrests(state, shield);
    // Zラッシュ：シールドが1つ減ったこと自体が解放の合図。
    engine.noteShieldLeft(state, job.defenderIdx);
    // 表向きのG城は手札に加わらず、そのまま墓地へ置かれる。
    if (shield.faceUp && engine.getDef(shield.defId).type === "castle") {
      defender.graveyard.push(shield);
      engine.addLog(state, `「${engine.getDef(shield.defId).name}」がブレイクされ、墓地に置かれました。`, [shield.uid]);
      return;
    }
    // シールド焼却：手札に加わるかわりに墓地へ置く。ブレイクされたことに
    // 変わりはないので broken には積むが、手札に来ないので受け札は使えない。
    const attacker = job.attackerUid ? engine.findEntity(state, job.attackerUid) : null;
    if (attacker && attacker.zoneName === "battle" && engine.hasKeyword(state, attacker.entity, "shieldBurn")) {
      defender.graveyard.push(shield);
      job.burned = (job.burned || []).concat(shield.uid);
      engine.addLog(state, `「${engine.getDef(shield.defId).name}」がブレイクされ、墓地に置かれました。`, [shield.uid]);
      job.broken.push(shield.uid);
      return;
    }
    defender.hand.push(shield);
    job.broken.push(shield.uid);
  }

  function continueBreaking(state) {
    engine.drainQueue(state);
    if (state.pending || !state.breaking) return;
    const job = state.breaking;
    const defender = state.players[job.defenderIdx];
    while (job.remaining > 0 && defender.shields.length) {
      if (!job.askedBefore) {
        job.askedBefore = true;
        if (offerBeforeBreak(state, job)) return;
      }
      if (!job.askedSubstitute) {
        job.askedSubstitute = true;
        if (offerBreakSubstitute(state, job)) return;
      }
      performBreak(state, job);
      job.remaining -= 1;
      job.askedBefore = false;
      job.askedSubstitute = false;
      job.substituteUid = null;
    }
    finishBreaking(state);
  }

  function finishBreaking(state) {
    const job = state.breaking;
    if (!job) return;
    state.breaking = null;
    const defender = state.players[job.defenderIdx];
    const broken = job.broken.map(function find(uid) {
      const found = engine.findEntity(state, uid);
      return found ? found.entity : null;
    }).filter(Boolean);
    if (broken.length) {
      state.turnStats = state.turnStats || {};
      state.turnStats.shieldsBroken = state.turnStats.shieldsBroken || [0, 0];
      state.turnStats.shieldsBroken[job.defenderIdx] = (state.turnStats.shieldsBroken[job.defenderIdx] || 0) + broken.length;
      engine.addLog(state, `${defender.name}のシールドを${broken.length}枚ブレイクしました。`, broken.map(function uid(entity) { return entity.uid; }));
    }
    broken.forEach(function trigger(entity) { engine.collectTriggers(state, { type:"shieldBroken", sourceUid:entity.uid, playerIdx:job.defenderIdx }); });
    // 焼却されたシールドは手札に来ていないので、受け札としては使えない。
    const burned = job.burned || [];
    const inHand = broken.filter(function reachable(entity) { return burned.indexOf(entity.uid) < 0; });
    const strikeUids = inHand.filter(function gStrike(entity) { return engine.hasKeyword(state, entity, "gStrike"); }).map(function uid(entity) { return entity.uid; });
    // 「そのターン中、誰もS・トリガーを使えない」。ブレイク自体は止めないので、
    // シールドは手札に加わる。使えなくなるのは唱える／出す部分だけ。
    const stBlocked = engine.isRestricted(state, job.defenderIdx, "restrictShieldTrigger");
    // S・トリガー・プラスも、シールドから使える点はS・トリガーと同じ。
    // 上乗せの能力（P）はカード側に条件つきで書くので、ここでは区別しない。
    const triggerUids = stBlocked ? [] : inHand.filter(function st(entity) {
      return engine.hasKeyword(state, entity, "st") || engine.hasKeyword(state, entity, "stPlus");
    }).map(function uid(entity) { return entity.uid; });
    // G・ストライクやS・トリガーの選択が出れば、攻撃の終わりはその答えを待つ。
    // 待たずに終わらせると、受け札で盤面が変わる前に「攻撃の後」の能力が働いてしまう。
    const backUids = inHand.map(function uid(entity) { return entity.uid; });
    if (!offerShieldChoices(state, job.defenderIdx, strikeUids, triggerUids, backUids)) endCombat(state);
  }

  // シールドが手札に加わる時の選択を、G・ストライク → S・トリガー の順に1つずつ出す。
  // まとめて出すと解決順が決まらないので、必ず直列にする。
  function offerShieldChoices(state, defenderIdx, strikeUids, triggerUids, backUids) {
    let pendingStrikes = strikeUids || [];
    while (pendingStrikes.length) {
      const found = engine.findEntity(state, pendingStrikes[0]);
      const targets = state.players[1 - defenderIdx].battle.filter(function chooseable(entity) {
        return engine.canBeChosen(state, entity, defenderIdx);
      });
      if (!found || !targets.length) { pendingStrikes = pendingStrikes.slice(1); continue; }
      state.pending = {
        type:"chooseTarget",
        playerIdx:defenderIdx,
        prompt:`G・ストライク：このターン攻撃できなくする相手のクリーチャーを選んでください（${engine.faceDef(state, found.entity).name}）`,
        options:targets.map(function option(entity) { return { value:entity.uid, label:engine.faceDef(state, entity).name }; }).concat([{ value:"none", label:"使わない" }]),
        min:1,
        max:1,
        skippable:false,
        resume:{ kind:"gStrike", strikeUids:pendingStrikes.slice(1), triggerUids:triggerUids || [], backUids:backUids || [] }
      };
      return true;
    }

    let pendingTriggers = triggerUids || [];
    while (pendingTriggers.length) {
      const found = engine.findEntity(state, pendingTriggers[0]);
      if (!found) { pendingTriggers = pendingTriggers.slice(1); continue; }
      state.pending = {
        type:"chooseMode",
        playerIdx:defenderIdx,
        prompt:"S・トリガーを使いますか？",
        options:[{ value:"use", label:`使う：${engine.faceDef(state, found.entity).name}` }, { value:"keep", label:"使わず手札に残す" }],
        min:1,
        max:1,
        skippable:false,
        resume:{ kind:"shieldTrigger", uid:pendingTriggers[0], remaining:pendingTriggers.slice(1), backUids:backUids || [] }
      };
      return true;
    }
    return offerShieldBack(state, defenderIdx, backUids || []);
  }

  // S・バック：指定の文明のカードがシールドから手札に加わる時、そのカードを捨てて、
  // 手札にある呪文をコストを支払わずに唱えられる。
  //
  // S・トリガーと違い「捨てる札」と「唱える札」が別なので、手札側を探して組にする。
  function shieldBackPairs(state, playerIdx, shieldUids) {
    const pairs = [];
    (shieldUids || []).forEach(function eachShield(shieldUid) {
      const shield = engine.findEntity(state, shieldUid);
      if (!shield || shield.zoneName !== "hand") return;
      const shieldCivs = engine.faceDef(state, shield.entity).civs || [];
      state.players[playerIdx].hand.forEach(function eachSpell(entity) {
        if (entity.uid === shieldUid) return;
        const args = engine.getKeywordArg(state, entity, "sBack");
        if (!args || shieldCivs.indexOf(args.civ) < 0) return;
        pairs.push({ discardUid:shieldUid, spellUid:entity.uid });
      });
    });
    return pairs;
  }

  function offerShieldBack(state, playerIdx, shieldUids) {
    const pairs = shieldBackPairs(state, playerIdx, shieldUids);
    if (!pairs.length) return false;
    state.pending = {
      type:"chooseMode",
      playerIdx,
      prompt:"S・バックを使いますか？（シールドから加えたカードを捨てて唱えます）",
      options:pairs.map(function option(pair, index) {
        const spell = engine.findEntity(state, pair.spellUid);
        const discard = engine.findEntity(state, pair.discardUid);
        return {
          value:String(index),
          label:`「${engine.faceDef(state, discard.entity).name}」を捨てて「${engine.faceDef(state, spell.entity).name}」を唱える`
        };
      }).concat([{ value:"none", label:"使わない" }]),
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"shieldBack", pairs:engine.clone(pairs), shieldUids:engine.clone(shieldUids || []) }
    };
    return true;
  }

  // 攻撃の終わり。バトル・ブレイク・ダイレクトアタックのどれで終わっても必ずここを通す。
  // 終了地点が散らばったまま個別に誘発を書くと、経路を1つ足したときに漏れる。
  //
  // 攻撃したクリーチャーが場を離れていれば誘発しない（バトルで相討ちになった場合など）。
  // 勝敗が決まっていれば、その後の能力は意味がないので何もしない。
  function endCombat(state) {
    const combat = state.combat;
    state.combat = null;
    if (!combat || state.winner != null) return;
    const found = engine.findEntity(state, combat.attackerUid);
    if (!found || found.zoneName !== "battle") return;
    // 誘発の時点では state.combat をもう外しているので、
    // 「ブロックされなかったか」は攻撃したクリーチャーに控えておく。
    found.entity.marks.attackUnblocked = !combat.blocked && combat.target.kind === "player";
    engine.collectTriggers(state, { type:"afterAttack", sourceUid:combat.attackerUid, playerIdx:found.playerIdx });
    engine.drainQueue(state);
    // 「最初の攻撃の終わりにアンタップする」。印は1度だけ使い、消す。
    if (found.entity.marks.untapAfterAttack === state.turnCount) {
      delete found.entity.marks.untapAfterAttack;
      engine.applyEvent(state, { type:"untap", entityUid:found.entity.uid });
    }
  }

  function battle(state, attacker, defender) {
    const attackerPower = engine.getPower(state, attacker);
    const defenderPower = engine.getPower(state, defender);
    engine.addLog(state, `バトル：${attackerPower} 対 ${defenderPower}`, [attacker.uid, defender.uid]);
    if (attackerPower <= defenderPower || engine.hasKeyword(state, defender, "slayer")) engine.applyEvent(state, { type:"destroy", entityUid:attacker.uid });
    if (defenderPower <= attackerPower || engine.hasKeyword(state, attacker, "slayer")) engine.applyEvent(state, { type:"destroy", entityUid:defender.uid });
    // 「バトルに勝った時」。勝敗はパワーの比べ合いで決まり、同じなら勝者はいない。
    // スレイヤーで道連れにされても、勝ったのは高いほうという扱いになる。
    const winner = attackerPower > defenderPower ? attacker : (defenderPower > attackerPower ? defender : null);
    if (winner) engine.collectTriggers(state, { type:"battleWin", sourceUid:winner.uid, playerIdx:engine.controllerOf(state, winner) });
    engine.drainQueue(state);
    endCombat(state);
  }

  // ニンジャ・ストライク［N］：相手のクリーチャーが攻撃またはブロックした時、
  // 自分のマナゾーンにカードがN枚以上あり、その攻撃中にまだ使っていなければ、
  // このシノビをコストを支払わずに召喚してもよい。
  // ウラ・ニンジャ・ストライクは、マナの枚数に加えて指定文明も要る。
  // 出た後の扱い（ターンの終わりに山札の下へ）は通常のものと同じ。
  function ninjaStrikeArgs(state, entity) {
    const ura = engine.getKeywordArg(state, entity, "uraNinjaStrike");
    if (ura) return { value:ura.value, civ:ura.civ, ura:true };
    const plain = engine.getKeywordArg(state, entity, "ninjaStrike");
    return plain ? { value:plain.value, civ:null, ura:false } : null;
  }

  function ninjaStrikeCandidates(state, playerIdx) {
    return state.players[playerIdx].hand.filter(function shinobi(entity) {
      // ニンジャ・チェンジは、マナではなく入れ替える相手がいるかで決まる。
      if (engine.getKeywordArg(state, entity, "ninjaChange")) {
        return ninjaChangeBases(state, playerIdx, entity).length > 0;
      }
      const args = ninjaStrikeArgs(state, entity);
      if (!args) return false;
      if (state.players[playerIdx].mana.length < (args.value || 0)) return false;
      if (args.civ && engine.countManaOfCiv(state, playerIdx, args.civ) < 1) return false;
      return true;
    });
  }

  // 使えるのは1回の攻撃につき1度だけ。攻撃の間ずっと同じ combat を見て数える。
  function offerNinjaStrike(state, playerIdx, moment) {
    if (!state.combat || state.combat.ninjaUsed) return false;
    if ((state.combat.ninjaAsked || {})[moment]) return false;
    const candidates = ninjaStrikeCandidates(state, playerIdx);
    state.combat.ninjaAsked = Object.assign({}, state.combat.ninjaAsked || {});
    state.combat.ninjaAsked[moment] = true;
    if (!candidates.length) return false;
    state.pending = {
      type:"chooseMode",
      playerIdx,
      prompt:"「ニンジャ」の能力を使いますか？",
      options:candidates.map(function option(entity) {
        const definition = engine.faceDef(state, entity);
        const change = engine.getKeywordArg(state, entity, "ninjaChange");
        if (change) return { value:entity.uid, label:`${definition.name}（ニンジャ・チェンジ${(change.from || {}).costMin || ""}）` };
        const args = ninjaStrikeArgs(state, entity) || {};
        const label = args.ura
          ? `ウラ・ニンジャ・ストライク${args.value || 0}（${engine.CIV_LABELS[args.civ] || args.civ}）`
          : `ニンジャ・ストライク${args.value || 0}`;
        return { value:entity.uid, label:`${definition.name}（${label}）` };
      }).concat([{ value:"none", label:"使わない" }]),
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"ninjaStrike", moment }
    };
    return true;
  }

  function performNinjaStrike(state, playerIdx, uid) {
    if (state.combat) state.combat.ninjaUsed = true;
    const result = finishPlay(state, playerIdx, uid, { free:true, fromEffect:true });
    if (!result.ok) return false;
    const found = engine.findEntity(state, uid);
    // そのターンの終わりに山札の一番下へ戻る。印を付けて終了時に回収する。
    if (found && found.zoneName === "battle") found.entity.marks.ninjaStrike = true;
    return true;
  }

  // 逆転撃［文明(N)］：クリーチャーが自分を攻撃する時、その攻撃中にまだ
  // 「逆転撃」を使っていなければ、この呪文を手札からコストを支払わずに唱えてもよい。
  // そうしたら、次の自分のターンのはじめにそのコストを支払う。支払えなければ負ける。
  // ニンジャとは別の枠なので、1回の攻撃につきそれぞれ1度ずつ使える。
  function counterStrikeCandidates(state, playerIdx) {
    return state.players[playerIdx].hand.filter(function spell(entity) {
      return Boolean(engine.getKeywordArg(state, entity, "counterStrike"));
    });
  }

  function offerCounterStrike(state, playerIdx) {
    if (!state.combat || state.combat.counterUsed || state.combat.counterAsked) return false;
    state.combat.counterAsked = true;
    const candidates = counterStrikeCandidates(state, playerIdx);
    if (!candidates.length) return false;
    state.pending = {
      type:"chooseMode",
      playerIdx,
      prompt:"「逆転撃」を使いますか？（次の自分のターンのはじめに支払えなければ負けます）",
      options:candidates.map(function option(entity) {
        const args = engine.getKeywordArg(state, entity, "counterStrike") || {};
        const civ = engine.CIV_LABELS[args.civ] || args.civ || "";
        return { value:entity.uid, label:`${engine.faceDef(state, entity).name}（逆転撃［${civ}(${args.value || 0})］）` };
      }).concat([{ value:"none", label:"使わない" }]),
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"counterStrike" }
    };
    return true;
  }

  function performCounterStrike(state, playerIdx, uid) {
    const found = engine.findEntity(state, uid);
    if (!found) return false;
    const args = engine.getKeywordArg(state, found.entity, "counterStrike") || {};
    if (state.combat) state.combat.counterUsed = true;
    const result = finishPlay(state, playerIdx, uid, { free:true, fromEffect:true });
    if (!result.ok) return false;
    // 後払いの約束は、カードが墓地へ行っても残る。プレイヤーに紐づけて控える。
    state.counterDebts = (state.counterDebts || []).concat([{
      playerIdx, value:args.value || 0, civ:args.civ || null, createdTurn:state.turnCount
    }]);
    engine.addLog(state, `${state.players[playerIdx].name}は「逆転撃」を使いました。次の自分のターンのはじめに支払えなければ敗北します。`, [uid]);
    return true;
  }

  // 指定のコストと文明ぶんのマナを探す。カードのコストではなく数値で払うので、
  // findPayment とは別に持つ（呼び出し側に実体が無い）。
  function findManaFor(state, playerIdx, cost, civ, excludeUid) {
    const mana = availableMana(state.players[playerIdx]).filter(function other(card) { return card.uid !== excludeUid; });
    if (mana.length < cost) return null;
    const selected = [];
    // 「D・D・D［光/水/自然(5)］」。多色のコストは、並べた文明ぶん
    // 別々のマナを1枚ずつ要求する。1枚で2文明を兼ねることはできない。
    const civs = civ == null ? [] : [].concat(civ);
    for (let index = 0; index < civs.length; index += 1) {
      const match = mana.find(function candidate(card) {
        return selected.indexOf(card) < 0 && engine.faceDef(state, card).civs.indexOf(civs[index]) >= 0;
      });
      if (!match) return null;
      selected.push(match);
    }
    mana.forEach(function fill(card) { if (selected.length < cost && selected.indexOf(card) < 0) selected.push(card); });
    return selected.length >= cost ? selected.slice(0, cost) : null;
  }

  // 「次の自分のターンのはじめに支払う。支払えなければ、自分はゲームに負ける」。
  // 選ぶ余地のない支払いなので訊かず、足りなければその場で敗北にする。
  function payCounterDebts(state) {
    const debts = state.counterDebts || [];
    if (!debts.length) return;
    const due = debts.filter(function ready(item) { return item.playerIdx === state.activeIdx && item.createdTurn < state.turnCount; });
    if (!due.length) return;
    state.counterDebts = debts.filter(function keep(item) { return due.indexOf(item) < 0; });
    due.forEach(function settle(item) {
      if (state.winner != null) return;
      const payment = findManaFor(state, item.playerIdx, item.value, item.civ);
      if (!payment) {
        engine.addLog(state, `${state.players[item.playerIdx].name}は「逆転撃」の支払いができませんでした。`);
        engine.applyEvent(state, { type:"loseGame", playerIdx:item.playerIdx, reason:"「逆転撃」の支払いができなかった" });
        return;
      }
      payment.forEach(function tapMana(mana) { engine.applyEvent(state, { type:"tap", entityUid:mana.uid }); });
      engine.addLog(state, `${state.players[item.playerIdx].name}は「逆転撃」のコストを支払いました。`);
    });
  }

  // D・D・D［文明(N)］：自分のクリーチャーが攻撃する時、そのコストを支払って
  // このカードを手札から実行してもよい。支払ってはいるので踏み倒しではない。
  function dddArgs(state, entity) {
    return engine.getKeywordArg(state, entity, "dDD") || null;
  }

  // D・D・D のコスト条件。civs（多色）と civ（単色）のどちらの書き方も受ける。
  function dddCivs(args) { return args.civs || args.civ || null; }

  function offerDDD(state, playerIdx) {
    if (!state.combat || state.combat.dddAsked) return false;
    state.combat.dddAsked = true;
    // 「この呪文の『D・D・D』をマナゾーンから使ってもよい」。
    // 出所はカードごとに違うので、手札とマナの両方を見て args.zone で絞る。
    const player = state.players[playerIdx];
    const candidates = player.hand.concat(player.mana).filter(function usable(entity) {
      const args = dddArgs(state, entity);
      if (!args) return false;
      const zone = args.zone || "hand";
      if (player[zone].indexOf(entity) < 0) return false;
      return Boolean(findManaFor(state, playerIdx, args.value || 0, dddCivs(args), entity.uid));
    });
    if (!candidates.length) return false;
    state.pending = {
      type:"chooseMode",
      playerIdx,
      prompt:"「D・D・D」を使いますか？",
      options:candidates.map(function option(entity) {
        const args = dddArgs(state, entity) || {};
        const civLabel = [].concat(dddCivs(args) || []).map(function label(civ) { return engine.CIV_LABELS[civ] || civ; }).join("/");
        return { value:entity.uid, label:`${engine.faceDef(state, entity).name}（D・D・D［${civLabel}(${args.value})］）` };
      }).concat([{ value:"none", label:"使わない" }]),
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"ddd" }
    };
    return true;
  }

  // アタック・チャンス：条件に合う自分のクリーチャーが攻撃する時、手札から
  // コストを支払わずに実行してもよい。D・D・D と違い支払いが無いので踏み倒し。
  function offerAttackChance(state, playerIdx) {
    if (!state.combat || state.combat.attackChanceAsked) return false;
    const attackerFound = engine.findEntity(state, state.combat.attackerUid);
    if (!attackerFound) return false;
    state.combat.attackChanceAsked = true;
    const candidates = state.players[playerIdx].hand.filter(function usable(entity) {
      const args = engine.getKeywordArg(state, entity, "attackChance");
      if (!args) return false;
      return engine.matchesFilter(state, attackerFound.entity, args.filter || {}, playerIdx, entity.uid);
    });
    if (!candidates.length) return false;
    state.pending = {
      type:"chooseMode",
      playerIdx,
      prompt:"「アタック・チャンス」を使いますか？",
      options:candidates.map(function option(entity) {
        return { value:entity.uid, label:engine.faceDef(state, entity).name };
      }).concat([{ value:"none", label:"使わない" }]),
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"attackChance" }
    };
    return true;
  }

  function performDDD(state, playerIdx, uid) {
    const found = engine.findEntity(state, uid);
    if (!found) return false;
    const args = dddArgs(state, found.entity);
    const payment = args ? findManaFor(state, playerIdx, args.value || 0, dddCivs(args), uid) : null;
    if (!payment) return false;
    payment.forEach(function tapMana(mana) { engine.applyEvent(state, { type:"tap", entityUid:mana.uid }); });
    // 「この呪文を『D・D・D』で唱えたなら」。どう使われたかは、使った後では
    // 手がかりが残らないので、実行する前に印を立てる。
    found.entity.marks.viaDDD = true;
    // 攻撃中の窓から使うので、「メインステップに手札から」の通常経路は通らない。
    // 手札以外から使うカードは、出所をこちらで決めて渡す。
    const zone = (args.zone || "hand");
    const spec = zone === "hand" ? null : { effect:{ zone }, sourceUid:uid, self:true };
    return playCard(state, playerIdx, uid, { alreadyPaid:true, spec }).ok;
  }

  // 窓を閉じたら、止めていた続きへ戻る。攻撃宣言の窓ならブロックの選択へ、
  // ブロック宣言の窓ならバトルへ。ニンジャ・ストライクとニンジャ・チェンジで
  // 同じ戻り方をするので、1か所にまとめる。
  function closeNinjaWindow(state, moment) {
    if (moment === "block" && state.combat) {
      const blockerUid = state.combat.pendingBlockerUid;
      state.combat.pendingBlockerUid = null;
      const attackerFound = engine.findEntity(state, state.combat.attackerUid);
      const blockerFound = blockerUid ? engine.findEntity(state, blockerUid) : null;
      if (attackerFound && blockerFound) battle(state, attackerFound.entity, blockerFound.entity);
      else state.combat = null;
    } else {
      if (state.combat) state.combat.stage = "declared";
      continueAttack(state);
    }
  }

  // ニンジャ・チェンジ：手札のこれと、条件に合う自分のクリーチャー1体を入れ替える。
  // 入れ替える相手を選ばせる必要があるので、窓の中でもう一度訊く。
  function ninjaChangeBases(state, playerIdx, entity) {
    const args = engine.getKeywordArg(state, entity, "ninjaChange");
    if (!args) return [];
    return state.players[playerIdx].battle.filter(function base(candidate) {
      return engine.matchesFilter(state, candidate, args.from || {}, playerIdx, entity.uid);
    });
  }

  function offerNinjaChangeTarget(state, playerIdx, uid, moment) {
    const found = engine.findEntity(state, uid);
    if (!found || !engine.getKeywordArg(state, found.entity, "ninjaChange")) return false;
    const bases = ninjaChangeBases(state, playerIdx, found.entity);
    if (!bases.length) return false;
    state.pending = {
      type:"chooseTarget",
      playerIdx,
      prompt:"どのクリーチャーと入れ替えますか？",
      options:bases.map(function option(base) { return { value:base.uid, label:engine.faceDef(state, base).name }; })
        .concat([{ value:"none", label:"入れ替えない" }]),
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"ninjaChangeTarget", uid, moment }
    };
    return true;
  }

  function performNinjaChange(state, playerIdx, uid, baseUid) {
    const base = engine.findEntity(state, baseUid);
    if (!base || base.zoneName !== "battle") return false;
    if (state.combat) state.combat.ninjaUsed = true;
    // 先に場のクリーチャーを手札へ戻してから出す。順番を逆にすると、
    // 場の上限や「出た時」の能力が入れ替え前の盤面を見てしまう。
    engine.applyEvent(state, { type:"moveZone", entityUid:baseUid, toPlayerIdx:playerIdx, toZone:"hand" });
    const result = finishPlay(state, playerIdx, uid, { free:true, fromEffect:true });
    return result.ok;
  }

  // ターンの終わりに、そのターン ニンジャ・ストライクで出たシノビを山札の一番下へ。
  function returnNinjaStrikers(state) {
    state.players.forEach(function eachPlayer(player, playerIdx) {
      player.battle.slice().forEach(function shinobi(entity) {
        if (!entity.marks.ninjaStrike) return;
        delete entity.marks.ninjaStrike;
        engine.applyEvent(state, { type:"moveZone", entityUid:entity.uid, toPlayerIdx:playerIdx, toZone:"deck" });
      });
    });
  }

  // 予約しておいた「そのターンの終わりに〜」を走らせる。
  // 走らせた分は消す（1度きりの予約なので、翌ターンに持ち越さない）。
  function runDelayedEffects(state) {
    const due = (state.delayedEffects || []).filter(function ready(item) { return (item.at || "turnEnd") === "turnEnd" && state.turnCount >= item.runOnTurn; });
    state.delayedEffects = (state.delayedEffects || []).filter(function pending(item) { return due.indexOf(item) < 0; });
    due.forEach(function run(item) {
      engine.queueEffects(state, item.effects, { controllerIdx:item.controllerIdx, sourceUid:item.sourceUid });
    });
  }

  // 「次の自分のターンのはじめに〜」。予約した人のターンが始まった時に1度だけ走る。
  // 予約したターン自身では走らせない（予約と同じターンの開始はもう過ぎている）。
  function runTurnStartDelayedEffects(state) {
    const due = (state.delayedEffects || []).filter(function ready(item) {
      return item.at === "myTurnStart" && item.controllerIdx === state.activeIdx && item.createdTurn < state.turnCount;
    });
    if (!due.length) return;
    state.delayedEffects = (state.delayedEffects || []).filter(function pending(item) { return due.indexOf(item) < 0; });
    due.forEach(function run(item) {
      engine.queueEffects(state, item.effects, { controllerIdx:item.controllerIdx, sourceUid:item.sourceUid });
    });
  }

  // B・A・D で安く出したクリーチャーを、そのターンの終わりに破壊する。
  // 印はカードごとに立っているので、誰のターンかは問わない
  // （相手のターンに踏み倒しで出た場合も、出したターンの終わりに壊れる）。
  function destroyBadCreatures(state) {
    state.players.forEach(function eachPlayer(player) {
      player.battle.slice().forEach(function summoned(entity) {
        if (!entity.marks.badChosen) return;
        delete entity.marks.badChosen;
        engine.applyEvent(state, { type:"destroy", entityUid:entity.uid });
      });
    });
  }

  function resolveCombat(state, blockerUid) {
    if (!state.combat) return;
    // ここから先は宣言段階に戻らない。S・トリガーなどで選択待ちを挟んでも
    // continueAttack が再入して二重に解決しないよう、段階を進めておく。
    state.combat.stage = "resolving";
    const attackerFound = engine.findEntity(state, state.combat.attackerUid);
    if (!attackerFound) { state.combat = null; return; }
    const attacker = attackerFound.entity;
    if (blockerUid) {
      const blockerFound = engine.findEntity(state, blockerUid);
      if (blockerFound && engine.canBlock(state, blockerFound.entity)) {
        engine.applyEvent(state, { type:"tap", entityUid:blockerFound.entity.uid });
        // 「相手のクリーチャーがブロックした時」も窓が開く。攻めている側が使う。
        state.combat.pendingBlockerUid = blockerUid;
        if (offerNinjaStrike(state, attackerFound.playerIdx, "block")) return;
        state.combat.pendingBlockerUid = null;
        // 「攻撃してブロックされなかった時」の判定に使う。
        state.combat.blocked = true;
        battle(state, attacker, blockerFound.entity);
        return;
      }
    }
    if (state.combat.target.kind === "creature") {
      const targetFound = engine.findEntity(state, state.combat.target.uid);
      if (targetFound) battle(state, attacker, targetFound.entity);
      else endCombat(state);
      return;
    }
    const defenderIdx = state.combat.defenderIdx;
    if (state.players[defenderIdx].shields.length === 0) {
      if (!engine.cannotLose(state, defenderIdx, "attack")) {
        state.winner = attackerFound.playerIdx;
        state.reason = "ダイレクトアタック";
      } else engine.addLog(state, "ダイレクトアタックを受けましたが、敗北しませんでした。");
      endCombat(state);
      return;
    }
    let count = 1;
    if (engine.hasKeyword(state, attacker, "qb")) count = 4;
    else if (engine.hasKeyword(state, attacker, "tb")) count = 3;
    else if (engine.hasKeyword(state, attacker, "wb")) count = 2;
    // パワード・ブレイカー：そのパワー6000ごとにシールドをさらに1つブレイクする。
    // 他のブレイカーと重なった場合は多いほうを使う。
    if (engine.hasKeyword(state, attacker, "poweredBreaker")) {
      count = Math.max(count, Math.floor(engine.getPower(state, attacker) / 6000) + 1);
    }
    // ブレイクは選択待ちで中断しうるので、ここでは終わらせない。
    // 全部ブレイクし終えた finishBreaking から endCombat を呼ぶ。
    breakShields(state, attackerFound.playerIdx, defenderIdx, count, attacker.uid);
  }

  // 手札のカードが持つ革命チェンジ／侵略を読む。ツインパクトは面を選ぶ前なので
  // 合成面にはキーワードが無く、クリーチャー面を直接見ないと見落とす。
  function swapSpecOf(state, entity) {
    const card = engine.getDef(entity.defId);
    const faces = card.faces ? card.faces : [card];
    for (let index = 0; index < faces.length; index += 1) {
      const face = faces[index];
      if (face.type !== "creature") continue;
      const keywords = face.keywords || [];
      const kind = keywords.indexOf("revolutionChange") >= 0 ? "revolutionChange"
        : (keywords.indexOf("invasion") >= 0 ? "invasion" : null);
      if (kind) return { kind, spec:(face.keywordArgs || {})[kind] || {}, faceIndex:card.faces ? index : null, def:face };
    }
    return null;
  }

  // 革命チェンジ・侵略の候補（攻撃しているクリーチャーが条件を満たす手札のカード）。
  function attackSwapCandidates(state, playerIdx, attacker) {
    return state.players[playerIdx].hand.filter(function candidate(entity) {
      const swap = swapSpecOf(state, entity);
      if (!swap) return false;
      // 「パワー8000以上のクリーチャー」のような条件があるので、定義ではなく実体で見る。
      return engine.matchesFilter(state, attacker, swap.spec.from || {}, playerIdx, entity.uid);
    });
  }

  function offerAttackSwap(state, playerIdx, attacker) {
    const candidates = attackSwapCandidates(state, playerIdx, attacker);
    if (!candidates.length) return false;
    state.pending = {
      type:"chooseMode",
      playerIdx,
      prompt:"革命チェンジ／侵略を使いますか？",
      options:candidates.map(function option(entity) {
        const swap = swapSpecOf(state, entity);
        return { value:entity.uid, label:`${swap.kind === "invasion" ? "侵略" : "革命チェンジ"}：${swap.def.name}` };
      }).concat([{ value:"none", label:"使わない" }]),
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"attackSwap" }
    };
    return true;
  }

  function performAttackSwap(state, playerIdx, handUid) {
    if (!state.combat) return false;
    const attackerFound = engine.findEntity(state, state.combat.attackerUid);
    const handFound = engine.findEntity(state, handUid);
    if (!attackerFound || attackerFound.zoneName !== "battle") return false;
    if (!handFound || handFound.zoneName !== "hand") return false;
    const entity = handFound.entity;
    const swap = swapSpecOf(state, entity);
    if (!swap) return false;
    // ツインパクトはここでクリーチャー面に確定させる。以降 faceDef() がその面を返す。
    if (swap.faceIndex != null) entity.face = swap.faceIndex;
    const definition = engine.faceDef(state, entity);
    const invading = swap.kind === "invasion";

    // 「革命チェンジで出た時」を判定できるよう、移動より先に出方を記録する。
    entity.marks.enteredBy = invading ? "invasion" : "revolutionChange";
    countTurnAction(state, playerIdx, "freePlays");
    if (invading) {
      // 侵略：攻撃中のクリーチャーの上に重ねる。タップ状態と攻撃をそのまま引き継ぐ。
      const base = attackerFound.entity;
      state.players[playerIdx].battle.splice(attackerFound.index, 1);
      entity.under = [base].concat(base.under.splice(0));
      entity.tapped = true;
      entity.sick = false;
      engine.applyEvent(state, { type:"moveZone", entityUid:entity.uid, toPlayerIdx:playerIdx, toZone:"battle", sourceUid:entity.uid });
    } else {
      // 革命チェンジ：入れ替わって出る。召喚酔いは受けるので、引き継いだ攻撃だけ続けられる。
      entity.tapped = true;
      entity.sick = true;
      engine.applyEvent(state, { type:"moveZone", entityUid:entity.uid, toPlayerIdx:playerIdx, toZone:"battle", sourceUid:entity.uid });
      engine.applyEvent(state, { type:"moveZone", entityUid:attackerFound.entity.uid, toPlayerIdx:attackerFound.entity.ownerIdx, toZone:"hand" });
    }

    state.combat.attackerUid = entity.uid;
    engine.addLog(state, `${state.players[playerIdx].name}は「${definition.name}」に入れ替わりました。`, [entity.uid]);
    return true;
  }

  // 攻撃宣言後の続き。誘発の選択待ちを挟んでも同じ場所から再開できるよう関数にする。
  function continueAttack(state) {
    engine.drainQueue(state);
    if (state.pending || !state.combat || state.combat.stage !== "declared") return;
    const attackerFound = engine.findEntity(state, state.combat.attackerUid);
    if (!attackerFound || attackerFound.zoneName !== "battle") { state.combat = null; return; }
    const playerIdx = attackerFound.playerIdx;
    // 「相手のクリーチャーが攻撃した時」の窓。出したシノビがブロックに間に合うよう、
    // ブロックを選ばせる前に開く。
    // 「自分のクリーチャーが攻撃する時」。攻める側の窓なので、守る側より先に開く。
    if (offerDDD(state, playerIdx)) return;
    if (offerAttackChance(state, playerIdx)) return;
    if (offerNinjaStrike(state, 1 - playerIdx, "attack")) return;
    // 「クリーチャーが自分を攻撃する時」の窓。ニンジャとは別の枠なので続けて開く。
    if (offerCounterStrike(state, 1 - playerIdx)) return;
    // ガードマン：自分の他のクリーチャーへの攻撃を、タップして引き受ける。
    // ブロックより先に開く（引き受けてからブロックを選ぶ余地を残すため）。
    if (offerGuardman(state, 1 - playerIdx)) return;
    const blockers = state.players[1 - playerIdx].battle.filter(function blocker(entity) { return engine.canBlock(state, entity); });
    if (blockers.length && !engine.hasKeyword(state, attackerFound.entity, "guard")) {
      state.combat.stage = "blocking";
      state.pending = {
        type:"chooseMode",
        playerIdx:1 - playerIdx,
        prompt:"ブロックするクリーチャーを選んでください。",
        options:blockers.map(function option(entity) { return { value:entity.uid, label:engine.faceDef(state, entity).name }; }).concat([{ value:"none", label:"ブロックしない" }]),
        min:1,
        max:1,
        skippable:false,
        resume:{ kind:"block" }
      };
    } else resolveCombat(state, null);
  }

  // ガードマン：攻撃先がクリーチャーの時だけ開く窓。ブロックとは別物で、
  // 攻撃先そのものを変えるので、ブロックされない相手にも効く。
  function offerGuardman(state, defenderIdx) {
    if (!state.combat || state.combat.guardmanAsked) return false;
    const target = state.combat.target;
    if (!target || target.kind !== "creature") return false;
    state.combat.guardmanAsked = true;
    const candidates = state.players[defenderIdx].battle.filter(function usable(entity) {
      if (entity.tapped || entity.uid === target.uid) return false;
      if (engine.faceDef(state, entity).type !== "creature") return false;
      if (engine.isSealed(state, entity)) return false;
      return engine.hasKeyword(state, entity, "guardman");
    });
    if (!candidates.length) return false;
    state.pending = {
      type:"chooseMode",
      playerIdx:defenderIdx,
      prompt:"ガードマン：攻撃先を引き受けますか？",
      options:candidates.map(function option(entity) {
        return { value:entity.uid, label:engine.faceDef(state, entity).name };
      }).concat([{ value:"none", label:"引き受けない" }]),
      min:1,
      max:1,
      skippable:false,
      resume:{ kind:"guardman" }
    };
    return true;
  }

  function declareAttack(state, playerIdx, action) {
    const found = engine.findEntity(state, action.attackerUid);
    if (!found || found.playerIdx !== playerIdx || !engine.canAttack(state, found.entity, action.target)) return { ok:false, error:"その攻撃は宣言できません。" };
    // 攻撃のタップも「タップした時」を誘発させる。ここだけ直接倒していたため、
    // 攻撃で倒れたぶんが誘発から漏れていた。
    engine.applyEvent(state, { type:"tap", entityUid:found.entity.uid });
    // 「最初の攻撃」を数えるための印。攻撃の回数は今までプレイヤー単位でしか
    // 数えておらず、クリーチャー1体ごとの初回が分からなかった。
    found.entity.marks.attackedTurn = state.turnCount;
    countTurnAction(state, playerIdx, "attacks");
    state.combat = { attackerUid:found.entity.uid, defenderIdx:1 - playerIdx, target:engine.clone(action.target), stage:"declared" };
    engine.addLog(state, `${state.players[playerIdx].name}の「${engine.faceDef(state, found.entity).name}」が攻撃しました。`, [found.entity.uid]);
    // 攻撃した時の能力は「宣言したクリーチャー」のものなので、入れ替えより先に積む。
    engine.collectTriggers(state, { type:"attack", sourceUid:found.entity.uid, playerIdx });
    // 「攻撃された時」。守る側の窓で、攻撃先がクリーチャーならその1体、
    // プレイヤーなら守る側のカードが見る。以前は語彙だけあって誰も誘発させて
    // おらず、カードに書いても効かなかった。
    engine.collectTriggers(state, {
      type:"attacked",
      entityUid:action.target && action.target.kind === "creature" ? action.target.uid : null,
      playerIdx:1 - playerIdx,
      attackedTarget:action.target ? action.target.kind : "player"
    });
    // スマッシュ・バースト：攻撃する時、呪文側を唱えるかどうかを訊く。
    // 誘発として積むので、攻撃時の他の能力と順番を取り合わない。
    queueSmashBurst(state, found.entity.uid);
    if (offerAttackSwap(state, playerIdx, found.entity)) return { ok:true };
    continueAttack(state);
    return { ok:true };
  }

  // 代わりのコストを支払って、表向きの新しいシールドとして置く。
  // 表向きでシールドゾーンにある間も能力が働くので、その目印を残す。
  function placeGalaxyShield(state, playerIdx, entity) {
    const args = galaxyShieldArgs(state, entity);
    const payment = args ? findManaFor(state, playerIdx, args.value || 0, args.civ || null, entity.uid) : null;
    if (!payment) return { ok:false, error:"ギャラクシールドのコストを支払えません。" };
    payment.forEach(function tapMana(mana) { engine.applyEvent(state, { type:"tap", entityUid:mana.uid }); });
    entity.faceUp = true;
    entity.marks.galaxyShield = true;
    engine.applyEvent(state, { type:"moveZone", entityUid:entity.uid, toPlayerIdx:playerIdx, toZone:"shields", sourceUid:entity.uid });
    engine.addLog(state, `${state.players[playerIdx].name}は「${engine.faceDef(state, entity).name}」をギャラクシールドで置きました。`, [entity.uid]);
    engine.drainQueue(state);
    return { ok:true };
  }

  function resolvePending(state, answer, playerIdx) {
    const pending = state.pending;
    if (!pending || pending.playerIdx !== playerIdx) return { ok:false, error:"あなたの選択待ちではありません。" };
    const values = Array.isArray(answer) ? answer : [answer];
    const allowed = (pending.options || []).map(function value(option) { return typeof option === "object" ? option.value : option; });
    if (values.some(function invalid(value) { return allowed.indexOf(value) < 0; })) return { ok:false, error:"選択肢にない回答です。" };
    // 「2つ選ぶ」に1つだけ答えられると、黙って半分しか起きない。
    // 数の約束はここで守らせる（UI・CPU・通信のどこから来ても同じ）。
    if (pending.min != null && values.length < pending.min) return { ok:false, error:"選ぶ数が足りません。" };
    if (pending.max != null && values.length > pending.max) return { ok:false, error:"選べる数を超えています。" };
    // 同じものを2回選べるのは、そう書かれた問いかけだけ。
    if (!pending.allowRepeat && values.length !== new Set(values).size) return { ok:false, error:"同じものは選べません。" };
    state.pending = null;
    const resume = pending.resume || {};
    if (resume.kind === "effectTarget") {
      resume.item.effect._targets = values.filter(Boolean);
      // 自動で決めた場合と同じく「直前に選んだもの」を更新する。
      // ここを書き忘れると、「そのコスト以下」が前の選択を見てしまう。
      state.lastTargets = resume.item.effect._targets.slice();
      state.effectQueue.unshift(resume.item);
      engine.drainQueue(state);
    } else if (resume.kind === "ninjaStrike") {
      // ニンジャ・チェンジは「どれと入れ替えるか」をもう一度訊く。
      // 答えが返るまで窓は閉じない（閉じると攻撃が先に進んでしまう）。
      if (values[0] !== "none" && offerNinjaChangeTarget(state, playerIdx, values[0], resume.moment)) return { ok:true };
      if (values[0] !== "none") performNinjaStrike(state, playerIdx, values[0]);
      closeNinjaWindow(state, resume.moment);
    } else if (resume.kind === "attackChance") {
      if (values[0] !== "none") playCard(state, playerIdx, values[0], { free:true });
      if (!state.pending) continueAttack(state);
    } else if (resume.kind === "altCostChoice") {
      const chosen = engine.findEntity(state, resume.uid);
      // 印は支払いの前に立てる。findPayment がこれを見て別のコストで数える。
      if (chosen && values[0] === "alt") chosen.entity.marks.altCost = true;

    } else if (resume.kind === "smashBurst") {

  // ここで直接 pending を立てると、解決中の別の選択を上書きしてしまう。
  function queueSmashBurst(state, uid) {
    const found = uid ? engine.findEntity(state, uid) : null;
    if (!found || found.zoneName !== "battle") return;
    if (!engine.hasKeyword(state, found.entity, "smashBurst")) return;
    const definition = engine.getDef(found.entity.defId);
    if (!definition.faces || !definition.faces[1]) return;
    state.triggerQueue.push({
      id:`t${state.nextUid++}`,
      effects:[{ op:"smashBurst" }],
      ctx:{ sourceUid:uid, controllerIdx:found.playerIdx }
    });
  }

  engine.queueMegaLastBurst = function queueMegaLastBurst(state, uid) {
    const found = uid ? engine.findEntity(state, uid) : null;
    if (!found || ["hand", "mana", "graveyard"].indexOf(found.zoneName) < 0) return;
    const definition = engine.getDef(found.entity.defId);
    const creatureFace = definition.faces ? definition.faces[0] : definition;
    if ((creatureFace.keywords || []).indexOf("megaLastBurst") < 0) return;
    state.triggerQueue.push({
      id:`t${state.nextUid++}`,
      effects:[{ op:"megaLastBurst" }],
      ctx:{ sourceUid:uid, controllerIdx:found.playerIdx }

    if (!engine.hasKeyword(state, found.entity, "yobinion")) return;
    state.triggerQueue.push({
      id:`t${state.nextUid++}`,
      effects:[{ op:"yobinion" }],
      ctx:{ sourceUid:uid, controllerIdx:found.playerIdx }
    });

        return engine.canPayCost(state, playerIdx, entity) && (!definition.evolution || definition.evolution.star || engine.evolutionBases(state, playerIdx, definition).length);
      }).sort(function strongest(a, b) { return engine.getCost(state, b, playerIdx) - engine.getCost(state, a, playerIdx); });
      if (playable.length) return { type:"PLAY_CARD", uid:playable[0].uid };
      return { type:"ADVANCE_PHASE" };
    }
    if (state.phase === "attack") {
      const attacker = player.battle.find(function ready(entity) { return engine.canAttack(state, entity, { kind:"player" }); });
      if (attacker) {
        const target = state.players[1 - playerIdx].battle.filter(function tapped(entity) { return entity.tapped; }).sort(function weakest(a, b) { return engine.getPower(state, a) - engine.getPower(state, b); })[0];
        return { type:"DECLARE_ATTACK", attackerUid:attacker.uid, target:target ? { kind:"creature", uid:target.uid } : { kind:"player" } };
      }
      // プレイヤーを狙えなくても、クリーチャーには攻撃できることがある。
      // ここを見ないと、攻撃を強制されたクリーチャーがいる時に進めなくなる。
      const opponentBattle = state.players[1 - playerIdx].battle;
      for (const entity of player.battle) {
        const victim = opponentBattle.find(function reachable(other) { return engine.canAttack(state, entity, { kind:"creature", uid:other.uid }); });
        if (victim) return { type:"DECLARE_ATTACK", attackerUid:entity.uid, target:{ kind:"creature", uid:victim.uid } };
      }
      return { type:"ADVANCE_PHASE" };
    }
    return { type:"ADVANCE_PHASE" };
  }

  function runCpuGame(seed, maxActions) {
    const state = engine.createGame({ seed, names:["CPU A","CPU B"] });
    let count = 0;
    while (state.winner == null && count < (maxActions || 1000)) {
      const actor = state.pending ? state.pending.playerIdx : state.activeIdx;
      const action = chooseCpuAction(state, actor);
      if (!action) break;
      const result = engine.applyAction(state, action, actor);
      if (!result.ok) throw new Error(result.error);
      count += 1;
    }
    return { state, actions:count };
  }

  engine.chooseCpuAction = chooseCpuAction;
  engine.runCpuGame = runCpuGame;
}(globalThis));

(function defineBackend(global) {
  const game = global.DMGame;
  const config = game.net.config;

  const IDENTITY_ORIGIN = "https://identitytoolkit.googleapis.com/v1/accounts";
  const TOKEN_ORIGIN = "https://securetoken.googleapis.com/v1/token";

  // Firebase が返す英大文字のエラーコードをそのまま出すと利用者に伝わらないため、
  // 画面に出す文言はここで一括して日本語へ寄せる。未知のコードは原文を残す。
  const MESSAGES = {
    EMAIL_EXISTS: "このメールアドレスは既に登録されています。ログインしてください。",
    EMAIL_NOT_FOUND: "メールアドレスかパスワードが違います。",
    INVALID_PASSWORD: "メールアドレスかパスワードが違います。",
    INVALID_LOGIN_CREDENTIALS: "メールアドレスかパスワードが違います。",
    INVALID_EMAIL: "メールアドレスの形式が正しくありません。",
    MISSING_PASSWORD: "パスワードを入力してください。",
    WEAK_PASSWORD: "パスワードは6文字以上にしてください。",
    USER_DISABLED: "このアカウントは無効化されています。",
    TOO_MANY_ATTEMPTS_TRY_LATER: "試行回数が多すぎます。しばらく待ってからやり直してください。",
    OPERATION_NOT_ALLOWED: "メール／パスワード認証が有効になっていません。SETUP.md を確認してください。",
    CONFIGURATION_NOT_FOUND: "このプロジェクトで認証が有効化されていません。SETUP.md の「メール/パスワード認証を有効にする」を先に済ませてください。",
    TOKEN_EXPIRED: "ログインの有効期限が切れました。もう一度ログインしてください。",
    USER_NOT_FOUND: "ログインの有効期限が切れました。もう一度ログインしてください。"
  };

  function isConfigured() {
    return Boolean(config.apiKey && config.databaseURL);
  }

  function translate(rawMessage) {
    const code = String(rawMessage || "").split(" : ")[0].trim();
    return MESSAGES[code] || `通信エラー：${rawMessage}`;
  }

  function requireConfig() {
    if (!isConfigured()) throw new Error("バックエンドが未設定です。SETUP.md の手順で firebase-config.js を設定してください。");
  }

  async function readJson(response) {
    const text = await response.text();
    if (!text) return null;
    try { return JSON.parse(text); }
    catch (error) { throw new Error(`応答を解釈できません（HTTP ${response.status}）。`); }
  }

  async function callIdentity(method, payload) {
    requireConfig();
    const response = await fetch(`${IDENTITY_ORIGIN}:${method}?key=${encodeURIComponent(config.apiKey)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const body = await readJson(response);
    if (!response.ok) throw new Error(translate(body && body.error ? body.error.message : `HTTP ${response.status}`));
    return body;
  }

  function signUp(email, password) {
    return callIdentity("signUp", { email, password, returnSecureToken: true });
  }

  function signIn(email, password) {
    return callIdentity("signInWithPassword", { email, password, returnSecureToken: true });
  }

  function lookup(idToken) {
    return callIdentity("lookup", { idToken });
  }

  async function refresh(refreshToken) {
    requireConfig();
    // トークン更新だけは form 形式を要求される別ホストなので、共通処理に載せない。
    const response = await fetch(`${TOKEN_ORIGIN}?key=${encodeURIComponent(config.apiKey)}`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`
    });
    const body = await readJson(response);
    if (!response.ok) throw new Error(translate(body && body.error ? body.error.message : `HTTP ${response.status}`));
    return { idToken: body.id_token, refreshToken: body.refresh_token, expiresIn: body.expires_in, localId: body.user_id };
  }

  async function request(method, path, idToken, value) {
    requireConfig();
    const base = config.databaseURL.replace(/\/+$/, "");
    const query = idToken ? `?auth=${encodeURIComponent(idToken)}` : "";
    const options = { method, headers: {} };
    if (value !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(value);
    }
    const response = await fetch(`${base}/${path}.json${query}`, options);
    const body = await readJson(response);
    if (response.status === 401 || response.status === 403) {
      const denied = new Error("この操作は許可されていません。");
      denied.permissionDenied = true;
      throw denied;
    }
    if (!response.ok) throw new Error(`通信エラー（HTTP ${response.status}）：${body && body.error ? body.error : ""}`);
    return body;
  }

  game.net.backend = {
    isConfigured,
    signUp,
    signIn,
    lookup,
    refresh,
    dbGet: function dbGet(path, idToken) { return request("GET", path, idToken); },
    dbPut: function dbPut(path, value, idToken) { return request("PUT", path, idToken, value); },
    dbPatch: function dbPatch(path, value, idToken) { return request("PATCH", path, idToken, value); },
    dbDelete: function dbDelete(path, idToken) { return request("DELETE", path, idToken); }
  };
}(globalThis));

(function defineAccount(global) {
  const game = global.DMGame;
  const backend = game.net.backend;
  const config = game.net.config;
  const AUTH_KEY = "dm-private-table-auth-v1";
  const REFRESH_MARGIN_MS = 60000;

  // idToken はメモリだけに置く。localStorage に残すのは寿命の長い refreshToken だけで、
  // これはサーバー側ルールの allowlist を通らなければ何の権限も持たない。
  let idToken = null;
  let expiresAt = 0;
  let refreshToken = null;
  const listeners = [];

  const state = { status: "loading", user: null, error: "", busy: false };

  function notify() {
    listeners.forEach(function call(listener) { listener(state); });
  }

  function emailKey(email) {
    // RTDB のキーに "." は使えないため "," へ置換する。ルール側も同じ変換を行う。
    return String(email || "").trim().toLowerCase().replace(/\./g, ",");
  }

  function persist() {
    if (!refreshToken || !state.user) { localStorage.removeItem(AUTH_KEY); return; }
    localStorage.setItem(AUTH_KEY, JSON.stringify({ refreshToken, uid: state.user.uid, email: state.user.email, name: state.user.name }));
  }

  function clearTokens() {
    idToken = null;
    refreshToken = null;
    expiresAt = 0;
  }

  function adoptTokens(result) {
    idToken = result.idToken;
    refreshToken = result.refreshToken;
    expiresAt = Date.now() + (Number(result.expiresIn || 3600) * 1000);
  }

  async function getToken() {
    if (!refreshToken) return null;
    if (idToken && Date.now() < expiresAt - REFRESH_MARGIN_MS) return idToken;
    const result = await backend.refresh(refreshToken);
    adoptTokens(result);
    persist();
    return idToken;
  }

  // allowlist は「入室できるか」の唯一の判定源。ここで false なら以降の読み書きは
  // すべてサーバー側で拒否されるので、画面上でも早めに止めて理由を伝える。
  async function checkAllowlist(email) {
    const token = await getToken();
    try {
      const value = await backend.dbGet(`allowlist/${emailKey(email)}`, token);
      return value === true;
    } catch (error) {
      if (error.permissionDenied) return false;
      throw error;
    }
  }

  async function completeSignIn(result, fallbackName) {
    adoptTokens(result);
    const email = result.email;
    const allowed = await checkAllowlist(email);
    state.user = { uid: result.localId, email, name: fallbackName || email.split("@")[0] };
    if (!allowed) {
      state.status = "denied";
      state.error = "このアカウントは招待されていません。管理者にメールアドレスを登録してもらってください。";
      persist();
      notify();
      return state;
    }
    const token = await getToken();
    const profile = await backend.dbGet(`users/${result.localId}/profile`, token);
    if (profile && profile.name) state.user.name = profile.name;
    else await backend.dbPut(`users/${result.localId}/profile`, { name: state.user.name, email }, token);
    state.status = "signed-in";
    state.error = "";
    persist();
    notify();
    return state;
  }

  async function guard(work) {
    state.busy = true;
    state.error = "";
    notify();
    try { return await work(); }
    catch (error) {
      state.error = error.message;
      notify();
      throw error;
    } finally {
      state.busy = false;
      notify();
    }
  }

  function signIn(email, password) {
    return guard(async function run() {
      const result = await backend.signIn(String(email).trim(), password);
      return completeSignIn(result, null);
    });
  }

  function signUp(email, password, displayName, inviteCode) {
    return guard(async function run() {
      // 招待コードは一次フィルタでしかない。突破されても allowlist で止まる。
      if (config.inviteCode && String(inviteCode || "").trim() !== config.inviteCode) {
        throw new Error("招待コードが違います。");
      }
      if (String(password || "").length < 6) throw new Error("パスワードは6文字以上にしてください。");
      const result = await backend.signUp(String(email).trim(), password);
      return completeSignIn(result, String(displayName || "").trim() || null);
    });
  }

  function signOut() {
    clearTokens();
    state.user = null;
    state.status = "signed-out";
    state.error = "";
    localStorage.removeItem(AUTH_KEY);
    notify();
  }

  async function restore() {
    if (!backend.isConfigured()) {
      // 未設定のままでも CPU 戦とローカルデッキだけは触れるようにしておく。
      state.status = "local";
      notify();
      return state;
    }
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); }
    catch (error) { saved = null; }
    if (!saved || !saved.refreshToken) {
      state.status = "signed-out";
      notify();
      return state;
    }
    refreshToken = saved.refreshToken;
    try {
      const result = await backend.refresh(refreshToken);
      return await completeSignIn(Object.assign({ email: saved.email }, result), saved.name);
    } catch (error) {
      clearTokens();
      localStorage.removeItem(AUTH_KEY);
      state.status = "signed-out";
      state.error = error.message;
      notify();
      return state;
    }
  }

  async function updateDisplayName(nextName) {
    const name = String(nextName || "").trim();
    if (!name) throw new Error("表示名を入力してください。");
    if (state.status !== "signed-in") { state.user = state.user || {}; state.user.name = name; notify(); return; }
    const token = await getToken();
    await backend.dbPatch(`users/${state.user.uid}/profile`, { name }, token);
    state.user.name = name;
    persist();
    notify();
  }

  game.net.account = {
    state,
    restore,
    signIn,
    signUp,
    signOut,
    getToken,
    emailKey,
    updateDisplayName,
    isOnline: function isOnline() { return state.status === "signed-in"; },
    onChange: function onChange(listener) { listeners.push(listener); }
  };
}(globalThis));

(function defineCardPool(global) {
  const game = global.DMGame;
  const engine = game.engine;
  const backend = game.net.backend;
  const account = game.net.account;
  const CACHE_KEY = "dm-card-pool-cache";

  // 実カードデータはリポジトリにも公開ビルドにも入れない（憲章 §2.1）。
  // かわりに招待制のデータベースへ置き、ログインした端末が起動時に取りに行く。
  // こうすると、どの端末でも同じプールで遊べて、名前はコードに残らない。
  const FALLBACK = { cards: (engine.RAW_CARDS || []).slice(), label: engine.CARD_POOL_LABEL };

  const state = {
    status: "demo",          // demo / loading / loaded / cached / error
    error: "",
    label: engine.CARD_POOL_LABEL,
    version: engine.CARD_POOL_VERSION,
    kinds: (engine.RAW_CARDS || []).length,
    updatedAt: 0
  };

  function readCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); }
    catch (error) { return null; }
  }

  function writeCache(payload) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(payload)); }
    catch (error) { /* 容量超過などは致命的ではない。次回また取りに行くだけ。 */ }
  }

  // 壊れたデータでプールを上書きすると、以降まともに遊べなくなる。
  // 必ず検証してから差し替え、駄目なら元のプールへ戻す。
  function apply(payload, status) {
    if (!payload || !Array.isArray(payload.cards) || payload.cards.length === 0) return false;
    engine.registerCardPool(payload.cards, payload.label || "real");
    const result = engine.validateCardPool(engine.RAW_CARDS);
    if (!result.valid) {
      engine.registerCardPool(FALLBACK.cards, FALLBACK.label);
      throw new Error(`カードデータが壊れています：${result.errors[0]}`);
    }
    engine.REAL_DECKS = Array.isArray(payload.decks) ? payload.decks : [];
    state.status = status;
    state.error = "";
    state.label = engine.CARD_POOL_LABEL;
    state.version = engine.CARD_POOL_VERSION;
    state.kinds = engine.RAW_CARDS.length;
    state.updatedAt = payload.updatedAt || 0;
    return true;
  }

  // 起動直後に、前回取得したプールをすぐ載せる。通信を待たずに
  // デッキが正しく表示され、圏外でも同じプールで遊べる。
  function restoreCache() {
    const cached = readCache();
    if (!cached) return false;
    try { return apply(cached, "cached"); }
    catch (error) { return false; }
  }

  async function load() {
    if (!account.isOnline()) return state;
    state.status = "loading";
    state.error = "";
    try {
      const token = await account.getToken();
      const payload = await backend.dbGet("cardPool", token);
      if (!payload || !Array.isArray(payload.cards) || payload.cards.length === 0) {
        // まだ誰も投入していない。架空カードのまま遊べるので失敗にはしない。
        if (state.status === "loading") state.status = readCache() ? "cached" : "demo";
        return state;
      }
      apply(payload, "loaded");
      writeCache(payload);
    } catch (error) {
      state.status = restoreCache() ? "cached" : "error";
      state.error = error.permissionDenied
        ? "カードデータを読む権限がありません。allowlist への登録を確認してください。"
        : `カードデータを読み込めませんでした：${error.message}`;
    }
    return state;
  }

  function clearCache() {
    try { localStorage.removeItem(CACHE_KEY); } catch (error) { /* 消せなくても実害はない */ }
  }

  // プールが揃っていない端末で保存すると、知らないカードごとデッキを壊しかねない。
  // 「今のプールは実データか」を1か所で答えられるようにしておく。
  function isComplete() {
    return state.status === "loaded" || state.status === "cached";
  }

  game.net.cardPool = { state, load, restoreCache, clearCache, isComplete };
}(globalThis));
