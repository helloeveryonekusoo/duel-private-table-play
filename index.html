.room-code-block{margin:1.25rem 0;border:1px solid #6d6435;border-radius:11px;padding:1.25rem;background:#1b1a12;text-align:center}
.room-code{display:block;margin:.55rem 0 1rem;font-family:"Consolas","SFMono-Regular",monospace;font-size:2.6rem;letter-spacing:.32em;color:#f3e6a6;text-indent:.32em}

@keyframes auto-step-pulse{0%,100%{opacity:.35}50%{opacity:1}}

.civ-filter{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0 .35rem}

.civ-chip b{color:var(--text);font-variant-numeric:tabular-nums;font-size:.72rem}

.civ-chip-dark{border-left:4px solid var(--civ-dark)}
.civ-chip-fire{border-left:4px solid var(--civ-fire)}
.civ-chip-nature{border-left:4px solid var(--civ-nature)}

.civ-heading b{padding:.05rem .4rem;border-radius:999px;background:#1b1f2b;color:var(--text);font-size:.7rem;font-variant-numeric:tabular-nums}
.effect-notes{margin:.35rem 0 0;padding:.35rem .45rem;list-style:none;border-top:1px dashed var(--line);color:var(--text-dim);font-size:.62rem;line-height:1.45}

(function defineCardRegistry(global) {
  const engine = global.DMGame.engine;

  // カードプールは「登録制」にする。架空カードを既定として読み込み、
  // 実カードデータ（data/ から生成、リポジトリ非追跡）が存在すれば上書きする。
  // こうしないと、実在のカード名が追跡対象ファイルに残ってしまう（憲章 §2.1）。
  function fingerprint(cards, label) {
    const source = cards.map(function digest(card) { return JSON.stringify(card); }).sort().join("|");
    let hash = 2166136261;
    for (let index = 0; index < source.length; index += 1) {
      hash ^= source.charCodeAt(index);
      hash = Math.imul(hash, 16777619) >>> 0;
    }
    return `${label}:${cards.length}-${hash.toString(36)}`;
  }

  // ツインパクトは1枚に2つの面を持つ。場以外（マナ・手札・墓地・シールド）では
  // 「両面を合わせた多色カード」として扱うため、その合成面をここで作っておく。
  // 面を選んで使うときは faces[n] を見る（engine.faceDef）。
  function buildComposite(card) {
    const faces = card.faces || [];
    const civs = [];
    const races = [];
    const keywords = [];
    const keywordArgs = {};
    faces.forEach(function collect(face) {
      (face.civs || []).forEach(function civ(value) { if (civs.indexOf(value) < 0) civs.push(value); });
      (face.races || []).forEach(function race(value) { if (races.indexOf(value) < 0) races.push(value); });
      (face.keywords || []).forEach(function keyword(value) { if (keywords.indexOf(value) < 0) keywords.push(value); });
      // キーワードを合成面へ引き上げる以上、その引数も一緒に持ち上げないと
      // 「引数のないキーワード」になってしまい、検証にも実行にも失敗する。
      Object.keys(face.keywordArgs || {}).forEach(function args(keyword) {
        if (keywordArgs[keyword] == null) keywordArgs[keyword] = face.keywordArgs[keyword];
      });
    });
    return {
      id: card.id,
      name: faces.map(function label(face) { return face.name; }).join(" / "),
      type: "twinpact",
      civs,
      races,
      // 合成面では能力を持たない。能力は必ず選んだ面から引く。
      keywords,
      keywordArgs,
      abilities: [],
      // コストを参照する効果は「好きな方を選べる」ため、代表値は小さい方にしておく。
      cost: faces.reduce(function cheapest(value, face) { return Math.min(value, face.cost || 0); }, Infinity),
      text: faces.map(function label(face) { return `【${face.type === "spell" ? "呪文" : "クリーチャー"}】${face.text}`; }).join("\n"),
      faces
    };
  }

  engine.normalizeCard = function normalizeCard(card) {
    if (card.type !== "twinpact") return card;
    const composite = buildComposite(card);

    { id:"demo-058", name:"城壁の司祭", civs:["light"], cost:5, power:5000, type:"creature", races:["聖騎"], text:"W・ブレイカー。各ブレイクの前に、山札の上から1枚をシールド化するか、表向きにしてシールドの上に置く。", keywords:["wb"], abilities:[{ trigger:"beforeBreak", effects:[{ op:"chooseMode", prompt:"ブレイクの前に、シールドを1つ増やします。", modes:[{ label:"山札の上から1枚をシールド化する", effects:[{ op:"addShield", count:1, from:"deck" }] }, { label:"山札の上から1枚を表向きにしてシールドの上に置く", effects:[{ op:"toCrest", from:"deck" }] }] }] }] },

    { id:"demo-079", name:"門出の合図", civs:["light"], cost:2, type:"spell", text:"S・トリガー。コストの合計が4以下になるように、好きな数の進化ではないクリーチャーを自分の手札からバトルゾーンに出す。", keywords:["st"], abilities:[{ trigger:"onCast", effects:[{ op:"summonTargets", totalCostMax:4, target:{ zone:"hand", owner:"self", filter:{ type:"creature", evolution:false }, count:8, optional:true } }] }] },
    { id:"demo-080", name:"追い討ちの伏兵", civs:["fire"], cost:5, power:4000, type:"creature", races:["炎兵"], text:"スピードアタッカー。自分のクリーチャーが攻撃する時、このクリーチャーが自分の手札にあり、その攻撃がこのターン2度目のクリーチャーによる攻撃であれば、攻撃の後、バトルゾーンに同名がなければ、このクリーチャーを出してもよい。", keywords:["sa"], abilities:[{ trigger:"afterAttack", zone:"hand", watch:{ filter:{ owner:"self", type:"creature" } }, condition:{ attacksThisTurn:{ owner:"self", min:2, max:2 }, absentSelfName:true }, effects:[{ op:"chooseMode", prompt:"出しますか？", modes:[{ label:"バトルゾーンに出す", effects:[{ op:"summonSelf" }] }, { label:"出さない", effects:[] }] }] }] },

    { id:"demo-083", name:"雫の恵み", civs:["water","nature"], cost:4, type:"spell", text:"S・トリガー。自分の山札の上から2枚を見る。そのうちの1枚を手札に加え、もう1枚をマナゾーンに置く。", keywords:["st"], abilities:[{ trigger:"onCast", effects:[{ op:"lookAndChoose", count:2, min:1, max:1, to:"hand", restTo:"mana", prompt:"手札に加えるカードを選んでください。" }] }] },
    { id:"demo-084", name:"影渡りの術者", civs:["dark"], cost:7, power:5000, type:"creature", races:["影魔","忍法者"], text:"ニンジャ・ストライク7。出た時、相手のクリーチャー1体は、このターン、パワーを6000下げる。破壊される時、自分のマナゾーンに闇のカードがあれば、かわりに自分のシールドを1つ墓地に置いてもよい。", keywords:["ninjaStrike"], keywordArgs:{ ninjaStrike:{ value:7 } }, abilities:[{ trigger:"onPlay", effects:[{ op:"powerMod", target:{ owner:"opponent", filter:{ type:"creature" }, count:1 }, value:-6000, duration:"turn" }] }, { trigger:"replacement", event:"destroy", optional:true, match:{ self:true }, condition:{ zoneMatching:{ zone:"mana", owner:"self", filter:{ civs:["dark"] }, min:1 } }, replaceWith:[{ op:"stay" }, { op:"shieldToGraveyard", count:1, owner:"self" }] }] },

    { id:"demo-086", name:"群れなす影", civs:["dark"], cost:6, power:5000, type:"creature", races:["影魔"], text:"シンパシー：影魔（自分の影魔1体につき、このクリーチャーの召喚コストを1少なくする。ただしコストは1以下にはならない）", keywords:["sympathy"], keywordArgs:{ sympathy:{ filter:{ type:"creature", races:["影魔"] }, floor:1 } }, abilities:[] },
    { id:"demo-087", name:"盾番の霊騎", civs:["light"], cost:5, power:4000, type:"creature", races:["聖騎"], text:"S・トリガー。ブロッカー。各ターンに1度、カードが自分のシールドゾーンを離れた時、相手のクリーチャーを1体選び、タップしてもよい。", keywords:["st","blocker"], abilities:[{ trigger:"onShieldLeft", limit:"turn", watch:{ filter:{ owner:"self" } }, effects:[{ op:"tap", target:{ owner:"opponent", filter:{ type:"creature" }, count:1, optional:true } }] }] },

    { id:"demo-091", name:"闇冠の魔王", civs:["dark"], cost:10, power:13000, type:"creature", races:["影魔"], text:"進化－自分の影魔1体の上に置く。T・ブレイカー。出た時、闇以外のクリーチャーをすべて破壊する。その後、各プレイヤーは、自身のマナゾーンから闇以外のカードをすべて墓地に置く。", keywords:["tb"], evolution:{ from:{ races:["影魔"] }, count:1, star:false, leaveTopOnly:false }, abilities:[{ trigger:"onPlay", effects:[{ op:"sequence", steps:[{ op:"destroy", target:{ zone:"battle", filter:{ type:"creature", not:{ civs:["dark"] } }, countMode:"all" } }, { op:"discard", target:{ zone:"mana", filter:{ not:{ civs:["dark"] } }, countMode:"all" } }] }] }] },

    { id:"demo-093", name:"墓下の詠み手", civs:["dark"], cost:7, power:8000, type:"creature", races:["影魔","屍竜"], text:"W・ブレイカー。出た時、自分の山札から闇のカードを1枚選び、墓地に置いてもよい。攻撃する時、自分の墓地からコスト6以下の闇の呪文を1つ、コストを支払わずに唱えてもよい。そうしたら、その呪文を山札の一番下に置く。", keywords:["wb"], abilities:[{ trigger:"onPlay", effects:[{ op:"search", zone:"deck", filter:{ civs:["dark"] }, to:"graveyard" }] }, { trigger:"onAttack", effects:[{ op:"castFrom", zone:"graveyard", optional:true, after:"deckBottom", filter:{ type:"spell", civs:["dark"], costMax:6 } }] }] },

    { id:"demo-097", name:"墓積みの巨影", civs:["dark"], cost:7, power:12000, type:"creature", races:["影魔","屍竜"], text:"進化－自分の影魔1体の上に置く。T・ブレイカー。メテオバーン：このクリーチャーが攻撃する時、このクリーチャーの下にあるカードを好きな数、墓地に置いてもよい。こうして墓地に置いたカード1枚につき、相手の手札を1枚見ないで選び、山札の一番下に置く。", keywords:["tb"], evolution:{ from:{ races:["影魔"] }, count:1, star:false, leaveTopOnly:false }, abilities:[{ trigger:"onAttack", effects:[{ op:"meteorBurn", then:[{ op:"toDeckBottom", target:{ zone:"hand", owner:"opponent", count:1, random:true } }] }] }] },

    { id:"demo-102", name:"盾すり替えの術者", civs:["water"], cost:2, power:1000, type:"creature", races:["海鳥"], text:"出た時、自分の手札を1枚、裏向きのまま新しいシールドとしてシールドゾーンに置いてもよい。そうしたら、自分のシールドを1つ手札に加える。その「S・トリガー」は使えない。", keywords:[], abilities:[{ trigger:"onPlay", effects:[{ op:"sequence", steps:[{ op:"toShield", target:{ zone:"hand", owner:"self", count:1, optional:true } }, { op:"shieldToHand", count:1, owner:"self", choose:true }] }] }] },
    { id:"demo-103", name:"閃光の大守護", civs:["light"], cost:9, power:3500, type:"creature", races:["聖騎"], text:"S・トリガー。ブロッカー。出た時、相手のクリーチャーをすべてタップする。", keywords:["st","blocker"], abilities:[{ trigger:"onPlay", effects:[{ op:"tap", target:{ zone:"battle", owner:"opponent", filter:{ type:"creature" }, countMode:"all" } }] }] },
    { id:"demo-104", name:"呪詛封じの神竜", civs:["light"], cost:9, power:6000, type:"creature", races:["神竜"], text:"W・ブレイカー。相手は手札を表向きにしてプレイする。相手の手札にある呪文1枚につき、このクリーチャーのパワーを+2000する。相手は呪文を唱えられない。", keywords:["wb"], abilities:[{ trigger:"static", effects:[{ op:"revealHand", who:"opponent" }, { op:"powerAura", filter:{ self:true }, valuePer:{ zone:"hand", owner:"opponent", filter:{ type:"spell" }, value:2000 } }, { op:"restrictSpell", who:"opponent" }] }] },
    { id:"demo-105", name:"貫きの水槍", civs:["water"], cost:6, power:8000, type:"creature", races:["海鳥"], text:"進化－自分の海鳥1体の上に置く。このクリーチャーはブロックされない。W・ブレイカー。", keywords:["guard","wb"], evolution:{ from:{ races:["海鳥"] }, count:1, star:false, leaveTopOnly:false }, abilities:[] },
    { id:"demo-106", name:"疾風の見張り番", civs:["fire"], cost:4, power:4000, type:"creature", races:["炎兵"], text:"スピードアタッカー。自分のターン中、相手のクリーチャーが召喚以外の方法でバトルゾーンに出た時、そのクリーチャーを破壊する。", keywords:["sa"], abilities:[{ trigger:"onFreePlay", watch:{ filter:{ owner:"opponent", type:"creature" } }, condition:{ myTurn:true }, effects:[{ op:"destroy", target:{ watched:true } }] }] },
    { id:"demo-107", name:"三色の集い", civs:["light","water","nature"], cost:3, power:3000, type:"creature", races:["巨人","氷精"], text:"自分のマナゾーンに光、水、自然の各文明があれば、このクリーチャーの召喚コストを1少なくする。NEO進化：自分の光、水、または自然のクリーチャー1体の上に置いてもよい。出た時、自分の山札の上から2枚を見る。その中から1枚を手札に加えるかマナゾーンに置き、残りの1枚を山札の下に置く。", keywords:[], evolution:{ neo:true, from:{ civs:["light","water","nature"] } }, costReduction:[{ condition:{ manaCivs:["light","water","nature"] }, value:-1 }], abilities:[{ trigger:"onPlay", effects:[{ op:"lookAndChoose", count:2, min:1, max:1, toChoice:["hand","mana"], restTo:"deck", prompt:"手札かマナゾーンに置くカードを選んでください。" }] }] },
    { id:"demo-108", name:"黒曜の兌換商", civs:["dark"], cost:5, power:6000, type:"creature", races:["機兵","走竜"], text:"ブロッカー。W・ブレイカー。出た時、次の中から2つ選ぶ。（同じものを2回選んでもよい）▶相手のクリーチャーを1体選ぶ。このターン、そのクリーチャーのパワーを-4000する。▶自分の山札の上から4枚を墓地に置く。▶コスト4以下のクリーチャーを1体、自分の墓地から出す。このクリーチャーが離れる時、かわりに自分の他のクリーチャーを1体破壊してもよい。", keywords:["blocker","wb"], abilities:[{ trigger:"onPlay", effects:[{ op:"chooseMode", count:2, allowRepeat:true, prompt:"使うモードを2つ選んでください。", modes:[{ label:"相手のクリーチャーのパワーを-4000する", effects:[{ op:"powerMod", target:{ owner:"opponent", filter:{ type:"creature" }, count:1 }, value:-4000, duration:"turn" }] }, { label:"自分の山札の上から4枚を墓地に置く", effects:[{ op:"lookAndPick", count:4, pick:4, to:"graveyard" }] }, { label:"コスト4以下のクリーチャーを墓地から出す", effects:[{ op:"revive", filter:{ type:"creature", costMax:4 }, count:1, optional:true }] }] }] }, { trigger:"replacement", event:"destroy", optional:true, match:{ self:true }, replaceWith:[{ op:"stay" }, { op:"destroy", target:{ owner:"self", filter:{ type:"creature", notSelf:true }, count:1 } }] }] },
    { id:"demo-109", name:"凱歌の紅将", civs:["fire"], cost:6, power:6000, type:"creature", races:["紅将","異形"], text:"相手のマナゾーンに多色カードがあれば、このクリーチャーの召喚コストを3少なくする。スピードアタッカー。W・ブレイカー。自分のターン中、このクリーチャーのパワーを+4000する。出た時、相手のクリーチャーを1体選んでもよい。その選んだクリーチャーとこのクリーチャーをバトルさせる。自分のクリーチャーがバトルに勝った時、カードを1枚引いてもよい。", keywords:["sa","wb"], costReduction:[{ condition:{ zoneMatching:{ zone:"mana", owner:"opponent", filter:{ civsMin:2 }, min:1 } }, value:-3 }], abilities:[{ trigger:"static", condition:{ myTurn:true }, effects:[{ op:"powerAura", filter:{ self:true }, value:4000 }] }, { trigger:"onPlay", effects:[{ op:"battleWith", target:{ owner:"opponent", filter:{ type:"creature" }, count:1, optional:true } }] }, { trigger:"onBattleWin", watch:{ filter:{ owner:"self", type:"creature" } }, effects:[{ op:"chooseMode", prompt:"カードを1枚引きますか？", modes:[{ label:"1枚引く", effects:[{ op:"draw", count:1 }] }, { label:"引かない", effects:[] }] }] }] },

    { id:"demo-114", type:"twinpact", faces:[

    { id:"demo-116", name:"時渡りの司教", civs:["light","water"], cost:8, power:12000, type:"creature", races:["天使","時竜"], text:"マナゾーンに置く時、このカードはタップして置く。革命チェンジ―光または水のコスト5以上のドラゴン。T・ブレイカー。出た時、光のコスト5以下の呪文を1枚、コストを支払わずに自分の手札から唱えてもよい。そうしなければ、カードを1枚引く。ファイナル革命：このクリーチャーが「革命チェンジ」によって出た時、そのターン中に他の「ファイナル革命」をまだ使っていなければ、次の相手のターンの終わりまで、相手はコスト7以下のクリーチャーを召喚できない。", manaTapped:true, keywords:["revolutionChange","tb"], keywordArgs:{ revolutionChange:{ from:{ civs:["light","water"], costMin:5, raceIncludes:["竜"] } } }, abilities:[{ trigger:"onPlay", effects:[{ op:"castFrom", zone:"hand", optional:true, filter:{ civs:["light"], costMax:5 }, prompt:"唱える呪文を選んでください。", otherwise:[{ op:"draw", count:1 }] }] }, { trigger:"onPlay", requireEnteredBy:"revolutionChange", limit:"turn", tag:"finalRevolution", effects:[{ op:"floatEffect", turns:1, effect:{ op:"restrictSummon", who:"opponent", anyZone:true, filter:{ costMax:7 } } }] }] },

    { id:"demo-118", name:"止め時の懐中時計", civs:["water"], cost:3, power:3000, type:"creature", races:["時兵"], text:"S・トリガー・プラス（このクリーチャーを自分のシールドゾーンから手札に加える時、コストを支払わずにすぐ召喚してもよい。それが相手のターンで、そのターン中に自分のシールドが2つ以上ブレイクされていれば、このクリーチャーにP能力を与える）P－出た時、このターン、相手はクリーチャーで攻撃できない。出た時、カードを2枚引いてもよい。そうしたら、自分の手札を1枚捨てる。", keywords:["stPlus"], abilities:[{ trigger:"onPlay", condition:{ opponentTurn:true, shieldsBrokenThisTurn:{ owner:"self", min:2 } }, effects:[{ op:"floatEffect", turns:0, effect:{ op:"restrictAttack", who:"opponent" } }] }, { trigger:"onPlay", effects:[{ op:"chooseMode", prompt:"カードを2枚引きますか？", modes:[{ label:"2枚引いて1枚捨てる", effects:[{ op:"draw", count:2 }, { op:"discard", target:{ zone:"hand", owner:"self", count:1 } }] }, { label:"引かない", effects:[] }] }] }] },
    { id:"demo-119", name:"裏影の写し手", civs:["water"], cost:3, power:3000, type:"creature", races:["写影","忍法者"], text:"ウラ・ニンジャ・ストライク3（水）。出た時、カードを2枚引き、自分の手札を1枚捨てる。次の自分のターンのはじめまで、その捨てたカードと同じコストの相手のクリーチャーはすべて、攻撃もブロックもできない。", keywords:["uraNinjaStrike"], keywordArgs:{ uraNinjaStrike:{ value:3, civ:"water" } }, abilities:[{ trigger:"onPlay", effects:[{ op:"draw", count:2 }, { op:"discard", target:{ zone:"hand", owner:"self", count:1 } }, { op:"bakeCost", from:"lastTargets", then:[{ op:"floatEffect", turns:1, effects:[{ op:"restrictAttack", who:"opponent", filter:{ costMin:"$declared", costMax:"$declared" } }, { op:"restrictBlock", who:"opponent", filter:{ costMin:"$declared", costMax:"$declared" } }] }] }] }] },
    { id:"demo-120", name:"静止の門番", civs:["light"], cost:7, power:9500, type:"creature", races:["機兵","忍法者"], text:"ニンジャ・チェンジ5（相手のクリーチャーが攻撃またはブロックした時、この攻撃中に自分が「ニンジャ」能力を使っていなければ、手札にあるこのクリーチャーと、自分のコスト5以上で機兵または忍法者のクリーチャー1体を入れ替えてもよい）W・ブレイカー。出た時または攻撃する時、相手のクリーチャーをすべてタップする。相手のクリーチャーは、出たターン攻撃できない。", keywords:["ninjaChange","wb"], keywordArgs:{ ninjaChange:{ from:{ costMin:5, raceIncludes:["機兵","忍法者"] } } }, abilities:[{ trigger:"onPlay", effects:[{ op:"tap", target:{ owner:"opponent", filter:{ type:"creature" }, countMode:"all" } }] }, { trigger:"onAttack", effects:[{ op:"tap", target:{ owner:"opponent", filter:{ type:"creature" }, countMode:"all" } }] }, { trigger:"static", effects:[{ op:"restrictAttack", who:"opponent", filter:{ enteredThisTurn:true } }] }] },

    { id:"demo-123", name:"三閃の采配", civs:["fire"], cost:3, type:"spell", text:"次の中から2回選ぶ。（同じものを選んでもよい）▶コスト3以下のクリーチャーを1体、自分の手札から出す。▶このターン、自分のクリーチャー1体に「スピードアタッカー」を与える。▶自分のクリーチャーを1体選ぶ。このターン、そのクリーチャーの最初の攻撃の終わりに、そのクリーチャーをアンタップする。", keywords:[], abilities:[{ trigger:"onCast", effects:[{ op:"chooseMode", count:2, allowRepeat:true, prompt:"使うモードを2つ選んでください。", modes:[{ label:"コスト3以下のクリーチャーを手札から出す", effects:[{ op:"summonTargets", target:{ zone:"hand", owner:"self", filter:{ type:"creature", costMax:3 }, count:1, optional:true } }] }, { label:"自分のクリーチャー1体にスピードアタッカーを与える", effects:[{ op:"grantKeyword", target:{ owner:"self", filter:{ type:"creature" }, count:1 }, keyword:"sa", duration:"turn" }] }, { label:"自分のクリーチャー1体を、最初の攻撃の終わりにアンタップする", effects:[{ op:"untapAfterAttack", target:{ owner:"self", filter:{ type:"creature" }, count:1 } }] }] }] }] },
    { id:"demo-124", name:"理の采配", civs:["light","water"], cost:4, type:"spell", text:"自分のシールドが2つ以下なら、自分のシールドゾーンから手札に加えるこの呪文に「S・トリガー」を与える。次の中から2回選ぶ。（同じものを選んでもよい）▶自分の山札の上から2枚を表向きにする。その中から光のカードと水のカードをすべて手札に加え、残りを山札の下に置く。▶自分の山札の上から1枚をシールド化する。▶コスト3以下のエレメントを1つ選び、シールド化する。", keywords:[], selfKeywords:[{ condition:{ shieldsMax:2 }, keyword:"st" }], abilities:[{ trigger:"onCast", effects:[{ op:"chooseMode", count:2, allowRepeat:true, prompt:"使うモードを2つ選んでください。", modes:[{ label:"山札の上から2枚を表向きにし、光と水のカードを手札に加える", effects:[{ op:"lookAndPick", count:2, filter:{ civs:["light","water"] }, to:"hand", restTo:"deck", faceUp:true }] }, { label:"山札の上から1枚をシールド化する", effects:[{ op:"addShield", count:1, from:"deck" }] }, { label:"コスト3以下のエレメントを1つ選び、シールド化する", effects:[{ op:"toShield", target:{ zone:"battle", filter:{ costMax:3 }, count:1 } }] }] }] }] },
    { id:"demo-125", name:"氷炎の采配", civs:["water","fire"], cost:3, type:"spell", text:"自分の墓地に呪文が2枚以上あれば、自分のシールドゾーンにあるこの呪文に「S・トリガー」を与える。次の中から2回選ぶ。（同じものを選んでもよい）▶相手のクリーチャーを1体選ぶ。次の自分のターンのはじめまで、そのクリーチャーは攻撃もブロックもできない。▶自分の手札を1枚捨て、カードを2枚引く。▶コスト2以下のクリーチャーを1体、自分の手札から出す。", keywords:[], selfKeywords:[{ condition:{ zoneMatching:{ zone:"graveyard", owner:"self", filter:{ type:"spell" }, min:2 } }, keyword:"st" }], abilities:[{ trigger:"onCast", effects:[{ op:"chooseMode", count:2, allowRepeat:true, prompt:"使うモードを2つ選んでください。", modes:[{ label:"相手のクリーチャー1体を、次の自分のターンのはじめまで攻撃もブロックもできなくする", effects:[{ op:"grantKeyword", target:{ zone:"battle", owner:"opponent", filter:{ type:"creature" }, count:1 }, keyword:"cantAttack", duration:"untilMyNextTurn" }, { op:"grantKeyword", target:{ lastTargets:true }, keyword:"cantBlock", duration:"untilMyNextTurn" }] }, { label:"自分の手札を1枚捨て、カードを2枚引く", effects:[{ op:"discard", target:{ zone:"hand", owner:"self", count:1 } }, { op:"draw", count:2 }] }, { label:"コスト2以下のクリーチャーを1体、自分の手札から出す", effects:[{ op:"summonTargets", target:{ zone:"hand", owner:"self", filter:{ type:"creature", costMax:2 }, count:1, optional:true } }] }] }] }] },
    { id:"demo-126", type:"twinpact", faces:[

    { id:"demo-127", name:"三重の弔い", civs:["dark"], cost:5, type:"spell", text:"この呪文を、自分の墓地から唱えてもよい。そうしたら、唱えた後、墓地に置くかわりに自分の山札の一番下に置く。次の中から2回選ぶ。（同じものを選んでもよい）▶相手は自身の手札を1枚選んで捨てる。▶コスト4以下の闇のクリーチャーを1体、自分の墓地から出す。▶相手のクリーチャーを1体選ぶ。このターン、そのクリーチャーのパワーを-4000する。", keywords:[], playableFrom:{ zone:"graveyard", after:"deckBottom" }, abilities:[{ trigger:"onCast", effects:[{ op:"chooseMode", count:2, allowRepeat:true, prompt:"使うモードを2つ選んでください。", modes:[{ label:"相手は自身の手札を1枚選んで捨てる", effects:[{ op:"discard", target:{ zone:"hand", owner:"opponent", count:1, chooser:"opponent" } }] }, { label:"コスト4以下の闇のクリーチャーを1体、自分の墓地から出す", effects:[{ op:"summonTargets", target:{ zone:"graveyard", owner:"self", filter:{ type:"creature", civs:["dark"], costMax:4 }, count:1, optional:true } }] }, { label:"相手のクリーチャー1体のパワーを-4000する", effects:[{ op:"powerMod", target:{ zone:"battle", owner:"opponent", filter:{ type:"creature" }, count:1 }, value:-4000, duration:"turn" }] }] }] }] },
    { id:"demo-128", name:"真偽の采配", civs:["light","water","dark"], cost:5, type:"spell", text:"相手のターンの終わりに、そのターン、クリーチャーが3体以上出ていれば、この呪文をコストを支払わずに唱えてもよい。次の中から2回選ぶ。（同じものを選んでもよい）▶カードを2枚引き、自分の手札を1枚捨てる。▶「S・トリガー」を持つカードを1枚、自分の墓地からコストを支払わずに実行する。こうして呪文を唱えたなら、それを唱えた後、墓地のかわりに山札の下に置く。▶クリーチャーを1体選び、シールド化する。", keywords:[], abilities:[{ trigger:"turnEnd", zone:"hand", condition:{ opponentTurn:true, entriesThisTurn:{ min:3 } }, effects:[{ op:"chooseMode", prompt:"コストを支払わずに唱えますか？", modes:[{ label:"唱える", effects:[{ op:"summonSelf" }] }, { label:"唱えない", effects:[] }] }] }, { trigger:"onCast", effects:[{ op:"chooseMode", count:2, allowRepeat:true, prompt:"使うモードを2つ選んでください。", modes:[{ label:"カードを2枚引き、自分の手札を1枚捨てる", effects:[{ op:"draw", count:2 }, { op:"discard", target:{ zone:"hand", owner:"self", count:1 } }] }, { label:"「S・トリガー」を持つカードを1枚、墓地から実行する", effects:[{ op:"castFrom", zone:"graveyard", anyType:true, optional:true, filter:{ hasKeyword:"st" }, after:"deckBottom", prompt:"墓地から実行するカードを選んでください。" }] }, { label:"クリーチャーを1体選び、シールド化する", effects:[{ op:"toShield", target:{ zone:"battle", filter:{ type:"creature" }, count:1 } }] }] }] }] },
    { id:"demo-129", name:"底知れぬ反撃", civs:["dark"], cost:4, type:"spell", text:"逆転撃［闇(3)］（クリーチャーが自分を攻撃する時、その攻撃中にまだ「逆転撃」を使っていなければ、この呪文を自分の手札からコストを支払わずに唱えてもよい。そうしたら、次の自分のターンのはじめに［闇(3)］を支払う。支払えなければ、自分はゲームに負ける）相手のクリーチャーを1体選ぶ。このターン、そのクリーチャーのパワーを-∞する。（パワー0以下のクリーチャーは破壊される）", keywords:["counterStrike"], keywordArgs:{ counterStrike:{ value:3, civ:"dark" } }, abilities:[{ trigger:"onCast", effects:[{ op:"powerMod", target:{ zone:"battle", owner:"opponent", filter:{ type:"creature" }, count:1 }, value:"-infinity", duration:"turn" }] }] },

    { id:"demo-131", name:"守銭の歩哨", civs:["light"], cost:2, power:2000, type:"creature", races:["機兵"], text:"相手のターン中に、相手のクリーチャーが相手のマナゾーンのカードをタップせずに出た時、それをシールド化してもよい。相手のターン中に、このクリーチャーが離れた時、相手のクリーチャーを1体選び、タップする。次の相手のターンのはじめに、そのクリーチャーはアンタップしない。", keywords:[], abilities:[{ trigger:"onFreePlay", watch:{ filter:{ owner:"opponent", type:"creature" } }, condition:{ opponentTurn:true }, effects:[{ op:"chooseMode", prompt:"そのクリーチャーをシールド化しますか？", modes:[{ label:"シールド化する", effects:[{ op:"toShield", target:{ watched:true } }] }, { label:"何もしない", effects:[] }] }] }, { trigger:"onLeave", condition:{ opponentTurn:true }, effects:[{ op:"freeze", target:{ zone:"battle", owner:"opponent", filter:{ type:"creature" }, count:1 } }] }] },
    { id:"demo-132", name:"改め火の写し身", civs:["water"], cost:2, power:2000, type:"creature", races:["写影","超化獣"], text:"相手のクリーチャーは、相手の手札以外から出ない。Zラッシュ（シールドが離れたら、次の自分のターンのはじめまで、このクリーチャーのハイパーモードを解放する）【ハイパーモード】パワー5000／相手のクリーチャーは、出たターンに攻撃できない。", keywords:["zRush"], abilities:[{ trigger:"static", effects:[{ op:"restrictSummon", who:"opponent" }] }], hyperMode:{ power:5000, abilities:[{ trigger:"static", effects:[{ op:"restrictAttack", who:"opponent", filter:{ enteredThisTurn:true } }] }] } },
    { id:"demo-133", name:"渡さずの門番", civs:["dark"], cost:2, power:2000, type:"creature", races:["夜霊"], text:"バトルゾーンにあるクリーチャーは、シールドゾーンとマナゾーンに置けない。クリーチャーを、シールドゾーンとマナゾーンからバトルゾーンに出せない。", keywords:[], abilities:[{ trigger:"static", effects:[{ op:"restrictMove", who:"any", filter:{ type:"creature" }, from:["battle"], to:["shields","mana"] }, { op:"restrictSummon", who:"any", filter:{ type:"creature" }, except:["graveyard","deck"] }] }] },
    { id:"demo-134", name:"無限袋の苗床", civs:["nature"], cost:2, type:"tamaseed", races:["器"], text:"各ターンはじめて、カードが自分のマナゾーンを離れた時、自分の山札の上から1枚目をマナゾーンに置いてもよい。相手のカードが離れる時、かわりに持ち主のマナゾーンに置いてもよい。", keywords:[], abilities:[{ trigger:"onManaLeave", limit:"turn", watch:{ filter:{ owner:"self" } }, effects:[{ op:"chooseMode", prompt:"山札の上から1枚をマナゾーンに置きますか？", modes:[{ label:"マナゾーンに置く", effects:[{ op:"manaBoost", count:1, tapped:false }] }, { label:"置かない", effects:[] }] }] }, { trigger:"replacement", event:"destroy", optional:true, match:{ filter:{ owner:"opponent" }, fromBattle:true }, replaceWith:[{ op:"toMana" }] }, { trigger:"replacement", event:"moveZone", optional:true, match:{ filter:{ owner:"opponent" }, fromBattle:true }, replaceWith:[{ op:"toMana" }] }] },

    { id:"demo-137", name:"暴れ土竜の王", civs:["nature"], cost:9, power:18000, type:"creature", races:["地竜","機兵"], text:"このクリーチャーを自分のマナゾーンから召喚してもよい。マッハファイター。Q・ブレイカー。相手のエレメントは、相手の手札以外から出ない。相手のエレメントは、実行以外の方法で出ない。自分のクリーチャーが離れる時、かわりに自分のマナゾーンにあるカードを3枚、墓地に置いてもよい。", playableFrom:{ zone:"mana" }, keywords:["machFighter","qb"], abilities:[{ trigger:"static", effects:[{ op:"restrictSummon", who:"opponent" }, { op:"restrictSummon", who:"opponent", playedOnly:true }] }, { trigger:"replacement", event:"destroy", optional:true, match:{ filter:{ owner:"self", type:"creature" }, fromBattle:true }, replaceWith:[{ op:"stay" }, { op:"discard", target:{ zone:"mana", owner:"self", count:3 } }] }, { trigger:"replacement", event:"moveZone", optional:true, match:{ filter:{ owner:"self", type:"creature" }, fromBattle:true }, replaceWith:[{ op:"stay" }, { op:"discard", target:{ zone:"mana", owner:"self", count:3 } }] }] },

    { id:"demo-139", name:"叡智の大星雲", civs:["light"], cost:6, power:9000, type:"creature", races:["天使長"], text:"ブロッカー。W・ブレイカー。シールド・フォース（このクリーチャーを出す時、自分のシールドを1つ選んでもよい。そのシールドがシールドゾーンにある間、このクリーチャーに次のSF能力を与える）SF−自分のクリーチャーは離れない。このクリーチャーが攻撃またはブロックした時、カードを1枚引いてもよい。その後、自分のシールドを1つ手札に加えてもよい。その「S・トリガー」は使えない。その後、自分の手札を1枚、表向きまたは裏向きでシールド化してもよい。", keywords:["blocker","wb","shieldForce"], shieldForce:{ abilities:[{ trigger:"static", effects:[{ op:"keywordAura", filter:{ owner:"self", type:"creature" }, keyword:"noLeave" }] }] }, abilities:[{ trigger:"onAttack", effects:[{ op:"chooseMode", prompt:"カードを1枚引きますか？", modes:[{ label:"1枚引く", effects:[{ op:"draw", count:1 }] }, { label:"引かない", effects:[] }] }, { op:"shieldToHand", count:1, owner:"self", choose:true }, { op:"toShield", target:{ zone:"hand", owner:"self", count:1, optional:true } }] }, { trigger:"onBlock", effects:[{ op:"chooseMode", prompt:"カードを1枚引きますか？", modes:[{ label:"1枚引く", effects:[{ op:"draw", count:1 }] }, { label:"引かない", effects:[] }] }, { op:"shieldToHand", count:1, owner:"self", choose:true }, { op:"toShield", target:{ zone:"hand", owner:"self", count:1, optional:true } }] }] },
    { id:"demo-140", name:"神託の白竜", civs:["light"], cost:7, power:9500, type:"creature", races:["神託竜","神託兵"], text:"ブロッカー。W・ブレイカー。このクリーチャーが出た時、「神託の白竜」以外のクリーチャーの名前を1つ選ぶ。選んだ名前を持つクリーチャーの能力をすべて無視する。自分の他の神託があれば、相手はこのクリーチャーを選べない。", keywords:["blocker","wb"], selfKeywords:[{ condition:{ battle:{ filter:{ owner:"self", raceIncludes:["神託"], notSelf:true }, min:1 } }, keyword:"unchosen" }], abilities:[{ trigger:"onPlay", effects:[{ op:"ignoreAbilitiesOfName", excludeSelfName:true, prompt:"能力を無視するクリーチャーの名前を1つ選んでください。" }] }] },
    { id:"demo-141", name:"地封の学院長", civs:["nature"], cost:5, power:8000, type:"creature", races:["古竜","学院組"], text:"マッハファイター。W・ブレイカー。各ターンに1度、自分の竜が出た時、自分の山札の上から2枚をマナゾーンにタップして置いてもよい。その後、竜のカードを1枚、自分のマナゾーンから手札に戻してもよい。自分の学院組カードを実行する時、自分のマナゾーンにあるカードをすべての文明を持つかのようにタップしてもよい。", keywords:["machFighter","wb"], abilities:[{ trigger:"onPlay", limit:"turn", watch:{ filter:{ owner:"self", type:"creature", raceIncludes:["竜"] }, includeSelf:true }, effects:[{ op:"chooseMode", prompt:"山札の上から2枚をマナゾーンに置きますか？", modes:[{ label:"2枚をタップしてマナゾーンに置く", effects:[{ op:"manaBoost", count:2, tapped:true }] }, { label:"置かない", effects:[] }] }, { op:"chooseMode", prompt:"マナゾーンから竜のカードを手札に戻しますか？", modes:[{ label:"1枚戻す", effects:[{ op:"bounce", target:{ zone:"mana", owner:"self", filter:{ raceIncludes:["竜"] }, count:1 } }] }, { label:"戻さない", effects:[] }] }] }, { trigger:"static", effects:[{ op:"manaAnyCiv", filter:{ raceIncludes:["学院組"] } }] }] },

    { id:"demo-145", name:"観覧の巨甲虫", civs:["light","water","nature"], cost:4, power:6000, type:"creature", races:["巨甲虫"], text:"NEO進化：光、水、または自然のクリーチャー1体の上に置いてもよい。ブロッカー。W・ブレイカー。このクリーチャーが出た時、カードを2枚引く。その後、このクリーチャーに含まれるカード1枚につき、自分のマナゾーンにあるカードを1枚アンタップする。", keywords:["blocker","wb"], evolution:{ neo:true, from:{ civs:["light","water","nature"] } }, abilities:[{ trigger:"onPlay", effects:[{ op:"draw", count:2 }, { op:"repeat", timesFrom:{ selfStack:true }, effects:[{ op:"untap", target:{ zone:"mana", owner:"self", filter:{ tapped:true }, count:1 } }] }] }] },
    { id:"demo-146", name:"激流の竜騎公", civs:["water"], cost:6, power:6000, type:"creature", races:["水人","波竜","蒸機士"], text:"NEO進化：光、水、または闇のクリーチャー1体の上に置いてもよい。NEO進化クリーチャーとして召喚するなら、このクリーチャーの召喚コストを3少なくする。W・ブレイカー。このクリーチャーが出た時、カードを3枚引き、自分の手札を1枚、山札の上に置く。各ターンに一度、クリーチャーが自分を攻撃する時、自分の山札の上から1枚を見てもよい。それが自分の手札の枚数以下のコストを持つカードなら、コストを支払わずに実行してもよい。実行しないなら、自分の手札に加える。", keywords:["wb"], evolution:{ neo:true, from:{ civs:["light","water","dark"] } }, costReduction:[{ condition:{ hasEvolutionBase:true }, value:-3 }], abilities:[{ trigger:"onPlay", effects:[{ op:"draw", count:3 }, { op:"toDeckTop", target:{ zone:"hand", owner:"self", count:1 } }] }, { trigger:"onAttacked", limit:"turn", condition:{ attackedTarget:"player" }, effects:[{ op:"chooseMode", prompt:"山札の上から1枚を見ますか？", modes:[{ label:"見る", effects:[{ op:"mecleid", count:1, costFrom:"hand", restTo:"hand", prompt:"コストを支払わずに実行しますか？" }] }, { label:"見ない", effects:[] }] }] }] },
    { id:"demo-147", name:"見張りの衛士", civs:["light"], cost:2, power:2000, type:"creature", races:["衛士"], text:"このクリーチャーが攻撃された時、カードを1枚引く。", keywords:[], abilities:[{ trigger:"onAttacked", condition:{ attackedTarget:"creature" }, effects:[{ op:"draw", count:1 }] }] },
    { id:"demo-148", name:"星団の巡査", civs:["water"], cost:4, power:4000, type:"creature", races:["星兵","星団"], text:"ギャラクシールド［水(2)］（このカードを使うコストのかわりに、水(2)を支払ってもよい。そうしたら、このカードを表向きにし、新しいシールドとしてシールドゾーンに置く）自分のターンのはじめに、このクリーチャーが表向きで自分のシールドゾーンにあれば、コストを支払ったものとして召喚する。このクリーチャーが表向きで自分のシールドゾーンに置かれた時、相手のコスト2以下のクリーチャーを1体選び、持ち主の手札に戻す。次の相手のターン中、相手はコスト2以下のクリーチャーを召喚できない。", keywords:["galaxyShield"], keywordArgs:{ galaxyShield:{ value:2, civ:"water" } }, abilities:[{ trigger:"turnStart", zone:"shields", condition:{ myTurn:true, selfFaceUp:true }, effects:[{ op:"summonSelf" }] }, { trigger:"onShieldAdded", condition:{ selfFaceUp:true }, effects:[{ op:"bounce", target:{ zone:"battle", owner:"opponent", filter:{ type:"creature", costMax:2 }, count:1 } }, { op:"floatEffect", turns:1, effect:{ op:"restrictSummon", who:"opponent", anyZone:true, filter:{ type:"creature", costMax:2 } } }] }] },
    { id:"demo-149", name:"死合の乱闘者", civs:["nature"], cost:3, power:4000, type:"creature", races:["巨人","刀兵"], text:"D・D・D［自然(2)］（自分のクリーチャーが攻撃する時、このカードを自然(2)支払って自分の手札から実行してもよい）NEO進化：光、火、または自然のクリーチャー1体の上に置いてもよい。このクリーチャーが、進化して出た時、または進化元になる時、自分の山札の上から4枚を見る。その中からクリーチャーを1体表向きにし、手札に加えてもよい。その後、残りを好きな順序で山札の下に置く。", keywords:["dDD"], keywordArgs:{ dDD:{ value:2, civ:"nature" } }, evolution:{ neo:true, from:{ civs:["light","fire","nature"] } }, abilities:[{ trigger:"onPlay", condition:{ underMin:1 }, effects:[{ op:"lookAndChoose", count:4, faceUp:true, restTo:"deck", max:1, filter:{ type:"creature" }, prompt:"手札に加えるクリーチャーを選んでください。" }] }, { trigger:"onBecomeBase", effects:[{ op:"lookAndChoose", count:4, faceUp:true, restTo:"deck", max:1, filter:{ type:"creature" }, prompt:"手札に加えるクリーチャーを選んでください。" }] }] },
    { id:"demo-150", name:"華謡の霊唱", civs:["light"], cost:4, power:5500, type:"creature", races:["魔天使"], text:"NEO進化：光、水、または自然のクリーチャー1体の上に置いてもよい。超魂レイド（このクリーチャーが出た時、山札の上から3枚を表向きにする。その中からこのクリーチャーの進化元になれるカードを1枚、この下に置いてもよい。残りを好きな順序で山札の下に置く）ブロッカー。このクリーチャーが出た時、相手のエレメントを1つ選び、シールド化してもよい。このクリーチャーが破壊された時、下にあったカードをすべて墓地から、自分の進化クリーチャー1体の下に置くか、表向きの1つのシールドとしてシールド化する。", keywords:["blocker"], evolution:{ neo:true, from:{ civs:["light","water","nature"] } }, abilities:[{ trigger:"onPlay", effects:[{ op:"soulRaid", count:3 }] }, { trigger:"onPlay", effects:[{ op:"toShield", target:{ zone:"battle", owner:"opponent", count:1, optional:true } }] }, { trigger:"onDestroy", effects:[{ op:"returnPastStack" }] }] },
    { id:"demo-151", name:"轟連合体の巨神", civs:["light","water","nature"], cost:9, power:14500, type:"creature", races:["連機兵","走竜"], text:"このクリーチャーの召喚コストを、進化元に含まれるカード1枚につき2少なくする。ただしコストは2以下にはならない。NEO進化：光、水、または自然のクリーチャー1体の上に置いてもよい。ブロッカー。マッハファイター。T・ブレイカー。このクリーチャーが出た時、このクリーチャーに含まれるカードの枚数まで、自分の山札の上からマナゾーンに置く。その後、カードを3枚まで自分のマナゾーンから手札に戻す。このクリーチャーが攻撃する時、このクリーチャーに含まれるカードが10枚以上あれば、自分はゲームに勝つ。", keywords:["blocker","machFighter","tb"], evolution:{ neo:true, from:{ civs:["light","water","nature"] } }, costReduction:[{ perBaseCard:-2, floor:2 }], abilities:[{ trigger:"onPlay", effects:[{ op:"declareNumber", min:0, maxFrom:{ selfStack:true }, prompt:"何枚をマナゾーンに置きますか？", then:[{ op:"manaBoost", count:"$declared", tapped:false }] }, { op:"bounce", target:{ zone:"mana", owner:"self", count:3, countMode:"upTo", optional:true } }] }, { trigger:"onAttack", condition:{ selfStackMin:10 }, effects:[{ op:"winGame" }] }] },
    { id:"demo-152", name:"打ち返しの妖精", civs:["water"], cost:2, power:1000, type:"creature", races:["精花"], text:"G・ストライク。ジャストダイバー。相手のクリーチャーが出た時、それが相手のマナゾーンにあるカードの枚数よりコストが大きいクリーチャーなら、持ち主の手札に戻してもよい。", keywords:["gStrike","justDiver"], abilities:[{ trigger:"onPlay", watch:{ filter:{ owner:"opponent", type:"creature", costOverZoneCount:{ zone:"mana" } } }, effects:[{ op:"chooseMode", prompt:"そのクリーチャーを持ち主の手札に戻しますか？", modes:[{ label:"手札に戻す", effects:[{ op:"bounce", target:{ watched:true } }] }, { label:"戻さない", effects:[] }] }] }] },
    { id:"demo-153", name:"星屑の案内人", civs:["light","fire","nature"], cost:3, power:3000, type:"creature", races:["夢獣"], text:"出た時、カードを1枚引く。その後、コスト3以下のクリーチャーを1体、自分の手札から出してもよい。このターン、そのクリーチャーに「スピードアタッカー」を与え、パワーを+3000する。", keywords:[], abilities:[{ trigger:"onPlay", effects:[{ op:"draw", count:1 }, { op:"summonTargets", target:{ zone:"hand", owner:"self", filter:{ type:"creature", costMax:3 }, count:1, optional:true } }, { op:"grantKeyword", target:{ lastTargets:true }, keyword:"sa", duration:"turn" }, { op:"powerMod", target:{ lastTargets:true }, value:3000, duration:"turn" }] }] },
    { id:"demo-154", name:"刀舞の三番手", civs:["light","water","fire"], cost:3, power:3500, type:"creature", races:["刀竜","革命隊"], text:"ブロッカー。出た時、次の中から2回選ぶ。（同じものを選んでもよい）▶相手のクリーチャーを1体選び、タップする。それが「ブロッカー」を持つなら、破壊する。▶カードを1枚引く。", keywords:["blocker"], abilities:[{ trigger:"onPlay", effects:[{ op:"chooseMode", count:2, allowRepeat:true, prompt:"使うモードを2つ選んでください。", modes:[{ label:"相手のクリーチャー1体をタップする（ブロッカーなら破壊する）", effects:[{ op:"tap", target:{ zone:"battle", owner:"opponent", filter:{ type:"creature" }, count:1 } }, { op:"destroy", target:{ lastTargets:true, filter:{ hasKeyword:"blocker" } } }] }, { label:"カードを1枚引く", effects:[{ op:"draw", count:1 }] }] }] }] },
    { id:"demo-155", name:"封蒸の写し身", civs:["water"], cost:3, power:5000, type:"creature", races:["写影","蒸機士"], text:"D・D・D［水(2)］（自分のクリーチャーが攻撃する時、このカードを水(2)支払って自分の手札から実行してもよい）NEO進化：光、水、または闇のクリーチャー1体の上に置いてもよい。このクリーチャーが出た時、カードを1枚引く。相手は、自身の山札を見れず、表向きにできない。", keywords:["dDD"], keywordArgs:{ dDD:{ value:2, civ:"water" } }, evolution:{ neo:true, from:{ civs:["light","water","dark"] } }, abilities:[{ trigger:"onPlay", effects:[{ op:"draw", count:1 }] }, { trigger:"static", effects:[{ op:"restrictDeckLook", who:"opponent" }] }] },
    { id:"demo-156", name:"水底の大貝", civs:["water"], cost:9, power:13000, type:"creature", races:["深海兵"], text:"T・ブレイカー。このクリーチャーが出た時、自分の墓地にあるカードをすべて山札に加え、シャッフルする。相手のターンのはじめに、カードを5枚引き、その後、自分の手札を3枚捨てる。自分の山札の最後の1枚を引く時、ゲームに負けるかわりに勝つ。", keywords:["tb"], abilities:[{ trigger:"onPlay", effects:[{ op:"toDeckBottom", target:{ zone:"graveyard", owner:"self", countMode:"all" } }, { op:"shuffleDeck" }] }, { trigger:"turnStart", condition:{ opponentTurn:true }, effects:[{ op:"draw", count:5 }, { op:"discard", target:{ zone:"hand", owner:"self", count:3 } }] }, { trigger:"static", effects:[{ op:"winInsteadOfDeckOut", who:"self" }] }] },
    { id:"demo-157", name:"轟腕の超化獣", civs:["nature"], cost:3, power:3000, type:"creature", races:["巨腕","超化獣"], text:"このクリーチャーが出た時、自分のシールドを1つマナゾーンに置く。Zラッシュ（シールドが離れたら、次の自分のターンのはじめまで、このクリーチャーのハイパーモードを解放する）【ハイパーモード】パワー6000／マッハファイター／W・ブレイカー／このクリーチャーの攻撃の終わりに、自分のマナゾーンにあるカードの枚数よりコストが小さい、進化ではないクリーチャーを1体、自分のマナゾーンから出してもよい。", keywords:["zRush"], abilities:[{ trigger:"onPlay", effects:[{ op:"shieldToMana", count:1, owner:"self" }] }], hyperMode:{ power:6000, keywords:["machFighter","wb"], abilities:[{ trigger:"afterAttack", effects:[{ op:"summonTargets", target:{ zone:"mana", owner:"self", filter:{ type:"creature", evolution:false, costUnderZoneCount:{ zone:"mana" } }, count:1, optional:true } }] }] } },
    { id:"demo-158", name:"俳歌の連竜", civs:["light","water","nature"], cost:3, power:3000, type:"creature", races:["魔詠竜"], text:"NEO進化：光、水、または自然のクリーチャー1体の上に置いてもよい。パワード・ブレイカー。このクリーチャーが攻撃する時、コスト4以下のクリーチャー以外のカードを1枚、自分の手札またはマナゾーンからコストを支払わずに実行してもよい。クリーチャー以外のカードを実行した時、このターン、このクリーチャーはブロックされず、パワーを+3000する。", keywords:["poweredBreaker"], evolution:{ neo:true, from:{ civs:["light","water","nature"] } }, abilities:[{ trigger:"onAttack", effects:[{ op:"castFrom", zone:["hand","mana"], anyType:true, optional:true, filter:{ costMax:4, not:{ type:"creature" } }, prompt:"コストを支払わずに実行するカードを選んでください。" }] }, { trigger:"onExecute", watch:{ filter:{ owner:"self", not:{ type:"creature" } } }, effects:[{ op:"grantKeyword", target:{ self:true }, keyword:"guard", duration:"turn" }, { op:"powerMod", target:{ self:true }, value:3000, duration:"turn" }] }] },
    { id:"demo-159", name:"創世の苗床竜", civs:["light","water","nature"], cost:3, power:3500, type:"creature", races:["魔詠竜"], text:"NEO進化：光、水、または自然のクリーチャー1体の上に置いてもよい。自分のタマシードを実行するコストを2少なくする。ただし、コストは0以下にはならない。自分のターン中、タマシードを1つ、自分のマナゾーンから実行してもよい。そうしたら、自分の山札の上から1枚をタップしてマナゾーンに置いてもよい。自分のタマシードが出た時、それを自分の進化クリーチャー1体の下に置いてもよい。", keywords:[], evolution:{ neo:true, from:{ civs:["light","water","nature"] } }, abilities:[{ trigger:"static", effects:[{ op:"costMod", who:"self", filter:{ type:"tamaseed" }, value:-2 }, { op:"playFromZone", zone:"mana", filter:{ type:"tamaseed" }, perTurn:1 }] }, { trigger:"onExecute", watch:{ filter:{ owner:"self", type:"tamaseed" } }, condition:{ executedFrom:"mana" }, effects:[{ op:"chooseMode", prompt:"山札の上から1枚をタップしてマナゾーンに置きますか？", modes:[{ label:"置く", effects:[{ op:"manaBoost", count:1, tapped:true }] }, { label:"置かない", effects:[] }] }] }, { trigger:"onPlay", watch:{ filter:{ owner:"self", type:"tamaseed" } }, effects:[{ op:"putUnder", prompt:"どのクリーチャーの下に置きますか？" }] }] },
    { id:"demo-160", name:"天秤の裁定", civs:["light"], cost:3, type:"spell", text:"S・トリガー。次のうちいずれかひとつを選ぶ。▶相手のクリーチャーを2体まで選び、タップする。▶自分のクリーチャーをすべてアンタップする。", keywords:["st"], abilities:[{ trigger:"onCast", effects:[{ op:"chooseMode", prompt:"どちらを使いますか？", modes:[{ label:"相手のクリーチャーを2体までタップする", effects:[{ op:"tap", target:{ owner:"opponent", filter:{ type:"creature" }, count:2, optional:true } }] }, { label:"自分のクリーチャーをすべてアンタップする", effects:[{ op:"untap", target:{ owner:"self", filter:{ type:"creature" }, countMode:"all" } }] }] }] }] },
    { id:"demo-161", name:"零れ人形", civs:["zero"], cost:0, power:-5000, type:"creature", races:["道化"], text:"（パワー0以下のクリーチャーは破壊される）", keywords:[], abilities:[] },
    { id:"demo-162", name:"深海の幻視", civs:["water"], cost:3, type:"tamaseed", races:["海竜"], text:"シンカライズ（このタマシードがクリーチャーであるかのように、この上に進化クリーチャーを置いてもよい）このタマシードが出た時、自分の山札の上から3枚を表向きにする。その中からクリーチャーとクリーチャーではないカードを最大1枚ずつ手札に加えてもよい。残りを好きな順序で山札の下に置く。超魂X（これがクリーチャーの下にあれば、そのクリーチャーにも以下の能力を与える）：このクリーチャーが攻撃する時、コスト4以下の、クリーチャーではないカードを1枚、自分の手札からコストを支払わずに実行してもよい。", keywords:["shinkaraize"], abilities:[{ trigger:"onPlay", effects:[{ op:"lookAndChoose", count:3, faceUp:true, restTo:"deck", groups:[{ filter:{ type:"creature" }, max:1, prompt:"手札に加えるクリーチャーを選んでください。" }, { filter:{ not:{ type:"creature" } }, max:1, prompt:"手札に加えるクリーチャー以外のカードを選んでください。" }] }] }], soulX:{ abilities:[{ trigger:"onAttack", effects:[{ op:"castFrom", zone:"hand", anyType:true, optional:true, filter:{ costMax:4, not:{ type:"creature" } }, prompt:"コストを支払わずに実行するカードを選んでください。" }] }] } },
    { id:"demo-163", name:"祝祭の心画", civs:["nature"], cost:3, type:"tamaseed", races:["道化","星越"], text:"シンカライズ（このタマシードがクリーチャーであるかのように、この上に進化クリーチャーを置いてもよい）このタマシードが出た時、プレイヤーを1人選ぶ。そのプレイヤーは自身の墓地をシャッフルし、山札の下に置く。シンカパワー：このタマシードが進化する時、自分の山札の上から2枚をマナゾーンにタップして置く。その後、カードを1枚、自分のマナゾーンから手札に戻す。", keywords:["shinkaraize"], abilities:[{ trigger:"onPlay", effects:[{ op:"chooseMode", prompt:"どちらのプレイヤーの墓地を山札の下に置きますか？", modes:[{ label:"自分", effects:[{ op:"toDeckBottom", shuffled:true, target:{ zone:"graveyard", owner:"self", countMode:"all" } }] }, { label:"相手", effects:[{ op:"toDeckBottom", shuffled:true, target:{ zone:"graveyard", owner:"opponent", countMode:"all" } }] }] }] }, { trigger:"onBecomeBase", effects:[{ op:"manaBoost", count:2, tapped:true }, { op:"bounce", target:{ zone:"mana", owner:"self", count:1 } }] }] },

    { id:"demo-188", name:"龍素記号 サイクロペ", civs:["water","dark"], cost:5, power:5000, type:"creature", races:["水晶竜","闇公"], text:"ブロッカー。ジャストダイバー。このクリーチャーが出た時、コスト4以下の呪文を1枚、自分の墓地からコストを支払わずに唱えてもよい。自分の手札から呪文を唱えた時、その呪文を自分の墓地からもう1度、コストを支払わずに唱えてもよい。この能力は各ターン1度しか使えない。自分の墓地から呪文を唱えた時、唱えた後で、墓地のかわりに山札の下に置く。", keywords:["blocker","justDiver"], abilities:[{ trigger:"onPlay", effects:[{ op:"castFrom", zone:"graveyard", optional:true, filter:{ type:"spell", costMax:4 }, prompt:"墓地から唱える呪文を選んでください。" }] }, { trigger:"onCast", watch:{ filter:{ owner:"self", type:"spell" } }, condition:{ executedFrom:"hand" }, limit:"turn", effects:[{ op:"castFrom", zone:"graveyard", watched:true, optional:true, filter:{ type:"spell" }, prompt:"その呪文をもう1度唱えますか？" }] }, { trigger:"static", effects:[{ op:"castAfterZone", who:"self", from:"graveyard", to:"deckBottom" }] }] },
    { id:"demo-189", name:"完璧団長 オーパ砲", civs:["water","dark"], cost:8, power:13000, type:"creature", races:["水晶竜","革命軍","燻製団"], text:"革命チェンジ：水または闇の、パワー8000以上のクリーチャー。ジャストダイバー。T・ブレイカー。カードがどこからでも相手の墓地に置かれた時、カードを1枚引いてもよい。ファイナル革命：このクリーチャーが「革命チェンジ」によって出た時、そのターンに他の「ファイナル革命」を使っていなければ、数字を1つ選ぶ。その数字と同じコストの相手のエレメントをすべて破壊する。次の自分のターンのはじめまで、相手はその数字と同じコストのカードを実行できない。", keywords:["revolutionChange","justDiver","tb"], keywordArgs:{ revolutionChange:{ from:{ civs:["water","dark"], powerMin:8000 } } }, abilities:[{ trigger:"onToGraveyard", watch:{ filter:{ owner:"opponent" } }, effects:[{ op:"chooseMode", prompt:"カードを1枚引きますか？", modes:[{ label:"引く", effects:[{ op:"draw", count:1 }] }, { label:"引かない", effects:[] }] }] }, { trigger:"onPlay", requireEnteredBy:"revolutionChange", limit:"turn", tag:"finalRevolution", effects:[{ op:"declareNumber", min:1, max:12, prompt:"数字を1つ選んでください。", then:[{ op:"destroy", target:{ zone:"battle", owner:"opponent", filter:{ costMin:"$declared", costMax:"$declared" }, countMode:"all" } }, { op:"floatEffect", turns:1, effect:{ op:"restrictPlay", who:"opponent", filter:{ costMin:"$declared", costMax:"$declared" } } }] }] }] },
    { id:"demo-122", name:"森の呼び声", civs:["nature"], cost:3, type:"spell", text:"S・トリガー。自分の山札を見る。その中からクリーチャーを1体選んで相手に見せ、手札に加えてもよい。その後、山札をシャッフルする。", keywords:["st"], abilities:[{ trigger:"onCast", effects:[{ op:"search", zone:"deck", filter:{ type:"creature" }, to:"hand" }] }] }
  ];

  engine.registerCardPool(cards, "demo");
}(globalThis));

(function defineValidators(global) {
  const engine = global.DMGame.engine;
  const OPS = new Set(["draw","discard","destroy","bounce","toMana","toDeckTop","toDeckBottom","toShield","summonFrom","summonTargets","summonSelf","castFrom","castFromShield","toCrest","crestToGraveyard","meteorBurn","addSeal","removeSeal","stay","search","manaBoost","manaCharge","revive","addShield","breakShield","shieldToHand","shieldToGraveyard","shieldToMana","revealShield","tap","untap","freeze","powerMod","grantKeyword","removeKeyword","addMark","battleWith","extraAttack","untapAfterAttack","redirectAttack","cancelAttack","costMod","restrictSummon","restrictPlay","restrictMove","restrictDeckLook","winInsteadOfDeckOut","restrictExtraTurn","castAfterZone","shuffleDeck","restrictAttack","restrictBlock","restrictSpell","restrictShieldTrigger","powerAura","keywordAura","manaAnyCiv","bindShieldForce","ignoreAbilitiesOfName","soulRaid","returnPastStack","putUnder","sequence","chooseMode","conditional","repeat","forEach","winGame","loseGame","extraTurn","lookAndPick","lookAndChoose","reveal","skipTurn","redirectSummon","gachinkoJudge","declareNumber","bakeCost","mecleid","exLifeToGraveyard","megaLastBurst","yobinion","smashBurst","floatEffect","delayedEffect","playFromZone","cantLose","revealHand","protectFromOpponent","custom"]);
  const TRIGGERS = new Set(["onPlay","onLeave","onDestroy","onToGraveyard","onAttack","afterAttack","onAttacked","onBlock","onBlocked","onBattleWin","onBecomeBase","onExecute","onShieldBroken","onShieldLeft","onShieldAdded","onManaLeave","beforeBreak","onCast","turnStart","turnEnd","onManaCharge","onFreePlay","onTap","static","replacement","activated"]);
  // キーワードの一覧は engine.KEYWORD_LABELS がただ一つの出どころ。
  // ここに書き写すと、片方だけ足したときに黙って通ってしまう。
  const KEYWORDS = new Set(Object.keys(engine.KEYWORD_LABELS));
  // 文明も同じく rules.js が唯一の出どころ。綴り違い（"darkness" など）は
  // どのフィルタにも一致しなくなるだけで例外にならず、黙って不発のカードになる。
  const CIVS = new Set(engine.RULES.CIVILIZATIONS);

  function walkEffects(effects, errors, cardId) {
    (effects || []).forEach(function validateEffect(effect) {
      if (!OPS.has(effect.op)) errors.push(`${cardId}: 未知のop ${effect.op}`);
      walkEffects(effect.steps, errors, cardId); walkEffects(effect.effects, errors, cardId); walkEffects(effect.then, errors, cardId); walkEffects(effect.else, errors, cardId);
      (effect.modes || []).forEach(function mode(item) { walkEffects(item.effects, errors, cardId); });
    });
  }

  function validateCardPool(cards) {
    const errors = [], ids = new Set();
    (cards || []).forEach(function validate(card) {
      if (card.type === "twinpact") {
        const faces = card.faces || [];
        if (faces.length !== 2) errors.push(`${card.id}: ツインパクトは面がちょうど2つ必要です（現在${faces.length}）。`);
        faces.forEach(function face(item, index) {
          ["name","civs","cost","type","text"].forEach(function required(key) {
            if (item[key] == null || item[key] === "") errors.push(`${card.id}: ${index + 1}面目に ${key} がありません。`);
          });
          if (item.type === "twinpact") errors.push(`${card.id}: 面をツインパクトにはできません。`);
          if (item.type === "creature" && typeof item.power !== "number") errors.push(`${card.id}: ${index + 1}面目のクリーチャーに power がありません。`);
          (item.civs || []).forEach(function civ(value) { if (!CIVS.has(value)) errors.push(`${card.id}: 未知のcivs ${value}`); });
          (item.keywords || []).forEach(function keyword(value) { if (!KEYWORDS.has(value)) errors.push(`${card.id}: 未知のkeyword ${value}`); });
          (item.abilities || []).forEach(function ability(value) { if (!TRIGGERS.has(value.trigger)) errors.push(`${card.id}: 未知のtrigger ${value.trigger}`); walkEffects(value.effects, errors, card.id); walkEffects(value.replaceWith, errors, card.id); });
        });
      }
      ["id","name","civs","cost","type","text"].forEach(function required(key) { if (card[key] == null || card[key] === "") errors.push(`${card.id || "(IDなし)"}: ${key} が必要です。`); });
      if (ids.has(card.id)) errors.push(`${card.id}: IDが重複しています。`); ids.add(card.id);
      if (card.type === "creature" && typeof card.power !== "number") errors.push(`${card.id}: クリーチャーにはpowerが必要です。`);
      if (card.type !== "twinpact" && card.faces) errors.push(`${card.id}: faces を持てるのは type:"twinpact" だけです。`);
      (card.civs || []).forEach(function civ(value) { if (!CIVS.has(value)) errors.push(`${card.id}: 未知のcivs ${value}`); });
      (card.keywords || []).forEach(function keyword(value) { if (!KEYWORDS.has(value)) errors.push(`${card.id}: 未知のkeyword ${value}`); });
      // 引数つきキーワードは値が無いと黙って効かなくなるため、未記入を検出する。
      engine.PARAMETERIZED_KEYWORDS.forEach(function needsArgs(keyword) {
        if ((card.keywords || []).indexOf(keyword) < 0) return;
        if (!card.keywordArgs || card.keywordArgs[keyword] == null) errors.push(`${card.id}: ${keyword} には keywordArgs が必要です。`);
      });
      Object.keys(card.keywordArgs || {}).forEach(function unusedArgs(keyword) {
        if ((card.keywords || []).indexOf(keyword) < 0) errors.push(`${card.id}: keywordArgs.${keyword} に対応するkeywordがありません。`);
      });
      (card.abilities || []).forEach(function ability(value) { if (!TRIGGERS.has(value.trigger)) errors.push(`${card.id}: 未知のtrigger ${value.trigger}`); walkEffects(value.effects, errors, card.id); walkEffects(value.replaceWith, errors, card.id); });
    });
    return { valid:errors.length === 0, errors };
  }

  function validateDeck(deck) {
    const errors = [], counts = {};
    if (!Array.isArray(deck) || deck.length !== engine.RULES.DECK_SIZE) errors.push(`デッキは40枚ちょうどにしてください（現在${Array.isArray(deck) ? deck.length : 0}枚）。`);
    (deck || []).forEach(function count(defId) { counts[defId] = (counts[defId] || 0) + 1; if (!engine.CARD_INDEX[defId]) errors.push(`未登録カードです: ${defId}`); });
    Object.keys(counts).forEach(function copies(defId) { if (counts[defId] > engine.RULES.MAX_COPIES) errors.push(`${engine.CARD_INDEX[defId] ? engine.CARD_INDEX[defId].name : defId}は4枚までです。`); });
    return { valid:errors.length === 0, errors };
  }

  engine.ALLOWED_OPS = OPS;
  engine.ALLOWED_KEYWORDS = KEYWORDS;
  engine.validateCardPool = validateCardPool;
  engine.validateDeck = validateDeck;
}(globalThis));

(function defineDescribers(global) {
  const engine = global.DMGame.engine;

  // カードに書かれた文章は「原文」であって、このエンジンが実際に何をするかとは別物。
  // ここでは能力の定義（op と条件）から処理内容を組み立てて日本語にする。
  // キーワード能力はバッジで別に出しているので、ここでは扱わない。
  //
  // ⚠ 表示のための文字列を作るだけで、状態には触らない。
  //    未知の op も黙って消さず、op 名を出して「実装が追いついていない」ことを見せる。

  const TRIGGER_LABELS = {
    onPlay: "出た時",
    onCast: "唱えた時",
    onAttack: "攻撃する時",
    afterAttack: "攻撃の後",
    onAttacked: "攻撃された時",
    onBlock: "ブロックした時",
    onBlocked: "ブロックされた時",
    onBattleWin: "バトルに勝った時",
    onDestroy: "破壊された時",
    onToGraveyard: "どこからでも墓地に置かれた時",
    onLeave: "離れた時",
    onBecomeBase: "進化元になる時",
    onTap: "タップした時",
    onExecute: "カードを実行した時",
    onShieldBroken: "シールドがブレイクされた時",
    onShieldAdded: "シールドゾーンにカードが置かれた時",
    onManaCharge: "マナゾーンに置かれた時",
    onManaLeave: "カードがマナゾーンを離れた時",
    onFreePlay: "マナをタップせずにカードが使われた時",
    turnStart: "ターンのはじめに",
    turnEnd: "ターンの終わりに",
    beforeBreak: "ブレイクの前に",
    activated: "使う時",
    static: "常に",
    replacement: "かわりに"
  };

  // 他人のカードを見張る能力は、主語を補わないと「相手の出た時」のような
  // 意味の取れない文になる。イベントごとに主語込みの言い方を用意する。
  const WATCH_LABELS = {
    onPlay: function onPlay(who) { return `${who}のエレメントが出た時`; },
    onCast: function onCast(who) { return `${who}が呪文を唱えた時`; },
    onDestroy: function onDestroy(who) { return `${who}のカードが破壊された時`; },
    onLeave: function onLeave(who) { return `${who}のカードが離れた時`; },
    onShieldAdded: function onShieldAdded(who) { return `${who}のシールドゾーンにカードが置かれた時`; },
    onManaCharge: function onManaCharge(who) { return `${who}のマナゾーンにカードが置かれた時`; },
    onManaLeave: function onManaLeave(who) { return `カードが${who}のマナゾーンを離れた時`; }
  };

  // 置き換え能力が横取りするできごと。破壊とゾーン移動は別々に登録するが、
  // 遊ぶ側から見ればどちらも「離れる」ひとつのできごとなので、同じ言葉にする。
  const EVENT_LABELS = {
    destroy: "離れる",
    moveZone: "離れる",
    shieldBreak: "シールドをブレイクする"
  };

  const ZONE_LABELS = {
    battle: "バトルゾーン",
    hand: "手札",
    mana: "マナゾーン",
    graveyard: "墓地",
    deck: "山札",
    shields: "シールドゾーン",
    special: "特殊ゾーン"
  };

  function civLabel(civ) { return engine.CIV_LABELS[civ] || civ; }
  function keywordLabel(keyword) { return engine.KEYWORD_LABELS[keyword] || keyword; }
  function ownerLabel(owner) { return owner === "opponent" ? "相手" : "自分"; }

  // クリーチャーは「体」、それ以外は「枚」。数え方が合っていないと読み手が身構える。
  function counterWord(filter) { return filter && filter.type === "creature" ? "体" : "枚"; }

  function joinParts(parts, separator) {
    return parts.filter(Boolean).join(separator == null ? "" : separator);
  }

  // 効果に期限があるなら、それを言わないと説明として足りない。
  // turn はそのカードの持ち主の次のターンのはじめ、untilMyNextTurn は
  // 効果を使った側の次のターンのはじめで切れる（actions.startTurn）。
  function durationLabel(duration) {
    if (!duration || duration === "permanent") return "";
    if (duration === "turn") return "次の自分のターンのはじめまで";
    // 相手のクリーチャーにも貼るので、「自分」がどちらを指すかを言い切る。
    if (duration === "untilMyNextTurn") return "この効果を使った側の次のターンのはじめまで";
    return String(duration);
  }

  // 「相手のコスト5以下のクリーチャー」のような、対象の言い表し方。
  function describeFilter(filter, defaultNoun) {
    if (!filter) return defaultNoun || "カード";
    const parts = [];
    if (filter.owner === "self") parts.push("自分の");
    if (filter.owner === "opponent") parts.push("相手の");
    if (filter.civs) parts.push(`${filter.civs.map(civLabel).join("か")}の`);
    if (filter.civsMin >= 2) parts.push("多色の");
    if (filter.evolution === true) parts.push("進化した");
    if (filter.neo === true) parts.push("NEO進化の");
    if (filter.evolution === false) parts.push("進化ではない");
    if (filter.races) parts.push(`${filter.races.join("か")}の`);
    if (filter.raceIncludes) parts.push(`「${filter.raceIncludes.join("」「")}」を含む`);
    if (filter.costMin != null) parts.push(`コスト${filter.costMin}以上の`);
    if (filter.costMax != null) parts.push(`コスト${filter.costMax}以下の`);
    if (filter.costMaxRef) parts.push("そのカード以下のコストの");
    if (filter.costOverZoneCount) parts.push(`${ZONE_LABELS[filter.costOverZoneCount.zone || "mana"]}の枚数よりコストが大きい`);
    if (filter.costUnderZoneCount) parts.push(`${ZONE_LABELS[filter.costUnderZoneCount.zone || "mana"]}の枚数よりコストが小さい`);
    if (filter.powerMin != null) parts.push(`パワー${filter.powerMin}以上の`);
    if (filter.powerMax != null) parts.push(`パワー${filter.powerMax}以下の`);
    if (filter.mark) parts.push("印のついた");
    if (filter.hasKeyword) parts.push(`「${keywordLabel(filter.hasKeyword)}」を持つ`);
    if (filter.hasTrigger) parts.push(`「${TRIGGER_LABELS[filter.hasTrigger] || filter.hasTrigger}」の能力を持つ`);
    if (filter.tapped === true) parts.push("タップされた");
    if (filter.tapped === false) parts.push("アンタップされた");
    if (filter.enteredThisTurn === true) parts.push("このターン出た");
    if (filter.not) parts.push(`${describeFilter(filter.not)}以外の`);
    const TYPE_NOUNS = { creature:"クリーチャー", spell:"呪文", tamaseed:"タマシード", castle:"城" };
    // 「クリーチャー1体またはタマシードを1枚」。並べた種類をそのまま「または」でつなぐ。
    if (filter.types) parts.push(filter.types.map(function noun(type) { return TYPE_NOUNS[type] || type; }).join("または"));
    else parts.push(TYPE_NOUNS[filter.type] || defaultNoun || "カード");
    return joinParts(parts);
  }

  // 誰の・どのゾーンの・何枚の、の順に並べる。持ち主を先に言わないと
  // 「手札の1枚までの自分の…」のように主語が迷子になる。
  function describeTarget(target, fallback) {
    if (!target) return fallback || "";
    if (target.self) return "このカード";
    // 直前の効果が選んだ相手を指す。指し先の種類だけは filter が持っている。
    if (target.lastTargets) return target.filter && target.filter.type === "creature" ? "そのクリーチャー" : "そのカード";
    const filter = Object.assign({}, target.filter || {});
    const owner = target.owner || filter.owner;
    delete filter.owner;
    const ownerText = owner ? `${ownerLabel(owner)}の` : "";
    const zone = target.zone && target.zone !== "battle"
      ? `${[].concat(target.zone).map(function label(name) { return ZONE_LABELS[name] || name; }).join("か")}の`
      : "";
    const unit = counterWord(filter);
    const amount = target.countMode === "all"
      ? "すべての"
      : (target.count > 1
        ? `${target.count}${unit}${target.optional ? "まで" : ""}の`
        : (target.optional ? `1${unit}までの` : ""));
    return `${ownerText}${zone}${amount}${describeFilter(filter)}`;
  }

  function describeCondition(condition) {
    if (!condition) return "";
    const parts = [];
    if (condition.myTurn) parts.push("自分のターン中");
    if (condition.opponentTurn) parts.push("相手のターン中");
    if (condition.manaCiv) parts.push(`マナゾーンに${civLabel(condition.manaCiv.civ)}が${condition.manaCiv.min || 1}枚以上あれば`);
    if (condition.manaMin != null) parts.push(`マナが${condition.manaMin}枚以上あれば`);
    if (condition.shieldsMin != null) parts.push(`シールドが${condition.shieldsMin}つ以上あれば`);
    if (condition.shieldsMax != null) parts.push(`シールドが${condition.shieldsMax}つ以下なら`);
    if (condition.handMin != null) parts.push(`手札が${condition.handMin}枚以上あれば`);
    if (condition.graveyardMin != null) parts.push(`墓地が${condition.graveyardMin}枚以上あれば`);
    if (condition.battle) parts.push(`${describeFilter(condition.battle.filter)}が${condition.battle.min || 1}体以上いれば`);
    if (condition.zoneMatching) {
      const spec = condition.zoneMatching;
      parts.push(`${ownerLabel(spec.owner)}の${ZONE_LABELS[spec.zone] || spec.zone}に${describeFilter(spec.filter)}が${spec.min || 1}${counterWord(spec.filter)}以上あれば`);
    }
    if (condition.zoneCompare) parts.push(`${describeFilter(condition.zoneCompare.filter)}の数が相手より多ければ`);
    if (condition.shieldsMoreThanOpponent) parts.push("自分のシールドが相手より多ければ");
    if (condition.shieldsBrokenThisTurn) parts.push(`そのターン${ownerLabel(condition.shieldsBrokenThisTurn.owner)}のシールドが${condition.shieldsBrokenThisTurn.min || 1}つ以上ブレイクされていれば`);
    if (condition.freePlaysThisTurn) parts.push("相手がそのターン、マナをタップせずにカードを出していれば");
    if (condition.lastTargetsMin) parts.push("そうした場合");
    if (condition.selfMark === "viaDDD") parts.push("この呪文を「D・D・D」で唱えたなら");
    else if (condition.selfMark) parts.push("印がついていれば");
    if (condition.entriesThisTurn) parts.push(`そのターン、${condition.entriesThisTurn.owner ? `${ownerLabel(condition.entriesThisTurn.owner)}の` : ""}クリーチャーが${condition.entriesThisTurn.min || 1}体以上出ていれば`);
    if (condition.attacksThisTurn) {
      const spec = condition.attacksThisTurn;
      parts.push(spec.min === spec.max
        ? `その攻撃がこのターン${spec.min}度目の攻撃であれば`
        : `そのターン${ownerLabel(spec.owner)}が${spec.min || 1}回以上攻撃していれば`);
    }
    if (condition.lastLooked) parts.push(`それが${describeFilter(condition.lastLooked.filter)}なら`);
    if (condition.selfEvolved === true) parts.push("このクリーチャーが進化していれば");
    if (condition.selfPowerMin != null) parts.push(condition.selfPowerMin === 1 ? "そのパワーが0より大きければ" : `そのパワーが${condition.selfPowerMin}以上なら`);
    if (condition.underMin != null) parts.push(`下にカードが${condition.underMin}枚以上あれば`);
    if (condition.absentSelfName) parts.push("同じ名前のクリーチャーがバトルゾーンになければ");
    if (condition.not) parts.push(`${describeCondition(condition.not)}のときを除き`);
    return parts.join("、");
  }

  // subject は「対象を書かない効果が、何を指しているか」。forEach の中など、
  // 外側で選んだカードを指し続ける場面で使う。
  function describeEffect(effect, subject) {
    if (!effect || !effect.op) return "";
    const target = describeTarget(effect.target, subject);
    const it = target || subject || "このクリーチャー";
    const count = effect.count == null ? 1 : effect.count;
    switch (effect.op) {
      case "draw": return `カードを${count}枚${effect.upTo ? "まで" : ""}引く`;
      case "manaBoost": return `山札の上から${count}枚を${effect.tapped === false ? "" : "タップして"}マナゾーンに置く`;
      case "destroy": return `${target}を破壊する`;
      case "bounce": return `${target}を持ち主の手札に戻す`;
      case "toMana": return `${target}を持ち主のマナゾーンに置く`;
      case "discard": return `${target}を墓地に置く`;
      case "toShield": return `${target}を${effect.faceUp ? "表向きで" : ""}持ち主のシールドゾーンに置く`;
      case "toDeckTop": return `${target}を山札の一番上に置く`;
      case "toDeckBottom": return `${target}を山札の一番下に置く`;
      case "manaCharge": return `${target}をタップしてマナゾーンに置く`;
      case "tap": return `${target}をタップする`;
      case "untap": return `${target}をアンタップする`;
      case "freeze": return `${target}をタップし、次のターンもアンタップさせない`;
      case "powerMod": return `${it}のパワーを${effect.value >= 0 ? "+" : ""}${effect.value}する`;
      case "powerAura": {
        const who = effect.filter && effect.filter.self ? "このクリーチャー" : describeFilter(effect.filter, "クリーチャー");
        const fixed = effect.value ? `${effect.value >= 0 ? "+" : ""}${effect.value}` : "";
        if (!effect.valuePer) return `${who}のパワーを${fixed}する`;
        const spec = effect.valuePer;
        const zone = ZONE_LABELS[[].concat(spec.zone || "battle")[0]];
        return `${ownerLabel(spec.owner)}の${zone}にある${describeFilter(spec.filter, "カード")}1枚につき、${who}のパワーを+${spec.value}する`;
      }
      case "grantKeyword": return `${it}に「${keywordLabel(effect.keyword)}」を与える`;
      case "removeKeyword": return `${it}から「${keywordLabel(effect.keyword)}」を取り除く`;
      case "addShield": return `${effect.from === "hand" ? "手札" : "山札の上"}から${count}枚をシールド化する`;
      case "breakShield": return `${effect.owner === "self" ? "自分" : "相手"}のシールドを${count}つブレイクする`;
      case "shieldToHand": return `${ownerLabel(effect.owner)}のシールドを${count}つ手札に加える（S・トリガーは使えない）`;
      case "shieldToMana": return `${ownerLabel(effect.owner)}のシールドを${count}つマナゾーンに置く（S・トリガーは使えない）`;
      case "shieldToGraveyard": return `${ownerLabel(effect.owner)}のシールドを${count}つ墓地に置く（S・トリガーは使えない）`;
      case "revealShield": return `${ownerLabel(effect.owner)}のシールドを${count}枚表向きにする`;
      case "summonFrom": return `${ZONE_LABELS[effect.zone] || "墓地"}から${describeFilter(effect.filter)}を${count}体出す`;
      case "summonTargets": return `${target}を出す${effect.totalCostMax != null ? `（コストの合計${effect.totalCostMax}以下）` : ""}`;
      case "summonSelf": return "このクリーチャーをコストを支払わずに召喚する";
      case "revive": return `墓地から${describeFilter(effect.filter)}を${count}体出す`;
      case "castFrom": return `${ZONE_LABELS[effect.zone] || "墓地"}から${describeFilter(effect.filter)}をコストを支払わずに唱える`;
      case "search": return `${ZONE_LABELS[effect.zone] || "山札"}から${describeFilter(effect.filter)}を${ZONE_LABELS[effect.to] || "手札"}に加える`;
      case "lookAndPick": {
        const to = ZONE_LABELS[effect.to] || "手札";
        const rest = ZONE_LABELS[effect.restTo] || "山札";
        const which = effect.filter ? describeFilter(effect.filter) : `上から${effect.pick || 1}枚`;
        const budget = effect.totalCostMax != null ? `（コストの合計${effect.totalCostMax}以下）` : "";
        return `山札の上から${count}枚を見て、${which}を${to}へ${budget}、残りを${rest}へ置く`;
      }
      case "reveal": return `${ZONE_LABELS[effect.zone] || "山札"}の${count}枚を表向きにする`;
      case "toCrest": return `${effect.from === "deck" ? "山札の上から1枚" : target}を表向きにしてシールドの上に置く`;
      case "meteorBurn": {
        const limit = effect.count == null ? "好きな数" : `${effect.count}枚`;
        const tail = effect.then ? `。こうして墓地に置いたカード1枚につき、${describeEffectList(effect.then, subject).filter(Boolean).join("、")}` : "";
        return `このクリーチャーの下にあるカードを${limit}選び、墓地に置く${tail}`;
      }
      case "crestToGraveyard": return "シールドゾーンにある表向きのカードを1枚選び、墓地に置く";
      case "battleWith": return `${effect.attackerFromCtx ? "そのクリーチャー" : "このクリーチャー"}と${target}をバトルさせる`;
      case "extraAttack": return `${target}をもう1度攻撃できるようにする`;
      case "untapAfterAttack": return `${target}を、このターン最初の攻撃の終わりにアンタップする`;
      case "redirectAttack": return "攻撃先を変更する";
      case "cancelAttack": return "攻撃を取りやめる";
      case "extraTurn": return `${ownerLabel(effect.who)}のターンを追加する`;
      case "skipTurn": return "ターンの残りをとばす";
      case "winGame": return "ゲームに勝つ";
      case "loseGame": return "ゲームに負ける";
      case "addMark": return `${target}に印を付ける`;
      case "gachinkoJudge": return "ガチンコ・ジャッジをする（おたがい山札の上を表向きにし、コストが大きいほうが勝ち）";
      case "stay": return "離れない";
      case "exLifeToGraveyard": return "このクリーチャーのシールドを1つ墓地に置く";
      case "mecleid": return `山札の上から3枚を見て、その中から${describeFilter(effect.filter, "カード")}を1枚、コストを支払わずに使ってもよい（コスト${effect.value}以下）。残りを山札の下に置く`;
      case "costMod": {
        const where = effect.zone ? `${ZONE_LABELS[effect.zone] || effect.zone}にある` : "";
        // valuePer は「◯◯1つにつき」。固定の増減が0でも、こちらだけで意味を持つ。
        const per = effect.valuePer
          ? `${describeFilter(Object.assign({ owner:effect.valuePer.owner }, effect.valuePer.filter))}1つにつき${Math.abs(effect.valuePer.value || 0)}${(effect.valuePer.value || 0) < 0 ? "少なく" : "多く"}する`
          : "";
        const flat = (effect.value || 0) !== 0 || !per
          ? `${Math.abs(effect.value || 0)}${(effect.value || 0) < 0 ? "少なく" : "多く"}する`
          : "";
        return `${ownerLabel(effect.who)}の${where}${describeFilter(effect.filter)}のコストを${flat && per ? `${flat}。さらに${per}` : (flat || per)}${effect.oncePerTurn ? "（各ターン1度）" : ""}`;
      }
      case "restrictSummon": {
        if (effect.maxPerTurn != null) return `${ownerLabel(effect.who)}は各ターン${effect.maxPerTurn}体しかクリーチャーを出せない`;
        if (effect.playedOnly) return `${ownerLabel(effect.who)}の${describeFilter(effect.filter, "エレメント")}は、実行以外の方法で出ない`;
        return `${ownerLabel(effect.who)}は手札以外からエレメントを出せない`;
      }
      case "restrictPlay": return `${ownerLabel(effect.who)}は各ターン合計${effect.maxPerTurn}回までしか、クリーチャーを召喚したり呪文を唱えたりできない`;
      case "putUnder": return "そのカードを自分の進化クリーチャー1体の下に置く";
      case "soulRaid": return `山札の上から${effect.count == null ? 3 : effect.count}枚を表向きにし、その中から進化元になれるカードを1枚この下に置いてもよい`;
      case "returnPastStack": return "下にあったカードをすべて墓地から、自分の進化クリーチャーの下に置くか、表向きの1つのシールドにする";
      case "ignoreAbilitiesOfName": return "クリーチャーの名前を1つ選び、その名前を持つクリーチャーの能力をすべて無視する";
      case "bindShieldForce": return "「シールド・フォース」で束ねるシールドを選ぶ";
      case "manaAnyCiv": return `自分が${describeFilter(effect.filter)}を実行する時、マナゾーンのカードをすべての文明を持つかのようにタップできる`;
      case "keywordAura": return `${describeTarget({ filter:effect.filter }, "カード")}に「${keywordLabel(effect.keyword)}」を与える`;
      case "restrictDeckLook": return `${ownerLabel(effect.who)}は、自身の山札を見れず、表向きにできない`;
      case "winInsteadOfDeckOut": return `${ownerLabel(effect.who)}は、山札の最後の1枚を引く時、ゲームに負けるかわりに勝つ`;
      case "shuffleDeck": return `${ownerLabel(effect.owner)}の山札をシャッフルする`;
      case "restrictMove": {
        const zoneList = function zoneList(zones) { return (zones || []).map(function label(name) { return ZONE_LABELS[name] || name; }).join("と"); };
        const from = effect.from ? `${zoneList(effect.from)}にある` : "";
        const to = effect.to ? `${zoneList(effect.to)}に` : "他のゾーンに";
        return `${effect.who === "any" ? "" : `${ownerLabel(effect.who)}の`}${from}${describeFilter(effect.filter)}は、${to}置けない`;
      }
      case "restrictAttack": return `${ownerLabel(effect.who)}の${describeFilter(effect.filter, "クリーチャー")}は攻撃できない`;
      case "restrictBlock": return `${ownerLabel(effect.who)}の${describeFilter(effect.filter, "クリーチャー")}はブロックできない`;
      case "restrictSpell": return effect.maxPerTurn != null
        ? `${ownerLabel(effect.who)}は各ターン${effect.maxPerTurn}回しか呪文を唱えられない`
        : `${ownerLabel(effect.who)}は${describeFilter(effect.filter, "呪文")}を唱えられない`;
      case "revealHand": return `${ownerLabel(effect.who)}は手札を表向きにしてプレイする`;
      case "restrictShieldTrigger": return `${effect.who === "any" ? "誰も" : `${ownerLabel(effect.who)}は`}「S・トリガー」を使えない`;
      case "redirectSummon": {
        // どこから出た場合が対象かは、この能力のいちばん大事なところ。
        // 「かわりに」だけ書いて出所を落とすと、条件の違う別々のカードが同じ文になる。
        const who = effect.who === "any" ? "" : `${ownerLabel(effect.who)}の`;
        const from = (effect.except || []).indexOf("hand") >= 0 ? "手札以外から" : "";
        return `${who}${describeFilter(effect.filter, "カード")}が${from}バトルゾーンに出る時、かわりに${ZONE_LABELS[effect.to] || "マナゾーン"}に置く`;
      }
      case "playFromZone": return `自分のターン中、${ZONE_LABELS[effect.zone] || "マナゾーン"}から${describeFilter(effect.filter)}を${effect.perTurn == null ? 1 : effect.perTurn}体${effect.free ? "コストを支払わずに" : ""}召喚できる`;
      case "cantLose": return effect.exceptAttack ? "攻撃される以外の方法でゲームに負けない" : "ゲームに負けない";
      case "restrictPlay": return effect.filter
        ? `${ownerLabel(effect.who)}は${describeFilter(effect.filter)}を実行できない`
        : `${ownerLabel(effect.who)}は各ターン${effect.maxPerTurn}回までしか召喚も呪文もできない`;
      case "restrictExtraTurn": return `${ownerLabel(effect.who)}はターンを追加できない`;
      case "castAfterZone": return `${ownerLabel(effect.who)}が${ZONE_LABELS[effect.from] || effect.from}から唱えた呪文は、唱えた後、墓地のかわりに${effect.to === "deckBottom" ? "山札の下" : (effect.to === "deckTop" ? "山札の上" : (ZONE_LABELS[effect.to] || effect.to))}に置く`;
      case "protectFromOpponent": return `自分の${describeFilter(effect.filter, "クリーチャー")}は相手のカードの効果によって離れない`;
      case "floatEffect": {
        const inner = effect.effects ? describeEffectList(effect.effects, subject) : [describeEffect(effect.effect, subject)];
        return `次の自分のターンのはじめまで、${inner.filter(Boolean).join("、かつ")}`;
      }
      case "delayedEffect": {
        const when = effect.turns ? `${effect.turns}ターン後の終わりに` : "このターンの終わりに";
        return `${when}、${describeEffectList(effect.effects, subject).filter(Boolean).join("、その後、")}`;
      }
      case "sequence": return describeEffectList(effect.steps, subject).join("、その後、");
      case "repeat": {
        const body = describeEffectList(effect.effects, subject).join("、");
        if (!effect.timesFrom) return `${effect.times}回、${body}`;
        const spec = effect.timesFrom;
        if (spec.selfStack) return `このクリーチャーに含まれるカード1枚につき、${body}`;
        return `${ownerLabel(spec.owner)}の${ZONE_LABELS[[].concat(spec.zone || "battle")[0]]}のカード1枚につき、${body}`;
      }
      case "forEach": {
        // 選んだカードを、続く効果がそのまま指す。指す先を言葉にしないと
        // 「自分のクリーチャーについて、をアンタップする」のような文になる。
        const noun = effect.target && effect.target.filter && effect.target.filter.type === "creature" ? "そのクリーチャー" : "そのカード";
        return `${target}を選び、${describeEffectList(effect.effects, noun).join("、")}`;
      }
      case "conditional": {
        const when = describeCondition(effect.if);
        const then = describeEffectList(effect.then, subject).join("、");
        const other = describeEffectList(effect.else, subject).join("、");
        return joinParts([when ? `${when}、` : "", then, other ? `そうでなければ${other}` : ""]);
      }
      case "chooseMode": return `次から選ぶ：${(effect.modes || []).map(function mode(item, index) {
        return item.label || `モード${index + 1}`;
      }).join(" ／ ")}`;
      case "custom": return `特殊な処理（${effect.fn}）`;
      default: return `${effect.op}`;
    }
  }

  // 期限つきの効果が続くときは、期限をまとめて先に言う。
  // 一つずつに「次の自分のターンのはじめまで」を付けると、読める文にならない。
  function describeEffectList(effects, subject) {
    const items = [];
    let run = null;
    let runDuration = null;
    const flush = function flush() {
      if (!run) return;
      items.push(runDuration ? `${runDuration}、${run.join("、")}` : run.join("、"));
      run = null;
      runDuration = null;
    };
    (effects || []).forEach(function each(effect) {
      const text = describeEffect(effect, subject);
      if (!text) return;
      const duration = durationLabel(effect && effect.duration);
      if (run && duration === runDuration) { run.push(text); return; }
      flush();
      run = [text];
      runDuration = duration;
    });
    flush();
    return items;
  }

  // 置き換え能力は「何が起きる時、かわりにどうなるか」で読む。
  // 「かわりに：」とだけ書くと、何のかわりなのかが落ちる。
  function describeReplacement(ability) {
    // ブレイクの肩代わりは、置換の中身を書かずに「そういう能力を持つ」ことだけを
    // 宣言する（実際の差し替えはブレイク処理側が行う）。説明はここで補う。
    if (ability.event === "shieldBreak") {
      return "相手のクリーチャーがシールドをブレイクする時、かわりにこのシールドをブレイクさせてもよい";
    }
    const match = ability.match || {};
    const subject = match.self ? "このカード" : describeTarget({ filter:match.filter }, "このカード");
    const when = EVENT_LABELS[ability.event] || ability.event;
    // 「離れない」は結果であって処理ではない。他の処理と並べず、注記として添える。
    const steps = (ability.replaceWith || []).filter(function real(effect) { return effect && effect.op !== "stay"; });
    const stays = (ability.replaceWith || []).length !== steps.length;
    const body = describeEffectList(steps).join("、");
    const head = `${subject}が${when}時、かわりに`;
    if (!body) return `${head}何も起きない（離れない）`;
    return `${head}${ability.optional ? "次のようにしてもよい：" : ""}${body}${stays ? "（そのカードは離れない）" : ""}`;
  }

  // 能力1つを「いつ・条件・なにをする」に分ける。分けたまま返すのは、
  // 同じ能力を複数のイベントに分けて登録したものを1文に戻すため。
  function abilityParts(ability) {
    if (!ability) return null;
    if (ability.trigger === "replacement") {
      const line = describeReplacement(ability);
      return line ? { when:"", condition:"", body:line, limit:"", tag:null, kind:"plain" } : null;
    }
    const condition = describeCondition(ability.condition);
    const limit = ability.limit === "game" ? "（ゲームに1度）" : (ability.limit === "turn" ? "（各ターン1度）" : "");
    const body = describeEffectList(ability.effects).join("、");
    if (!body) return null;
    if (ability.trigger === "static") {
      return { when:"", condition:condition, body:body, limit:limit, tag:ability.tag || null, kind:"static" };
    }
    const watchFilter = (ability.watch && ability.watch.filter) || null;
    const watchOnlyOwner = watchFilter && Object.keys(watchFilter).length === 1 && watchFilter.owner;
    const entry = ability.requireEnteredBy === "revolutionChange" ? "革命チェンジで" : (ability.requireEnteredBy === "invasion" ? "侵略で" : "");
    let when = `${entry}${TRIGGER_LABELS[ability.trigger] || ability.trigger}`;
    if (watchOnlyOwner && WATCH_LABELS[ability.trigger]) when = WATCH_LABELS[ability.trigger](ownerLabel(watchFilter.owner));
    else if (watchFilter) when = `${describeFilter(watchFilter)}が${when}`;
    return { when:when, condition:condition, body:body, limit:limit, tag:ability.tag || null, kind:"trigger" };
  }

  function composeAbility(part) {
    if (!part) return "";
    if (part.kind !== "trigger") return joinParts([part.condition ? `${part.condition}、` : "", part.body, part.limit]);
    return joinParts([part.when, part.condition ? `（${part.condition}）` : "", "：", part.body, part.limit]);
  }

  function describeAbility(ability) {
    return composeAbility(abilityParts(ability));
  }

  // 同じ tag を共有し、条件も処理も同じ能力は、原文では1つの能力。
  // イベントごとに分けて登録しているだけなので、説明では「または」でつなぐ。
  function mergeParts(parts) {
    const merged = [];
    parts.forEach(function each(part) {
      const previous = merged[merged.length - 1];
      const sameAbility = previous && part.tag && previous.tag === part.tag && previous.kind === part.kind
        && previous.body === part.body && previous.condition === part.condition && previous.limit === part.limit;
      if (sameAbility) {
        if (previous.when.indexOf(part.when) < 0) previous.when = `${previous.when}、または${part.when}`;
        return;
      }
      merged.push(Object.assign({}, part));
    });
    return merged;
  }

  // キーワードでない能力の説明だけを並べて返す。
  // ハイパーモードと超魂Xの欄も、そこに書かれている能力として一緒に出す。
  function describeAbilities(definition) {
    if (!definition) return [];
    if (definition.faces) {
      return definition.faces.reduce(function eachFace(all, face) {
        return all.concat(describeAbilities(face).map(function label(line) { return `【${face.name}】${line}`; }));
      }, []);
    }
    const lines = [];
    // 常に効いているもの（コストの軽減、自分に与えるキーワード）は原文でも先に書かれる。
    // 読む順を原文と揃えておくと、照らし合わせるときに迷わない。
    (definition.costReduction || []).forEach(function reduction(entry) {
      if (entry.per) lines.push(`${describeFilter(entry.per.filter)}1体につき、このカードのコストを${Math.abs(entry.value || 0)}少なくする`);
      else lines.push(`${describeCondition(entry.condition)}、このカードのコストを${Math.abs(entry.value || 0)}少なくする`);
    });
    (definition.selfKeywords || []).forEach(function granted(entry) {
      lines.push(`${describeCondition(entry.condition)}、このカードは「${keywordLabel(entry.keyword)}」を得る`);
    });
    mergeParts((definition.abilities || []).map(abilityParts).filter(Boolean))
      .forEach(function line(part) { lines.push(composeAbility(part)); });
    if (definition.hyperMode) {
      const parts = [];
      if (definition.hyperMode.power != null) parts.push(`パワー${definition.hyperMode.power}`);
      (definition.hyperMode.keywords || []).forEach(function keyword(value) { parts.push(`「${keywordLabel(value)}」`); });
      (definition.hyperMode.abilities || []).map(describeAbility).filter(Boolean).forEach(function line(value) { parts.push(value); });
      if (parts.length) lines.push(`【ハイパーモード】${parts.join(" ／ ")}`);
    }
    if (definition.soulX) {
      // 与える条件はここで一度だけ言う。中の能力にも同じ条件が書いてあるので、
      // そのまま並べると「〜あれば、〜あれば」と二重になる。
      const soulCondition = describeCondition(definition.soulX.condition);
      const inner = (definition.soulX.abilities || []).map(function strip(ability) {
        return describeAbility(Object.assign({}, ability, { condition:null }));
      }).filter(Boolean);
      (definition.soulX.keywords || []).forEach(function keyword(value) { inner.push(`「${keywordLabel(value)}」を与える`); });
      if (inner.length) {
        lines.push(joinParts(["【超魂X】このカードが他のクリーチャーの下にあれば、その上のクリーチャーは", soulCondition ? `${soulCondition}、` : "", inner.join(" ／ ")]));
      }
    }
    if (definition.evolution && definition.evolution.neo) {

  }

  engine.describeAbilities = describeAbilities;
